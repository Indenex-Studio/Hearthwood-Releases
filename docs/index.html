asting<\/h2>\n<p>Stand at the water's edge facing the water and use the line to cast it a few steps out. Fish live in ponds, lakes, streams and the sea; very shallow water will not do. If you are thirsty, the same key drinks first. Use it again to gather the line in and try somewhere else.<\/p>\n<h2 data-h=\"the-bite-and-the-fight\">The bite and the fight<\/h2>\n<p>Fish take up to a minute to bite. When one does, the float dips and splashes: press the Use key at once to strike and set the hook. Too slow, and the fish lets go; leave the line out and another will come. A small fish comes straight in. A bigger one fights: hold the Use key to reel it in, and lean against the way it runs with the left and right walking keys. Watch the line's tension. Too tight for too long and the line snaps; too slack and the fish slips the hook. Either way you can cast again. The Fishing skill gives you longer to strike and a steadier line.<\/p>\n<h2 data-h=\"what-you-catch\">What you catch<\/h2>\n<p>Each water holds its own fish, and the time of day and the season change which ones bite.<\/p>\n<ul><li>\n<strong>Streams and rivers:<\/strong> pebblefins and sunbacks, freckled brook darters at dawn and dusk, and moonribbons at night, most of all in autumn.\n<\/li><li>\n<strong>Ponds and lakes:<\/strong> pebblefins and sunbacks by day, heavy wallowbacks on summer evenings and nights, a long duck-billed reedjaw in the deeper water by day, and moonribbons at night.\n<\/li><li>\n<strong>The sea:<\/strong> pebblefins, sandplates and, at dawn and dusk, tideguards in the shallows near the shore; stonebellies and glimmerlings in deeper water, and long dark deeplings far out over the deep sea at night. A boat takes you out to the deep water.\n<\/li><li>\n<strong>Shoals:<\/strong> out on the sea, look for a dark patch of restless water with rings, leaping fish and gulls diving into it. They drift along the coast for a while and then move on. Cast into one and the bites come much faster, nearly all of them the shoal's own fish.\n<\/li><li>\n<strong>Anywhere:<\/strong> very rarely, a golden sunscale. When you are aboard, open the right-click menu on your boat to cast or reel in.\n<\/li><\/ul>\n<h2 data-h=\"eating\">Eating<\/h2>\n<p>Raw fish is not eaten. Roast it over a burning fire like any other meat and take it off before it chars. A bigger fish makes a bigger meal. Fishing trains the Fishing skill.<\/p>\n<p>Back to the <a href=\"#home\">wiki<\/a>.<\/p>\n<h2 data-h=\"bait\">Bait<\/h2>\n<p>Bait is never needed, but it helps. Dig damp ground near water and now and then you turn up a worm. Cut a pebblefin up with a sharp edge and you get three pieces of cut bait. With bait in your bag, the hook is baited when you cast: fish come to it sooner, and the fish that like that bait come more often. Most river and pond fish like worms; reedjaws, moonribbons and stonebellies like cut bait. If you carry both, the bait the fish here like best goes on. Bait is only used up when you land a fish or the line snaps, so a missed bite costs nothing.<\/p>\n<h2 data-h=\"colourings\">Colourings<\/h2>\n<p>Every kind of fish comes in three colourings. Most you catch wear the common one; now and then one has an unusual colouring, and a rare one is a real find. A skilled angler lands the unusual and rare ones more often. You learn which when the fish is landed. Every fish also has a weight, and the journal's Fish page keeps your biggest of each kind and a box for each colouring you have caught.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Fish<\/th><th>Common<\/th><th>Unusual<\/th><th>Rare<\/th><\/tr><\/thead><tbody><tr><td>Pebblefin<\/td><td>river silver<\/td><td>sandy gold<\/td><td>moss green<\/td><\/tr><tr><td>Sunback<\/td><td>gold barred<\/td><td>copper<\/td><td>blue-grey<\/td><\/tr><tr><td>Brook darter<\/td><td>olive<\/td><td>silver<\/td><td>gold and black<\/td><\/tr><tr><td>Wallowback<\/td><td>bronze<\/td><td>orange patched<\/td><td>pearl white<\/td><\/tr><tr><td>Reedjaw<\/td><td>reed green<\/td><td>bog brown<\/td><td>frost silver<\/td><\/tr><tr><td>Moonribbon<\/td><td>river dark<\/td><td>amber<\/td><td>moonlit blue<\/td><\/tr><tr><td>Stonebelly<\/td><td>grey<\/td><td>rust<\/td><td>sea-glass green<\/td><\/tr><tr><td>Glimmerling<\/td><td>silver striped<\/td><td>blue-backed<\/td><td>green-gold<\/td><\/tr><tr><td>Tideguard<\/td><td>slate<\/td><td>bronze<\/td><td>night black<\/td><\/tr><tr><td>Sandplate<\/td><td>sand<\/td><td>speckled<\/td><td>orange-spotted<\/td><\/tr><tr><td>Deepling<\/td><td>deep brown<\/td><td>ink blue<\/td><td>ghost pale<\/td><\/tr><tr><td>Sunscale<\/td><td>gold<\/td><td>rose gold<\/td><td>white gold<\/td><\/tr><\/tbody><\/table><\/div>", "text": "Fish are a light, steady meal for anyone who lives near water. What you need A fishing line: a cord on a stick, with a sharp stone tied on as a hook. It wears down a little with each fish and can be mended at a repair table. Casting Stand at the water's edge facing the water and use the line to cast it a few steps out. Fish live in ponds, lakes, streams and the sea; very shallow water will not do. If you are thirsty, the same key drinks first. Use it again to gather the line in and try somewhere else. The bite and the fight Fish take up to a minute to bite. When one does, the float dips and splashes: press the Use key at once to strike and set the hook. Too slow, and the fish lets go; leave the line out and another will come. A small fish comes straight in. A bigger one fights: hold the Use key to reel it in, and lean against the way it runs with the left and right walking keys. Watch the line's tension. Too tight for too long and the line snaps; too slack and the fish slips the hook. Either way you can cast again. The Fishing skill gives you longer to strike and a steadier line. What you catch Each water holds its own fish, and the time of day and the season change which ones bite. Streams and rivers: pebblefins and sunbacks, freckled brook darters at dawn and dusk, and moonribbons at night, most of all in autumn. Ponds and lakes: pebblefins and sunbacks by day, heavy wallowbacks on summer evenings and nights, a long duck-billed reedjaw in the deeper water by day, and moonribbons at night. The sea: pebblefins, sandplates and, at dawn and dusk, tideguards in the shallows near the shore; stonebellies and glimmerlings in deeper water, and long dark deeplings far out over the deep sea at night. A boat takes you out to the deep water. Shoals: out on the sea, look for a dark patch of restless water with rings, leaping fish and gulls diving into it. They drift along the coast for a while and then move on. Cast into one and the bites come much faster, nearly all of them the shoal's own fish. Anywhere: very rarely, a golden sunscale. When you are aboard, open the right-click menu on your boat to cast or reel in. Eating Raw fish is not eaten. Roast it over a burning fire like any other meat and take it off before it chars. A bigger fish makes a bigger meal. Fishing trains the Fishing skill. Back to the wiki . Bait Bait is never needed, but it helps. Dig damp ground near water and now and then you turn up a worm. Cut a pebblefin up with a sharp edge and you get three pieces of cut bait. With bait in your bag, the hook is baited when you cast: fish come to it sooner, and the fish that like that bait come more often. Most river and pond fish like worms; reedjaws, moonribbons and stonebellies like cut bait. If you carry both, the bait the fish here like best goes on. Bait is only used up when you land a fish or the line snaps, so a missed bite costs nothing. Colourings Every kind of fish comes in three colourings. Most you catch wear the common one; now and then one has an unusual colouring, and a rare one is a real find. A skilled angler lands the unusual and rare ones more often. You learn which when the fish is landed. Every fish also has a weight, and the journal's Fish page keeps your biggest of each kind and a box for each colouring you have caught. Fish Common Unusual Rare Pebblefin river silver sandy gold moss green Sunback gold barred copper blue-grey Brook darter olive silver gold and black Wallowback bronze orange patched pearl white Reedjaw reed green bog brown frost silver Moonribbon river dark amber moonlit blue Stonebelly grey rust sea-glass green Glimmerling silver striped blue-backed green-gold Tideguard slate bronze night black Sandplate sand speckled orange-spotted Deepling deep brown ink blue ghost pale Sunscale gold rose gold white gold"}, {"slug": "boats", "group": "On the water", "title": "Boats", "path": "", "html": "<p>Water is no longer a wall. Three boats let you cross it, each a step up from the last. Hold the boat in your bag, stand at the water's edge and use Launch; it is set down on the water just ahead of you.<\/p>\n<h2 data-h=\"the-log-raft\">The log raft<\/h2>\n<p>Lash logs into a raft. It is a slow wallow, about as quick as a fast stroll, but it is steady and carries several people. It needs no tool to drive.<\/p>\n<h2 data-h=\"the-dugout-canoe\">The dugout canoe<\/h2>\n<p>Hollow three logs with an axe to make a dugout canoe. It is quicker than the raft and turns much more easily, but it seats only two, and it moves only for a helmsman who is carrying a paddle. Carve a paddle from a log first, or the canoe will sit still. The helmsman sits and paddles, and strokes faster as the boat picks up speed; the other seat is a passenger.<\/p>\n<h2 data-h=\"the-plank-boat\">The plank boat<\/h2>\n<p>Carve logs into planks, lash them into a hull, and add a mast and a rough reed sail. It carries four and is the quickest of the three, but a sail runs on wind, not muscle:<\/p>\n<ul><li>\nRunning before a fair wind is fastest.\n<\/li><li>\nCrossing the wind is slower, and heading straight into it will not work. To go upwind, tack: zigzag across the wind.\n<\/li><li>\nIn a calm or head to wind you fall back to paddling, which is slow but means you are never stuck.\n<\/li><li>\nThe map shows a wind arrow, and streaks on the water show where the wind blows.\n<\/li><li>\nSteering a boat trains Seamanship, a basic skill open to everyone.\n<\/li><\/ul>\n<h2 data-h=\"who-can-steer\">Who can steer<\/h2>\n<p>Anyone can climb aboard as a passenger, but only the boat's owner, and the people the owner has let into their land (members of a claim the owner holds), can take the helm. The first person aboard who may steer takes it. If the helmsman steps off, the helm passes to the next person aboard who may steer; if nobody aboard may, the boat simply sits where it is. Town membership on its own does not count. The owner can also choose who may board at all, from the boat's menu.<\/p>\n<h2 data-h=\"getting-on-and-off\">Getting on and off<\/h2>\n<p>Walk up to a boat and use Board, or right-click it. Right-click also gives Pick up (the boat goes back into your bag) and, once aboard, Step ashore or Slip into the water. A boat that is left empty stays where it was until someone boards or picks it up. A boat stops short of the shore: shallow water grounds it, and the canoe and plank boat need a little more depth than the raft.<\/p>\n<p>A helmsman's boat keeps moving only while they keep steering, so an abandoned boat drifts to a halt instead of running off by itself.<\/p>\n<p>Next: <a href=\"#mining\">Mining<\/a><\/p>", "text": "Water is no longer a wall. Three boats let you cross it, each a step up from the last. Hold the boat in your bag, stand at the water's edge and use Launch; it is set down on the water just ahead of you. The log raft Lash logs into a raft. It is a slow wallow, about as quick as a fast stroll, but it is steady and carries several people. It needs no tool to drive. The dugout canoe Hollow three logs with an axe to make a dugout canoe. It is quicker than the raft and turns much more easily, but it seats only two, and it moves only for a helmsman who is carrying a paddle. Carve a paddle from a log first, or the canoe will sit still. The helmsman sits and paddles, and strokes faster as the boat picks up speed; the other seat is a passenger. The plank boat Carve logs into planks, lash them into a hull, and add a mast and a rough reed sail. It carries four and is the quickest of the three, but a sail runs on wind, not muscle: Running before a fair wind is fastest. Crossing the wind is slower, and heading straight into it will not work. To go upwind, tack: zigzag across the wind. In a calm or head to wind you fall back to paddling, which is slow but means you are never stuck. The map shows a wind arrow, and streaks on the water show where the wind blows. Steering a boat trains Seamanship, a basic skill open to everyone. Who can steer Anyone can climb aboard as a passenger, but only the boat's owner, and the people the owner has let into their land (members of a claim the owner holds), can take the helm. The first person aboard who may steer takes it. If the helmsman steps off, the helm passes to the next person aboard who may steer; if nobody aboard may, the boat simply sits where it is. Town membership on its own does not count. The owner can also choose who may board at all, from the boat's menu. Getting on and off Walk up to a boat and use Board, or right-click it. Right-click also gives Pick up (the boat goes back into your bag) and, once aboard, Step ashore or Slip into the water. A boat that is left empty stays where it was until someone boards or picks it up. A boat stops short of the shore: shallow water grounds it, and the canoe and plank boat need a little more depth than the raft. A helmsman's boat keeps moving only while they keep steering, so an abandoned boat drifts to a halt instead of running off by itself. Next: Mining"}, {"slug": "big-boat", "group": "On the water", "title": "The big boat", "path": "", "html": "<p>A big boat carries up to eight people and a hold of stores. It is too heavy to carry, so a group builds it together on the beach.<\/p>\n<h2 data-h=\"building-it\">Building it<\/h2>\n<p>Open the build menu (B) and pick the big boat frame under Boats. Place it on a beach within about 60 steps of deep water. While you place it, the frame turns by itself to face the nearest deep water (press T to turn it yourself), and a faint line on the ground shows where the boat will slide in. If no direction reaches deep water from where you stand, the frame turns red and says so: walk closer to the water. Then add materials with Use, in three stages: the bottom and ribs, then the boards, then the masts and sails. Anyone can add to it, so a crew can bring planks in turns. When the last stage is full, the boat slides into the water by itself and the frame is gone.<\/p>\n<h2 data-h=\"aboard\">Aboard<\/h2>\n<p>Step on from the right-click menu on the boat. The first person aboard steers; the others ride. Right-click the boat and pick Open the hold to put things in or take them out, aboard or from the shore. Only the owner and their claim's members can use the hold. Only the owner and their claim's members can take the wheel, but anyone can ride.<\/p>\n<p>The big boat is a painted wooden sailboat with a mast and sail, and you trim the sail for the wind and drop an anchor. Each seat has its own crew job, and the sailing line on screen says who holds which. Whoever takes the lookout seat is told the nearest land and boats. Storm seas push the boat along or hold it back, and it leans outward in a turn.<\/p>\n<h2 data-h=\"leaving-it\">Leaving it<\/h2>\n<p>A boat left unused for 14 days (7 for the small ones), and not on someone's claim, washes up on the shore within a few hundred steps of where it floated. Nothing is lost; go and find it. A boat in a claim stays where it is.<\/p>\n<p>Back to <a href=\"#boats\">Boats<\/a>.<\/p>", "text": "A big boat carries up to eight people and a hold of stores. It is too heavy to carry, so a group builds it together on the beach. Building it Open the build menu (B) and pick the big boat frame under Boats. Place it on a beach within about 60 steps of deep water. While you place it, the frame turns by itself to face the nearest deep water (press T to turn it yourself), and a faint line on the ground shows where the boat will slide in. If no direction reaches deep water from where you stand, the frame turns red and says so: walk closer to the water. Then add materials with Use, in three stages: the bottom and ribs, then the boards, then the masts and sails. Anyone can add to it, so a crew can bring planks in turns. When the last stage is full, the boat slides into the water by itself and the frame is gone. Aboard Step on from the right-click menu on the boat. The first person aboard steers; the others ride. Right-click the boat and pick Open the hold to put things in or take them out, aboard or from the shore. Only the owner and their claim's members can use the hold. Only the owner and their claim's members can take the wheel, but anyone can ride. The big boat is a painted wooden sailboat with a mast and sail, and you trim the sail for the wind and drop an anchor. Each seat has its own crew job, and the sailing line on screen says who holds which. Whoever takes the lookout seat is told the nearest land and boats. Storm seas push the boat along or hold it back, and it leans outward in a turn. Leaving it A boat left unused for 14 days (7 for the small ones), and not on someone's claim, washes up on the shore within a few hundred steps of where it floated. Nothing is lost; go and find it. A boat in a claim stays where it is. Back to Boats ."}, {"slug": "glossary", "group": "Reference", "title": "Glossary", "path": "", "html": "<p>Words this wiki and the game use again and again. Each entry points to the page that says more.<\/p>\n<ul><li>\n<strong>Blueprint<\/strong>: the see-through shape you place from the build menu before anything is built. See <a href=\"#building-and-claims\">Building and claims<\/a>.\n<\/li><li>\n<strong>Cairn<\/strong>: a small heap of stones. Your claim marker, a lashed post with a cloth, stands on one.\n<\/li><li>\n<strong>Claim<\/strong>: land you own, marked out by a claim marker. Inside it your things are yours. A claim left untended for too long decays. See <a href=\"#building-and-claims\">Building and claims<\/a>.\n<\/li><li>\n<strong>Claim marker<\/strong>: the post you place from the build menu to claim an area. Use it to open the claim window, name the claim and tend it.\n<\/li><li>\n<strong>Coins<\/strong>: copper, silver and gold, a hundred of each to the next. Notice boards pay them for small jobs. See <a href=\"#towns\">Towns<\/a>.\n<\/li><li>\n<strong>Drill<\/strong>: the hand tool that makes a fire from friction. See <a href=\"#light-and-lamps\">Light and lamps<\/a>.\n<\/li><li>\n<strong>Fired<\/strong>: baked hard in a fire or kiln. Clay must be dry before it can be fired safely. See <a href=\"#clay-and-pottery\">Clay and pottery<\/a>.\n<\/li><li>\n<strong>Hearth<\/strong>: the place a fire is kept. A fire that burns out leaves a cold hearth, and a new fire lit beside it rekindles it. Built hearths go inside a hut or house.\n<\/li><li>\n<strong>Journal<\/strong>: the book of what you have learned, with \"Things to try\" lines that nudge you toward the next goal without giving the recipe. See <a href=\"#crafting-and-skills\">Crafting and skills<\/a>.\n<\/li><li>\n<strong>Kiln<\/strong>: a built oven for firing clay. A small kiln fires a few pots more safely than an open fire; the full kiln fires bigger work such as jars. See <a href=\"#clay-and-pottery\">Clay and pottery<\/a>.\n<\/li><li>\n<strong>Kindling<\/strong>: dry twigs, stems and bark that catch fast and start a fire. See <a href=\"#gathering\">Gathering<\/a>.\n<\/li><li>\n<strong>Map table<\/strong>: a table built inside a claim that shows the land everyone with rights in the claim has walked. See <a href=\"#maps\">Maps<\/a>.\n<\/li><li>\n<strong>Mayor<\/strong>: the first office on a new roster, held by whoever signed first. See <a href=\"#towns\">Towns<\/a>.\n<\/li><li>\n<strong>Office<\/strong>: a seat on a town that members vote for. Some offices can take things from the town store. See <a href=\"#towns\">Towns<\/a>.\n<\/li><li>\n<strong>Outcrop<\/strong>: bare rock that may hold ore. Not every outcrop does. See <a href=\"#mining\">Mining<\/a>.\n<\/li><li>\n<strong>Pen<\/strong>: a fenced yard for keeping animals. See <a href=\"#animals\">Animals<\/a>.\n<\/li><li>\n<strong>Roster<\/strong>: the list of neighbours who have signed up together as a town. See <a href=\"#towns\">Towns<\/a>.\n<\/li><li>\n<strong>Signal fire<\/strong>: a short, tall, smoky fire that can be seen from far away. See <a href=\"#light-and-lamps\">Light and lamps<\/a>.\n<\/li><li>\n<strong>Skill<\/strong>: something you get better at by doing it. Skills start low and rise slowly. See <a href=\"#crafting-and-skills\">Crafting and skills<\/a>.\n<\/li><li>\n<strong>Snare<\/strong>: a trap of cord set where rabbits run. See <a href=\"#hunting-and-snares\">Hunting and snares<\/a>.\n<\/li><li>\n<strong>Tending<\/strong>: pressing Use at a claim marker now and then so the claim does not decay.\n<\/li><li>\n<strong>Tinder<\/strong>: very fine dry fiber that takes the first spark. See <a href=\"#getting-started\">Getting started<\/a>.\n<\/li><li>\n<strong>Use (E)<\/strong>: the key for the action the game offers at what you are looking at. A Use prompt means something can be done. See <a href=\"#controls\">Keys and controls<\/a>.\n<\/li><\/ul>\n<p>Back to the <a href=\"#home\">wiki home<\/a><\/p>", "text": "Words this wiki and the game use again and again. Each entry points to the page that says more. Blueprint : the see-through shape you place from the build menu before anything is built. See Building and claims . Cairn : a small heap of stones. Your claim marker, a lashed post with a cloth, stands on one. Claim : land you own, marked out by a claim marker. Inside it your things are yours. A claim left untended for too long decays. See Building and claims . Claim marker : the post you place from the build menu to claim an area. Use it to open the claim window, name the claim and tend it. Coins : copper, silver and gold, a hundred of each to the next. Notice boards pay them for small jobs. See Towns . Drill : the hand tool that makes a fire from friction. See Light and lamps . Fired : baked hard in a fire or kiln. Clay must be dry before it can be fired safely. See Clay and pottery . Hearth : the place a fire is kept. A fire that burns out leaves a cold hearth, and a new fire lit beside it rekindles it. Built hearths go inside a hut or house. Journal : the book of what you have learned, with \"Things to try\" lines that nudge you toward the next goal without giving the recipe. See Crafting and skills . Kiln : a built oven for firing clay. A small kiln fires a few pots more safely than an open fire; the full kiln fires bigger work such as jars. See Clay and pottery . Kindling : dry twigs, stems and bark that catch fast and start a fire. See Gathering . Map table : a table built inside a claim that shows the land everyone with rights in the claim has walked. See Maps . Mayor : the first office on a new roster, held by whoever signed first. See Towns . Office : a seat on a town that members vote for. Some offices can take things from the town store. See Towns . Outcrop : bare rock that may hold ore. Not every outcrop does. See Mining . Pen : a fenced yard for keeping animals. See Animals . Roster : the list of neighbours who have signed up together as a town. See Towns . Signal fire : a short, tall, smoky fire that can be seen from far away. See Light and lamps . Skill : something you get better at by doing it. Skills start low and rise slowly. See Crafting and skills . Snare : a trap of cord set where rabbits run. See Hunting and snares . Tending : pressing Use at a claim marker now and then so the claim does not decay. Tinder : very fine dry fiber that takes the first spark. See Getting started . Use (E) : the key for the action the game offers at what you are looking at. A Use prompt means something can be done. See Keys and controls . Back to the wiki home"}, {"slug": "items", "group": "Reference", "title": "Items", "path": "", "html": "<p>Everything you can find, make or build, in the game's own words: this is what each thing says when you hover over it. Things are grouped the way the craft and build menus group them. Where a thing comes from and what it goes into are left for you to find out.<\/p>\n<h2 data-h=\"things-you-carry\">Things you carry<\/h2>\n<h3 data-h=\"found-in-the-world\">Found in the world<\/h3>\n<ul><li>\n<strong>Stick:<\/strong> A dry fallen stick. Kindling for a fire and the handle of many simple tools.\n<\/li><li>\n<strong>Stone:<\/strong> A hard, fist-sized stone. Good for knocking and chipping, and the start of most stone tools.\n<\/li><li>\n<strong>Plant fiber:<\/strong> Tough strands stripped from wild plants. Twisted into cord and thread, or shredded to catch a spark.\n<\/li><li>\n<strong>Clay:<\/strong> Wet, sticky earth dug from the ground. It needs cleaning before it can be shaped.\n<\/li><li>\n<strong>Log:<\/strong> A length of felled tree trunk. Long-burning firewood, and timber for boats, tools and building.\n<\/li><li>\n<strong>Spider silk:<\/strong> Fine, strong silk gathered from spider webs. It can be twisted into yarn.\n<\/li><li>\n<strong>Iron ore:<\/strong> Rusty, heavy rock that holds iron. Smelted to draw the metal out.\n<\/li><li>\n<strong>Raw wool:<\/strong> Raw wool shorn from a sheep. Spun on a spindle into yarn.\n<\/li><li>\n<strong>Antler:<\/strong> A branched antler from a deer. Hard and strong, kept from the hunt.\n<\/li><li>\n<strong>Feather:<\/strong> A hen's feather. Used to fletch arrows so they fly true.\n<\/li><li>\n<strong>Dead hen:<\/strong> A hen carried whole. A blade turns it into meat and feathers.\n<\/li><li>\n<strong>Charcoal:<\/strong> A stick burned black without flame. Burns hot enough to smelt metal, and draws a dark line.\n<\/li><li>\n<strong>Drawn map:<\/strong> A map of the land, drawn in charcoal. It shows the ground you have walked.\n<\/li><li>\n<strong>Flint:<\/strong> A hard, glassy stone that breaks to a sharp edge. Found on high, rocky ground.\n<\/li><li>\n<strong>Slate:<\/strong> A flat, dark stone that splits into thin sheets. Found on high, rocky ground.\n<\/li><li>\n<strong>Copper ore:<\/strong> Green-flecked rock that holds copper. Smelted down, it gives the first metal.\n<\/li><li>\n<strong>Reed:<\/strong> A tall marsh reed, light and pliant. Woven into sails, and quick to burn.\n<\/li><li>\n<strong>Peat:<\/strong> Dark earth cut from a bog and dried. A steady fuel where trees are few.\n<\/li><li>\n<strong>Driftwood:<\/strong> Wood washed up on the shore, dried by sun and salt. Good fuel for a beach fire.\n<\/li><li>\n<strong>Shell:<\/strong> A cockle shell from the shore, ridged and pale.\n<\/li><li>\n<strong>Dead rabbit:<\/strong> A rabbit carried whole. A blade turns it into meat and fur.\n<\/li><li>\n<strong>Hen:<\/strong> A calm hen, held gently. Set it down where you want it to live.\n<\/li><li>\n<strong>Rabbit:<\/strong> A calm rabbit, held gently. Set it down where you want it to live.\n<\/li><li>\n<strong>Milk:<\/strong> Fresh milk, taken from a tame animal.\n<\/li><li>\n<strong>Bone:<\/strong> A clean bone from a butchered animal. Kept for crafts still to come.\n<\/li><li>\n<strong>Tin ore:<\/strong> Dull grey rock that holds tin. Smelted with copper, it makes bronze.\n<\/li><li>\n<strong>Old bone:<\/strong> A dry, yellowed bone left by the restless dead.\n<\/li><li>\n<strong>Acorn:<\/strong> An oak's seed. Plant it and, given time, an oak tree grows.\n<\/li><li>\n<strong>Pine cone:<\/strong> A pine's seed cone. Plant it and, given time, a pine tree grows.\n<\/li><li>\n<strong>Bush cutting:<\/strong> A green cutting taken from a bush. Plant it to grow a new bush.\n<\/li><li>\n<strong>Flower seed:<\/strong> A small seed from a wildflower. Plant it and flowers come up before long.\n<\/li><li>\n<strong>Softwood log:<\/strong> A length of pine trunk, light and straight. Long-burning firewood, and timber for anything that takes a log.\n<\/li><li>\n<strong>Hardwood log:<\/strong> A length of broadleaf trunk, dense and strong. Long-burning firewood, and timber for anything that takes a log.\n<\/li><\/ul>\n<h3 data-h=\"tools\">Tools<\/h3>\n<ul><li>\n<strong>Sharp stone:<\/strong> A thin stone flake with a keen edge. It cuts on its own and makes the blade of better tools.\n<\/li><li>\n<strong>Hand axe:<\/strong> A stone shaped to an edge and held in the hand. It cuts and knocks, and leads to a hafted axe.\n<\/li><li>\n<strong>Spear:<\/strong> A long shaft tipped with sharp stone. Thrown or thrust, it is a hunter's first weapon.\n<\/li><li>\n<strong>Stone axe:<\/strong> A stone head lashed to a wooden handle. It fells trees and serves as a weapon in a pinch.\n<\/li><li>\n<strong>Stone knife:<\/strong> A small stone blade with a grip. For cutting, skinning and fine work.\n<\/li><li>\n<strong>Digging stick:<\/strong> A stout stick carved to a point. It breaks soil and digs up clay and roots.\n<\/li><li>\n<strong>Bow drill:<\/strong> A small bow strung to spin a drill. It makes fire faster and more surely than bare hands.\n<\/li><li>\n<strong>Bow:<\/strong> A strung bow of bent wood. With arrows it lets you hunt from a distance.\n<\/li><li>\n<strong>Arrow:<\/strong> A straight shaft with a point. Shot from a bow at game or foes.\n<\/li><li>\n<strong>Spade:<\/strong> A broad wooden digging blade on a handle. It moves earth faster than a digging stick.\n<\/li><li>\n<strong>Short sword:<\/strong> A short blade made of wood and sharp stone. A weapon for close quarters.\n<\/li><li>\n<strong>Wooden shield:<\/strong> A wooden shield faced with hide. Held up to turn aside blows.\n<\/li><li>\n<strong>Copper axe:<\/strong> An axe with a copper head. It chops faster and lasts longer than stone.\n<\/li><li>\n<strong>Iron axe:<\/strong> An axe with an iron head. A strong tool for felling trees.\n<\/li><li>\n<strong>Bronze axe:<\/strong> An axe with a bronze head. Harder and keener than copper.\n<\/li><li>\n<strong>Steel axe:<\/strong> An axe with a steel head. The finest tool for felling trees.\n<\/li><li>\n<strong>Steel pickaxe:<\/strong> A pickaxe with a steel head. It breaks hard rock and ore.\n<\/li><li>\n<strong>Bronze pickaxe:<\/strong> A pickaxe with a bronze head. It breaks stone and ore.\n<\/li><li>\n<strong>Spindle:<\/strong> A weighted stick for spinning. It turns raw wool into yarn.\n<\/li><li>\n<strong>Torch:<\/strong> A stick wound with fiber. Carried lit, it lights the way after dark.\n<\/li><li>\n<strong>Stone pick:<\/strong> A sharp stone bound to a handle. Breaks ore and rock loose.\n<\/li><\/ul>\n<h3 data-h=\"fire-and-food\">Fire and food<\/h3>\n<ul><li>\n<strong>Tinder bundle:<\/strong> A loose bundle of dry, shredded fiber. It takes a spark and gives a new fire its first flame.\n<\/li><li>\n<strong>Pot of berry broth:<\/strong> A clay pot of warm berry broth. A good, comforting meal.\n<\/li><li>\n<strong>Pot of mutton stew:<\/strong> A clay pot of stew, thick with meat and roots.\n<\/li><li>\n<strong>Animal fat:<\/strong> Animal fat melted down and set. Fuel for a clay lamp.\n<\/li><li>\n<strong>Small pot of berry broth:<\/strong> A small clay pot of berry broth. A light, warm meal.\n<\/li><li>\n<strong>Berries:<\/strong> Small wild berries picked from bushes. A bite on the road, and sweet in a broth.\n<\/li><li>\n<strong>Waterskin of water:<\/strong> A hide waterskin full of water. A drink you can carry far.\n<\/li><li>\n<strong>Hazelnut:<\/strong> A wild hazelnut. A small snack, or pressed for oil.\n<\/li><li>\n<strong>Mushroom:<\/strong> A wild mushroom from the forest floor. Edible raw, better in a stew.\n<\/li><li>\n<strong>Wild root:<\/strong> A starchy root dug from the wild. A plain bite raw, and the heart of many stews.\n<\/li><li>\n<strong>Wild greens:<\/strong> Leafy wild greens. A light bite, or cooked into a stew.\n<\/li><li>\n<strong>Dried meat:<\/strong> Meat dried slowly on a rack. It keeps well and travels well.\n<\/li><li>\n<strong>Raw mutton:<\/strong> Raw meat from a sheep. Roast, stew or dry it before eating. Its fat can be melted down.\n<\/li><li>\n<strong>Roast mutton:<\/strong> Mutton roasted over a fire. A hearty, filling meal.\n<\/li><li>\n<strong>Burnt mutton:<\/strong> Mutton left too long on the fire. Edible, but there is little good left in it.\n<\/li><li>\n<strong>Raw venison:<\/strong> Raw meat from a deer. Roast, stew or dry it before eating.\n<\/li><li>\n<strong>Roast venison:<\/strong> Venison roasted over a fire. A rich, filling meal.\n<\/li><li>\n<strong>Burnt venison:<\/strong> Venison left too long over the fire, charred and dry. It still fills a little.\n<\/li><li>\n<strong>Egg:<\/strong> A hen's egg, laid in the yard. Eaten raw or boiled for a better meal.\n<\/li><li>\n<strong>Raw chicken:<\/strong> Fresh meat from a hen. Roast it, stew it or dry it before eating.\n<\/li><li>\n<strong>Roast chicken:<\/strong> A whole hen roasted over the fire. A filling meal.\n<\/li><li>\n<strong>Burnt chicken:<\/strong> Chicken left too long over the fire, blackened and tough. It still fills a little.\n<\/li><li>\n<strong>Boiled egg:<\/strong> An egg cooked hard in the embers. A small, honest meal.\n<\/li><li>\n<strong>Burnt egg:<\/strong> An egg left too long in the heat. Little good left in it.\n<\/li><li>\n<strong>Raw rabbit:<\/strong> Fresh meat from a rabbit. Roast it, stew it or dry it before eating.\n<\/li><li>\n<strong>Roast rabbit:<\/strong> A rabbit roasted over the fire. A good meal for the road.\n<\/li><li>\n<strong>Burnt rabbit:<\/strong> Rabbit left too long over the fire, charred and dry. Little good left in it.\n<\/li><\/ul>\n<h3 data-h=\"cord-and-weaving\">Cord and weaving<\/h3>\n<ul><li>\n<strong>Cord:<\/strong> Plant fiber twisted into a strong cord. It lashes heads to handles and holds things together.\n<\/li><li>\n<strong>Basket:<\/strong> A woven basket worn on the back. It holds a few things of its own and lets you carry more.\n<\/li><li>\n<strong>Plant thread:<\/strong> Fine plant fiber twisted into thread. For weaving cloth and sewing.\n<\/li><li>\n<strong>Plant cloth:<\/strong> A rough cloth woven from plant thread. The material for simple clothes.\n<\/li><li>\n<strong>Sleeping mat:<\/strong> A mat of woven grass. Lay it inside a hut or house to sleep and wake on.\n<\/li><li>\n<strong>Wool yarn:<\/strong> Spun yarn, soft and strong. Knitted or woven into warm clothing.\n<\/li><li>\n<strong>Wool cloth:<\/strong> A warm cloth woven from wool yarn. The material for tunics, cloaks and hoods.\n<\/li><li>\n<strong>Rabbit snare:<\/strong> A noose of cord between two sticks. Set it down where rabbits run and come back to check it.\n<\/li><li>\n<strong>Fishing line:<\/strong> A length of line with a hook, for fishing by hand. It wears with use.\n<\/li><\/ul>\n<h3 data-h=\"clay\">Clay<\/h3>\n<ul><li>\n<strong>Clean clay:<\/strong> Clay picked clean of stones and roots. Ready to mix, mold or shape.\n<\/li><li>\n<strong>Crushed stone:<\/strong> Stone crushed to coarse grit. Mixed into clay so it holds up in the fire.\n<\/li><li>\n<strong>Mixed clay:<\/strong> Clay mixed with grit or crushed pottery so it does not crack in the fire. Shaped into pots, cups, lamps and tiles.\n<\/li><li>\n<strong>Broken pottery:<\/strong> Pieces of a broken pot. Crushed, they help new clay survive the fire.\n<\/li><li>\n<strong>Crushed pottery:<\/strong> Old pottery crushed fine. Mixed into clay so new pots fire without cracking.\n<\/li><li>\n<strong>Small pot:<\/strong> A small fired clay pot. It carries a little water and simmers a little broth.\n<\/li><li>\n<strong>Clay pot:<\/strong> A fired clay pot built up in coils. It carries water and cooks stews over a fire.\n<\/li><li>\n<strong>Small pot of water:<\/strong> A small clay pot filled with water. Drink it, or set it on a fire to cook.\n<\/li><li>\n<strong>Clay pot of water:<\/strong> A clay pot full of water. Drink from it, or set it on a fire to simmer a stew.\n<\/li><li>\n<strong>Sun-dried brick:<\/strong> A block of clay dried hard in the sun. Laid with plaster to build walls and kilns.\n<\/li><li>\n<strong>Clay plaster:<\/strong> Wet clay plaster. It binds bricks and seals walls.\n<\/li><li>\n<strong>Unfired small pot:<\/strong> A small pot pinched from wet clay. It must be fired before it will hold water.\n<\/li><li>\n<strong>Unfired clay pot:<\/strong> A clay pot built from coils, still soft. Fire it to make it hard and watertight.\n<\/li><li>\n<strong>Unfired storage jar:<\/strong> A large storage jar of raw clay. Only a kiln heats it evenly enough to fire.\n<\/li><li>\n<strong>Storage jar:<\/strong> A large fired clay jar. Set it down to keep goods in store.\n<\/li><li>\n<strong>Unfired lamp:<\/strong> A small lamp shaped from wet clay. Fire it before it can hold oil.\n<\/li><li>\n<strong>Clay lamp:<\/strong> A small fired clay lamp. Filled with animal fat or nut oil, it gives a steady light.\n<\/li><li>\n<strong>Unfired roof tile:<\/strong> A roof tile pressed from wet clay. A kiln fires it hard.\n<\/li><li>\n<strong>Roof tile:<\/strong> A curved tile of fired clay. Laid in rows to roof a house against the rain.\n<\/li><li>\n<strong>Unfired clay trough:<\/strong> A large water trough of raw clay. Only a kiln heats it evenly enough to fire.\n<\/li><li>\n<strong>Clay trough:<\/strong> A big fired clay basin for drinking water. Set it down and fill it, and it catches rain outdoors.\n<\/li><li>\n<strong>Unfired cup:<\/strong> A cup shaped from wet clay. Fire it to make it hold water.\n<\/li><li>\n<strong>Clay cup:<\/strong> A small fired clay cup. Fill it with water to carry a drink.\n<\/li><li>\n<strong>Cup of water:<\/strong> A clay cup of fresh water. A quick drink.\n<\/li><\/ul>\n<h3 data-h=\"hide-and-clothing\">Hide and clothing<\/h3>\n<ul><li>\n<strong>Plant tunic:<\/strong> A plain tunic sewn from plant cloth. Light clothing for mild days.\n<\/li><li>\n<strong>Wool cap:<\/strong> A soft cap knitted from wool yarn. It keeps your head warm in cold weather.\n<\/li><li>\n<strong>Wool cloak:<\/strong> A hooded wool cloak worn over your clothes. Warmth for cold days and nights.\n<\/li><li>\n<strong>Leather tunic:<\/strong> A sturdy tunic sewn from leather. Tougher than cloth.\n<\/li><li>\n<strong>Waterskin:<\/strong> A pouch sewn from sheep hide. Fill it to carry water with you.\n<\/li><li>\n<strong>Sheep hide:<\/strong> A fresh hide from a sheep. Scraped clean, it is the start of leather.\n<\/li><li>\n<strong>Scraped hide:<\/strong> A hide scraped clean of flesh and hair. Dried into leather, or used as it is.\n<\/li><li>\n<strong>Leather:<\/strong> A hide stretched and dried into tough leather. For warm clothes and armour.\n<\/li><li>\n<strong>Wool tunic:<\/strong> A plain tunic sewn from wool cloth. Warm, soft clothing.\n<\/li><li>\n<strong>Leather foot wraps:<\/strong> Strips of leather wound about the feet. They keep your feet off the cold ground.\n<\/li><li>\n<strong>Deer hide:<\/strong> A fresh hide from a deer. Scraped clean, it is the start of leather.\n<\/li><li>\n<strong>Rabbit fur:<\/strong> A soft rabbit pelt. Lines hunting gear, and makes a fine surface to draw a map on.\n<\/li><li>\n<strong>Sinew:<\/strong> Tough cord from a butchered animal, dried and strong. Kept for crafts still to come.\n<\/li><li>\n<strong>Saddle bag:<\/strong> A pair of leather bags for a tame donkey's back. Fitted on, it lets the donkey carry a pack for you.\n<\/li><li>\n<strong>Mist-dark fur:<\/strong> Fur shed by a creature of the gloom, dark as smoke.\n<\/li><\/ul>\n<h3 data-h=\"metal\">Metal<\/h3>\n<ul><li>\n<strong>Melting pot:<\/strong> A clay pot lined to take great heat. Metal is melted in it to make bars.\n<\/li><li>\n<strong>Copper bar:<\/strong> A bar of smelted copper. The first metal for tools and armour.\n<\/li><li>\n<strong>Bronze bar:<\/strong> A bar of bronze, harder than copper. Worked into stronger tools and armour.\n<\/li><li>\n<strong>Copper axe head:<\/strong> A copper axe head, struck into shape. It waits for a handle.\n<\/li><li>\n<strong>Iron bar:<\/strong> A bar of smelted iron. Struck into tools, or refined further into steel.\n<\/li><li>\n<strong>Steel bar:<\/strong> A bar of refined steel, the hardest metal. Made into the best tools.\n<\/li><li>\n<strong>Iron axe head:<\/strong> An iron axe head, struck into shape. It waits for a handle.\n<\/li><li>\n<strong>Bronze axe head:<\/strong> A bronze axe head, struck into shape. It waits for a handle.\n<\/li><li>\n<strong>Steel axe head:<\/strong> A steel axe head, struck into shape. It waits for a handle.\n<\/li><li>\n<strong>Steel pick head:<\/strong> A steel pick head, struck into shape. It waits for a handle.\n<\/li><li>\n<strong>Bronze pick head:<\/strong> A bronze pick head, struck into shape. It waits for a handle.\n<\/li><\/ul>\n<h3 data-h=\"boats\">Boats<\/h3>\n<ul><li>\n<strong>Log raft:<\/strong> Logs lashed side by side. The simplest way across open water.\n<\/li><li>\n<strong>Dugout canoe:<\/strong> A single log hollowed into a canoe. Lighter and quicker on the water than a raft.\n<\/li><li>\n<strong>Paddle:<\/strong> A carved wooden paddle for moving a boat through the water.\n<\/li><li>\n<strong>Plank boat:<\/strong> A boat built from planks, with a mast and sail. Made for longer trips on open water.\n<\/li><li>\n<strong>Reed sail:<\/strong> Reeds woven into a broad sail. It catches the wind for a plank boat.\n<\/li><li>\n<strong>Mast:<\/strong> A long, straight trunk trimmed smooth. It holds the sail on a plank boat.\n<\/li><li>\n<strong>Plank:<\/strong> Wood split flat and even. For boats, shields and sturdy work, and it burns well too.\n<\/li><\/ul>\n<h3 data-h=\"armour\">Armour<\/h3>\n<ul><li>\n<strong>Ranger vest:<\/strong> A woodland ranger's vest of bark plates on a hide back, with no metal. Middle-weight armour for the chest. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Ranger hood:<\/strong> A ranger's pointed leaf hood with no metal. Middle-weight armour for the head. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Ranger pauldrons:<\/strong> Leaf sprays for the shoulders, pinned with bone studs. Middle-weight ranger armour. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Grove warden cuirass:<\/strong> A grove warden's cuirass of overlapping pinecone scales, plain bark with no metal. Heavy chest armour. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Grove warden helm:<\/strong> A grove warden's acorn-cap helm in plain bark. Heavy armour for the head. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Grove warden pauldrons:<\/strong> Oak-leaf pauldrons, each with an acorn, in plain bark. Heavy grove warden armour for the shoulders. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Huntsman jerkin:<\/strong> A huntsman's laced leather jerkin, with no metal. Light armour for the chest. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Huntsman hood:<\/strong> A huntsman's russet fox-ear hood with a fur rim, with no metal. Light armour for the head. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Huntsman mantle:<\/strong> A huntsman's fur mantle for the shoulders, with no metal. Light armour. Made in hide, copper, bronze, iron and steel.\n<\/li><li>\n<strong>Warden's cuirass:<\/strong> A cuirass of pinecone scales that a crypt warden wore, still sound after long years underground. Heavy chest armour; no smith can copy it.\n<\/li><li>\n<strong>Fire spell book:<\/strong> A hand-written account of how fire is gathered between the hands and thrown. Read once, it is yours.\n<\/li><li>\n<strong>Revive spell book:<\/strong> A hand-written account of how to call a fallen friend back to their feet. Read once, it is yours.\n<\/li><\/ul>\n<h3 data-h=\"gems-runes-and-patterns\">Gems, runes and patterns<\/h3>\n<ul><li>\n<strong>Gem chip:<\/strong> A tiny shard of coloured stone. Enough of them fuse into a rough gem.\n<\/li><li>\n<strong>Rough gem:<\/strong> An uncut gem, dull and cloudy. Cut, it shows its colour.\n<\/li><li>\n<strong>Cut gem:<\/strong> A gem cut and polished to catch the light. Set into a weapon, shield or tool, it lends it a quality of its own.\n<\/li><li>\n<strong>Bright gem:<\/strong> A rare gem with a light inside it. Set into a weapon, shield or tool, it glows in the dark.\n<\/li><li>\n<strong>Worn rune stone:<\/strong> An old stone marked with faded runes. A skilled hand can carve its rune onto a weapon or shield.\n<\/li><li>\n<strong>Deep rune stone:<\/strong> A stone cut with deep, old runes. Carved onto a weapon or shield, its rune keeps an edge, steadies a guard or hides your step.\n<\/li><li>\n<strong>Goblin pattern scrap:<\/strong> A torn scrap of a goblin pattern. Read it to learn a simple piece of set armour or a hidden recipe.\n<\/li><li>\n<strong>Old pattern sheet:<\/strong> A full sheet of old pattern work. Read it to learn harder recipes, such as copper and bronze armour.\n<\/li><li>\n<strong>Master pattern:<\/strong> A master's pattern, rare and complete. Read it to learn the hardest work, such as iron and steel armour.\n<\/li><\/ul>\n<h3 data-h=\"fish\">Fish<\/h3>\n<ul><li>\n<strong>Pebblefin<\/strong>\n<\/li><li>\n<strong>Sunback<\/strong>\n<\/li><li>\n<strong>Brook darter<\/strong>\n<\/li><li>\n<strong>Wallowback<\/strong>\n<\/li><li>\n<strong>Reedjaw<\/strong>\n<\/li><li>\n<strong>Moonribbon<\/strong>\n<\/li><li>\n<strong>Stonebelly<\/strong>\n<\/li><li>\n<strong>Glimmerling<\/strong>\n<\/li><li>\n<strong>Tideguard<\/strong>\n<\/li><li>\n<strong>Sandplate<\/strong>\n<\/li><li>\n<strong>Deepling<\/strong>\n<\/li><li>\n<strong>Sunscale<\/strong>\n<\/li><\/ul>\n<p>Every fish is roasted over a fire before it is eaten. See <a href=\"#fishing\">Fishing<\/a> for where each one bites.<\/p>\n<h3 data-h=\"other\">Other<\/h3>\n<ul><li>\n<strong>Nut oil:<\/strong> Oil pressed from hazelnuts. A clean-burning fuel for a clay lamp.\n<\/li><li>\n<strong>Shingle:<\/strong> A thin slat split from a log. Laid in overlapping rows to roof a timber house.\n<\/li><li>\n<strong>Wall panel:<\/strong> Boards and sticks cut to size ahead of time. A wall that stands in one piece, for building a house part by part.\n<\/li><li>\n<strong>Floor panel:<\/strong> Boards cut to size ahead of time. A floor that goes down in one piece, for building a house part by part.\n<\/li><\/ul>\n<h2 data-h=\"buildings-and-stations\">Buildings and stations<\/h2>\n<p>Grouped like the tabs of the build menu (B).<\/p>\n<h3 data-h=\"shelter\">Shelter<\/h3>\n<ul><li>\n<strong>Lean-to:<\/strong> Keeps off rain. A fire just in front warms you under it.\n<\/li><li>\n<strong>Clay hut:<\/strong> Dry inside in any rain. A fire on a raised hearth inside keeps it warm.\n<\/li><li>\n<strong>Mud-brick house:<\/strong> A dry room of your own. Any fire inside warms the whole room.\n<\/li><li>\n<strong>Log cabin:<\/strong> A dry room of your own. Any fire inside warms the whole room.\n<\/li><li>\n<strong>Tiled house:<\/strong> A dry room under a tile roof. Any fire inside warms the whole room.\n<\/li><li>\n<strong>Straw bed:<\/strong> Somewhere soft to lie down at home.\n<\/li><li>\n<strong>Fur bed:<\/strong> A soft bed. You wake here after a fall.\n<\/li><li>\n<strong>Timber cottage:<\/strong> The warmest home. Any fire inside warms the whole room.\n<\/li><li>\n<strong>Bench:<\/strong> Somewhere to sit by the fire.\n<\/li><li>\n<strong>Well:<\/strong> Fresh water to drink and fill pots, close to home.\n<\/li><\/ul>\n<h3 data-h=\"storage\">Storage<\/h3>\n<ul><li>\n<strong>Storage basket:<\/strong> Holds a few stacks of your things by the fire.\n<\/li><li>\n<strong>Storage jar:<\/strong> Keeps things dry. A better made jar holds more.\n<\/li><li>\n<strong>Clay trough:<\/strong> A fired clay basin set down and filled by hand from pots. It holds water to drink, and catches rain in the open.\n<\/li><li>\n<strong>Wooden chest:<\/strong> Holds plenty of your things, safe at home.\n<\/li><li>\n<strong>Storage shelf:<\/strong> Holds your things in plain sight.\n<\/li><li>\n<strong>Table:<\/strong> A table to set things on. Benches tuck in beside it.\n<\/li><\/ul>\n<h3 data-h=\"crafting\">Crafting<\/h3>\n<ul><li>\n<strong>Kiln:<\/strong> Fires pots hard, more surely than an open fire.\n<\/li><li>\n<strong>Crafting table:<\/strong> A work table for baskets, spindles, shields, wool clothing and hide armour.\n<\/li><li>\n<strong>Spindle station:<\/strong> A distaff stand with a stick frame, built around your spindle. Wool is spun into yarn here, and yarn woven into cloth.\n<\/li><li>\n<strong>Leather drying rack:<\/strong> Posts and a bar for hides and meat. Hides are scraped and stretched to dry here, and meat is hung to dry in strips.\n<\/li><li>\n<strong>Potter's bench:<\/strong> A split log bench where clay is shaped into pots, cups, lamps, roof tiles, jars and troughs. Nut oil is pressed here too.\n<\/li><li>\n<strong>Repair table:<\/strong> A sturdy table where worn tools are mended and put back to work.\n<\/li><li>\n<strong>Sundial:<\/strong> Tells everyone in your claim the time of day.\n<\/li><li>\n<strong>Settling tub:<\/strong> A tub that cleans dug clay of stones and roots. Load it and leave it to work.\n<\/li><li>\n<strong>Crushing block:<\/strong> A stone block for crushing stone or broken pottery fine. Load it and leave it to work.\n<\/li><li>\n<strong>Kneading trough:<\/strong> A trough for working crushed stone or pottery into clay so pots hold up in the fire. Clay plaster is mixed here too.\n<\/li><li>\n<strong>Map table:<\/strong> A hide-topped table that shows the land your claim and town have walked, as far as your Map making reaches.\n<\/li><li>\n<strong>Small kiln:<\/strong> A small first kiln. It fires a few pots more safely than an open fire, but not the big pieces.\n<\/li><li>\n<strong>Drying shelf:<\/strong> Wet pots and bricks set on it dry faster, and the rain can't reach them.\n<\/li><li>\n<strong>Sawing table:<\/strong> A bench with a long hand saw. Houses are built part by part on a claim, or in a town, that has one.\n<\/li><li>\n<strong>Stone-breaking bench:<\/strong> A heavy bench for breaking stone down to size. A claim or town with one is ready for big stone works.\n<\/li><\/ul>\n<h3 data-h=\"fire\">Fire<\/h3>\n<ul><li>\n<strong>Raised hearth:<\/strong> Goes inside a hut or house. A fire on it keeps the home warm.\n<\/li><li>\n<strong>Stone-ringed hearth:<\/strong> A fire on it warms much further than a plain campfire.\n<\/li><li>\n<strong>Clay oven:<\/strong> A domed oven. A fire inside it burns long and slow.\n<\/li><\/ul>\n<h3 data-h=\"fences-and-gates\">Fences and gates<\/h3>\n<ul><li>\n<strong>Fence:<\/strong> Keeps animals in. Fences join end to end and at corners.\n<\/li><li>\n<strong>Gate:<\/strong> A piece of fence you can open and close.\n<\/li><\/ul>\n<h3 data-h=\"claims\">Claims<\/h3>\n<ul><li>\n<strong>Claim marker:<\/strong> A marker post that stakes out your land. Once it stands, the ground around it is your claim.\n<\/li><li>\n<strong>Town board:<\/strong> Build it on your claim to found a town. Notes and votes are pinned here.\n<\/li><\/ul>\n<h3 data-h=\"animals\">Animals<\/h3>\n<ul><li>\n<strong>Hen coop:<\/strong> Somewhere for hens to roost at night, safe and dry.\n<\/li><li>\n<strong>Stable:<\/strong> A plank stable with two stalls, where tame horses and donkeys stand for the night.\n<\/li><li>\n<strong>Hitching rail:<\/strong> Two posts and a rail to tie a tame horse or donkey to while you work, trade or visit.\n<\/li><\/ul>\n<h3 data-h=\"paths\">Paths<\/h3>\n<ul><li>\n<strong>Stone path:<\/strong> Flat stones to mark a way to your door.\n<\/li><li>\n<strong>Footbridge:<\/strong> Planks across a stream, so you walk over instead of wading.\n<\/li><\/ul>", "text": "Everything you can find, make or build, in the game's own words: this is what each thing says when you hover over it. Things are grouped the way the craft and build menus group them. Where a thing comes from and what it goes into are left for you to find out. Things you carry Found in the world Stick: A dry fallen stick. Kindling for a fire and the handle of many simple tools. Stone: A hard, fist-sized stone. Good for knocking and chipping, and the start of most stone tools. Plant fiber: Tough strands stripped from wild plants. Twisted into cord and thread, or shredded to catch a spark. Clay: Wet, sticky earth dug from the ground. It needs cleaning before it can be shaped. Log: A length of felled tree trunk. Long-burning firewood, and timber for boats, tools and building. Spider silk: Fine, strong silk gathered from spider webs. It can be twisted into yarn. Iron ore: Rusty, heavy rock that holds iron. Smelted to draw the metal out. Raw wool: Raw wool shorn from a sheep. Spun on a spindle into yarn. Antler: A branched antler from a deer. Hard and strong, kept from the hunt. Feather: A hen's feather. Used to fletch arrows so they fly true. Dead hen: A hen carried whole. A blade turns it into meat and feathers. Charcoal: A stick burned black without flame. Burns hot enough to smelt metal, and draws a dark line. Drawn map: A map of the land, drawn in charcoal. It shows the ground you have walked. Flint: A hard, glassy stone that breaks to a sharp edge. Found on high, rocky ground. Slate: A flat, dark stone that splits into thin sheets. Found on high, rocky ground. Copper ore: Green-flecked rock that holds copper. Smelted down, it gives the first metal. Reed: A tall marsh reed, light and pliant. Woven into sails, and quick to burn. Peat: Dark earth cut from a bog and dried. A steady fuel where trees are few. Driftwood: Wood washed up on the shore, dried by sun and salt. Good fuel for a beach fire. Shell: A cockle shell from the shore, ridged and pale. Dead rabbit: A rabbit carried whole. A blade turns it into meat and fur. Hen: A calm hen, held gently. Set it down where you want it to live. Rabbit: A calm rabbit, held gently. Set it down where you want it to live. Milk: Fresh milk, taken from a tame animal. Bone: A clean bone from a butchered animal. Kept for crafts still to come. Tin ore: Dull grey rock that holds tin. Smelted with copper, it makes bronze. Old bone: A dry, yellowed bone left by the restless dead. Acorn: An oak's seed. Plant it and, given time, an oak tree grows. Pine cone: A pine's seed cone. Plant it and, given time, a pine tree grows. Bush cutting: A green cutting taken from a bush. Plant it to grow a new bush. Flower seed: A small seed from a wildflower. Plant it and flowers come up before long. Softwood log: A length of pine trunk, light and straight. Long-burning firewood, and timber for anything that takes a log. Hardwood log: A length of broadleaf trunk, dense and strong. Long-burning firewood, and timber for anything that takes a log. Tools Sharp stone: A thin stone flake with a keen edge. It cuts on its own and makes the blade of better tools. Hand axe: A stone shaped to an edge and held in the hand. It cuts and knocks, and leads to a hafted axe. Spear: A long shaft tipped with sharp stone. Thrown or thrust, it is a hunter's first weapon. Stone axe: A stone head lashed to a wooden handle. It fells trees and serves as a weapon in a pinch. Stone knife: A small stone blade with a grip. For cutting, skinning and fine work. Digging stick: A stout stick carved to a point. It breaks soil and digs up clay and roots. Bow drill: A small bow strung to spin a drill. It makes fire faster and more surely than bare hands. Bow: A strung bow of bent wood. With arrows it lets you hunt from a distance. Arrow: A straight shaft with a point. Shot from a bow at game or foes. Spade: A broad wooden digging blade on a handle. It moves earth faster than a digging stick. Short sword: A short blade made of wood and sharp stone. A weapon for close quarters. Wooden shield: A wooden shield faced with hide. Held up to turn aside blows. Copper axe: An axe with a copper head. It chops faster and lasts longer than stone. Iron axe: An axe with an iron head. A strong tool for felling trees. Bronze axe: An axe with a bronze head. Harder and keener than copper. Steel axe: An axe with a steel head. The finest tool for felling trees. Steel pickaxe: A pickaxe with a steel head. It breaks hard rock and ore. Bronze pickaxe: A pickaxe with a bronze head. It breaks stone and ore. Spindle: A weighted stick for spinning. It turns raw wool into yarn. Torch: A stick wound with fiber. Carried lit, it lights the way after dark. Stone pick: A sharp stone bound to a handle. Breaks ore and rock loose. Fire and food Tinder bundle: A loose bundle of dry, shredded fiber. It takes a spark and gives a new fire its first flame. Pot of berry broth: A clay pot of warm berry broth. A good, comforting meal. Pot of mutton stew: A clay pot of stew, thick with meat and roots. Animal fat: Animal fat melted down and set. Fuel for a clay lamp. Small pot of berry broth: A small clay pot of berry broth. A light, warm meal. Berries: Small wild berries picked from bushes. A bite on the road, and sweet in a broth. Waterskin of water: A hide waterskin full of water. A drink you can carry far. Hazelnut: A wild hazelnut. A small snack, or pressed for oil. Mushroom: A wild mushroom from the forest floor. Edible raw, better in a stew. Wild root: A starchy root dug from the wild. A plain bite raw, and the heart of many stews. Wild greens: Leafy wild greens. A light bite, or cooked into a stew. Dried meat: Meat dried slowly on a rack. It keeps well and travels well. Raw mutton: Raw meat from a sheep. Roast, stew or dry it before eating. Its fat can be melted down. Roast mutton: Mutton roasted over a fire. A hearty, filling meal. Burnt mutton: Mutton left too long on the fire. Edible, but there is little good left in it. Raw venison: Raw meat from a deer. Roast, stew or dry it before eating. Roast venison: Venison roasted over a fire. A rich, filling meal. Burnt venison: Venison left too long over the fire, charred and dry. It still fills a little. Egg: A hen's egg, laid in the yard. Eaten raw or boiled for a better meal. Raw chicken: Fresh meat from a hen. Roast it, stew it or dry it before eating. Roast chicken: A whole hen roasted over the fire. A filling meal. Burnt chicken: Chicken left too long over the fire, blackened and tough. It still fills a little. Boiled egg: An egg cooked hard in the embers. A small, honest meal. Burnt egg: An egg left too long in the heat. Little good left in it. Raw rabbit: Fresh meat from a rabbit. Roast it, stew it or dry it before eating. Roast rabbit: A rabbit roasted over the fire. A good meal for the road. Burnt rabbit: Rabbit left too long over the fire, charred and dry. Little good left in it. Cord and weaving Cord: Plant fiber twisted into a strong cord. It lashes heads to handles and holds things together. Basket: A woven basket worn on the back. It holds a few things of its own and lets you carry more. Plant thread: Fine plant fiber twisted into thread. For weaving cloth and sewing. Plant cloth: A rough cloth woven from plant thread. The material for simple clothes. Sleeping mat: A mat of woven grass. Lay it inside a hut or house to sleep and wake on. Wool yarn: Spun yarn, soft and strong. Knitted or woven into warm clothing. Wool cloth: A warm cloth woven from wool yarn. The material for tunics, cloaks and hoods. Rabbit snare: A noose of cord between two sticks. Set it down where rabbits run and come back to check it. Fishing line: A length of line with a hook, for fishing by hand. It wears with use. Clay Clean clay: Clay picked clean of stones and roots. Ready to mix, mold or shape. Crushed stone: Stone crushed to coarse grit. Mixed into clay so it holds up in the fire. Mixed clay: Clay mixed with grit or crushed pottery so it does not crack in the fire. Shaped into pots, cups, lamps and tiles. Broken pottery: Pieces of a broken pot. Crushed, they help new clay survive the fire. Crushed pottery: Old pottery crushed fine. Mixed into clay so new pots fire without cracking. Small pot: A small fired clay pot. It carries a little water and simmers a little broth. Clay pot: A fired clay pot built up in coils. It carries water and cooks stews over a fire. Small pot of water: A small clay pot filled with water. Drink it, or set it on a fire to cook. Clay pot of water: A clay pot full of water. Drink from it, or set it on a fire to simmer a stew. Sun-dried brick: A block of clay dried hard in the sun. Laid with plaster to build walls and kilns. Clay plaster: Wet clay plaster. It binds bricks and seals walls. Unfired small pot: A small pot pinched from wet clay. It must be fired before it will hold water. Unfired clay pot: A clay pot built from coils, still soft. Fire it to make it hard and watertight. Unfired storage jar: A large storage jar of raw clay. Only a kiln heats it evenly enough to fire. Storage jar: A large fired clay jar. Set it down to keep goods in store. Unfired lamp: A small lamp shaped from wet clay. Fire it before it can hold oil. Clay lamp: A small fired clay lamp. Filled with animal fat or nut oil, it gives a steady light. Unfired roof tile: A roof tile pressed from wet clay. A kiln fires it hard. Roof tile: A curved tile of fired clay. Laid in rows to roof a house against the rain. Unfired clay trough: A large water trough of raw clay. Only a kiln heats it evenly enough to fire. Clay trough: A big fired clay basin for drinking water. Set it down and fill it, and it catches rain outdoors. Unfired cup: A cup shaped from wet clay. Fire it to make it hold water. Clay cup: A small fired clay cup. Fill it with water to carry a drink. Cup of water: A clay cup of fresh water. A quick drink. Hide and clothing Plant tunic: A plain tunic sewn from plant cloth. Light clothing for mild days. Wool cap: A soft cap knitted from wool yarn. It keeps your head warm in cold weather. Wool cloak: A hooded wool cloak worn over your clothes. Warmth for cold days and nights. Leather tunic: A sturdy tunic sewn from leather. Tougher than cloth. Waterskin: A pouch sewn from sheep hide. Fill it to carry water with you. Sheep hide: A fresh hide from a sheep. Scraped clean, it is the start of leather. Scraped hide: A hide scraped clean of flesh and hair. Dried into leather, or used as it is. Leather: A hide stretched and dried into tough leather. For warm clothes and armour. Wool tunic: A plain tunic sewn from wool cloth. Warm, soft clothing. Leather foot wraps: Strips of leather wound about the feet. They keep your feet off the cold ground. Deer hide: A fresh hide from a deer. Scraped clean, it is the start of leather. Rabbit fur: A soft rabbit pelt. Lines hunting gear, and makes a fine surface to draw a map on. Sinew: Tough cord from a butchered animal, dried and strong. Kept for crafts still to come. Saddle bag: A pair of leather bags for a tame donkey's back. Fitted on, it lets the donkey carry a pack for you. Mist-dark fur: Fur shed by a creature of the gloom, dark as smoke. Metal Melting pot: A clay pot lined to take great heat. Metal is melted in it to make bars. Copper bar: A bar of smelted copper. The first metal for tools and armour. Bronze bar: A bar of bronze, harder than copper. Worked into stronger tools and armour. Copper axe head: A copper axe head, struck into shape. It waits for a handle. Iron bar: A bar of smelted iron. Struck into tools, or refined further into steel. Steel bar: A bar of refined steel, the hardest metal. Made into the best tools. Iron axe head: An iron axe head, struck into shape. It waits for a handle. Bronze axe head: A bronze axe head, struck into shape. It waits for a handle. Steel axe head: A steel axe head, struck into shape. It waits for a handle. Steel pick head: A steel pick head, struck into shape. It waits for a handle. Bronze pick head: A bronze pick head, struck into shape. It waits for a handle. Boats Log raft: Logs lashed side by side. The simplest way across open water. Dugout canoe: A single log hollowed into a canoe. Lighter and quicker on the water than a raft. Paddle: A carved wooden paddle for moving a boat through the water. Plank boat: A boat built from planks, with a mast and sail. Made for longer trips on open water. Reed sail: Reeds woven into a broad sail. It catches the wind for a plank boat. Mast: A long, straight trunk trimmed smooth. It holds the sail on a plank boat. Plank: Wood split flat and even. For boats, shields and sturdy work, and it burns well too. Armour Ranger vest: A woodland ranger's vest of bark plates on a hide back, with no metal. Middle-weight armour for the chest. Made in hide, copper, bronze, iron and steel. Ranger hood: A ranger's pointed leaf hood with no metal. Middle-weight armour for the head. Made in hide, copper, bronze, iron and steel. Ranger pauldrons: Leaf sprays for the shoulders, pinned with bone studs. Middle-weight ranger armour. Made in hide, copper, bronze, iron and steel. Grove warden cuirass: A grove warden's cuirass of overlapping pinecone scales, plain bark with no metal. Heavy chest armour. Made in hide, copper, bronze, iron and steel. Grove warden helm: A grove warden's acorn-cap helm in plain bark. Heavy armour for the head. Made in hide, copper, bronze, iron and steel. Grove warden pauldrons: Oak-leaf pauldrons, each with an acorn, in plain bark. Heavy grove warden armour for the shoulders. Made in hide, copper, bronze, iron and steel. Huntsman jerkin: A huntsman's laced leather jerkin, with no metal. Light armour for the chest. Made in hide, copper, bronze, iron and steel. Huntsman hood: A huntsman's russet fox-ear hood with a fur rim, with no metal. Light armour for the head. Made in hide, copper, bronze, iron and steel. Huntsman mantle: A huntsman's fur mantle for the shoulders, with no metal. Light armour. Made in hide, copper, bronze, iron and steel. Warden's cuirass: A cuirass of pinecone scales that a crypt warden wore, still sound after long years underground. Heavy chest armour; no smith can copy it. Fire spell book: A hand-written account of how fire is gathered between the hands and thrown. Read once, it is yours. Revive spell book: A hand-written account of how to call a fallen friend back to their feet. Read once, it is yours. Gems, runes and patterns Gem chip: A tiny shard of coloured stone. Enough of them fuse into a rough gem. Rough gem: An uncut gem, dull and cloudy. Cut, it shows its colour. Cut gem: A gem cut and polished to catch the light. Set into a weapon, shield or tool, it lends it a quality of its own. Bright gem: A rare gem with a light inside it. Set into a weapon, shield or tool, it glows in the dark. Worn rune stone: An old stone marked with faded runes. A skilled hand can carve its rune onto a weapon or shield. Deep rune stone: A stone cut with deep, old runes. Carved onto a weapon or shield, its rune keeps an edge, steadies a guard or hides your step. Goblin pattern scrap: A torn scrap of a goblin pattern. Read it to learn a simple piece of set armour or a hidden recipe. Old pattern sheet: A full sheet of old pattern work. Read it to learn harder recipes, such as copper and bronze armour. Master pattern: A master's pattern, rare and complete. Read it to learn the hardest work, such as iron and steel armour. Fish Pebblefin Sunback Brook darter Wallowback Reedjaw Moonribbon Stonebelly Glimmerling Tideguard Sandplate Deepling Sunscale Every fish is roasted over a fire before it is eaten. See Fishing for where each one bites. Other Nut oil: Oil pressed from hazelnuts. A clean-burning fuel for a clay lamp. Shingle: A thin slat split from a log. Laid in overlapping rows to roof a timber house. Wall panel: Boards and sticks cut to size ahead of time. A wall that stands in one piece, for building a house part by part. Floor panel: Boards cut to size ahead of time. A floor that goes down in one piece, for building a house part by part. Buildings and stations Grouped like the tabs of the build menu (B). Shelter Lean-to: Keeps off rain. A fire just in front warms you under it. Clay hut: Dry inside in any rain. A fire on a raised hearth inside keeps it warm. Mud-brick house: A dry room of your own. Any fire inside warms the whole room. Log cabin: A dry room of your own. Any fire inside warms the whole room. Tiled house: A dry room under a tile roof. Any fire inside warms the whole room. Straw bed: Somewhere soft to lie down at home. Fur bed: A soft bed. You wake here after a fall. Timber cottage: The warmest home. Any fire inside warms the whole room. Bench: Somewhere to sit by the fire. Well: Fresh water to drink and fill pots, close to home. Storage Storage basket: Holds a few stacks of your things by the fire. Storage jar: Keeps things dry. A better made jar holds more. Clay trough: A fired clay basin set down and filled by hand from pots. It holds water to drink, and catches rain in the open. Wooden chest: Holds plenty of your things, safe at home. Storage shelf: Holds your things in plain sight. Table: A table to set things on. Benches tuck in beside it. Crafting Kiln: Fires pots hard, more surely than an open fire. Crafting table: A work table for baskets, spindles, shields, wool clothing and hide armour. Spindle station: A distaff stand with a stick frame, built around your spindle. Wool is spun into yarn here, and yarn woven into cloth. Leather drying rack: Posts and a bar for hides and meat. Hides are scraped and stretched to dry here, and meat is hung to dry in strips. Potter's bench: A split log bench where clay is shaped into pots, cups, lamps, roof tiles, jars and troughs. Nut oil is pressed here too. Repair table: A sturdy table where worn tools are mended and put back to work. Sundial: Tells everyone in your claim the time of day. Settling tub: A tub that cleans dug clay of stones and roots. Load it and leave it to work. Crushing block: A stone block for crushing stone or broken pottery fine. Load it and leave it to work. Kneading trough: A trough for working crushed stone or pottery into clay so pots hold up in the fire. Clay plaster is mixed here too. Map table: A hide-topped table that shows the land your claim and town have walked, as far as your Map making reaches. Small kiln: A small first kiln. It fires a few pots more safely than an open fire, but not the big pieces. Drying shelf: Wet pots and bricks set on it dry faster, and the rain can't reach them. Sawing table: A bench with a long hand saw. Houses are built part by part on a claim, or in a town, that has one. Stone-breaking bench: A heavy bench for breaking stone down to size. A claim or town with one is ready for big stone works. Fire Raised hearth: Goes inside a hut or house. A fire on it keeps the home warm. Stone-ringed hearth: A fire on it warms much further than a plain campfire. Clay oven: A domed oven. A fire inside it burns long and slow. Fences and gates Fence: Keeps animals in. Fences join end to end and at corners. Gate: A piece of fence you can open and close. Claims Claim marker: A marker post that stakes out your land. Once it stands, the ground around it is your claim. Town board: Build it on your claim to found a town. Notes and votes are pinned here. Animals Hen coop: Somewhere for hens to roost at night, safe and dry. Stable: A plank stable with two stalls, where tame horses and donkeys stand for the night. Hitching rail: Two posts and a rail to tie a tame horse or donkey to while you work, trade or visit. Paths Stone path: Flat stones to mark a way to your door. Footbridge: Planks across a stream, so you walk over instead of wading."}, {"slug": "patch-notes", "group": "News", "title": "Hearthwood patch notes", "path": "", "html": "<p>What changed, newest first, one section per day. Plain words, no build numbers. A day marked <strong>WORLD WIPE<\/strong> needs a fresh world; the launcher always asks before it wipes yours.<\/p>\n<h2 data-h=\"25-october\">25 October<\/h2>\n<p><strong>Afternoon and evening<\/strong><\/p>\n<ul><li>\nOther players and animals press the grass flat as they walk through it, as you do, so busy ways show as trails.\n<\/li><li>\nDeep inside the groves the ground is an old mossy woods floor.\n<\/li><li>\nPlayers whose computers fall back to OpenGL now see the new forest instead of the old painted trees.\n<\/li><li>\nThe far woods leave out trees that were felled, built over or dug away.\n<\/li><\/ul>\n<p><strong>Early hours and morning<\/strong><\/p>\n<ul><li>\nWoods grow into larger, joined-up groves and big forests. Trees never sprout through your claim or your buildings.\n<\/li><li>\nBoulders and old landmarks (huge oaks, fallen giants, standing stones) are back where they were before the bigger forests.\n<\/li><li>\nBigger trees give more logs before they fall. Pines give softwood and broadleaf trees give hardwood; both do anywhere a log is needed.\n<\/li><li>\nAdding materials to a building is a tap of Use (E), and each tap puts in a whole stack.\n<\/li><li>\nThe weather moves with the sea wind, the same wind your sails feel, so clouds, leaves and grass lean the way boats are pushed.\n<\/li><li>\nStanding on a boat's deck no longer counts as wading, so you don't freeze on deck, and dying aboard wakes you free of the boat.\n<\/li><li>\nA restored ruin fades after about two weeks, and restoring one teaches your Builder skill a good deal.\n<\/li><\/ul>\n<h2 data-h=\"24-october\">24 October<\/h2>\n<p><strong>Evening<\/strong><\/p>\n<ul><li>\nNow and then an old ruin turns up in the low country. Restore one into a walled, roofed shelter, and the town board lists the ruins that have turned up, with which way and about how far each lies.\n<\/li><li>\nAny build of ten or more stones needs a stone-breaking bench on the claim, or on one of your town's claims.\n<\/li><li>\nRivers carry ripples, leaves and foam the way the river runs, downstream.\n<\/li><li>\nA felled tree goes at once and leaves a stump that matches its trunk, and there are no more invisible trunks standing in streams.\n<\/li><li>\nThe new trees no longer come out near-black in the game's light.\n<\/li><\/ul>\n<p><strong>Afternoon<\/strong><\/p>\n<ul><li>\nThe forest is new: fuller, hand-painted pines and broadleaf trees in three shapes each, with great oaks and tall cedars in open glades. Trees stand further apart and vary more in height and width, so the woods are easier to walk through.\n<\/li><li>\nBroadleaf trees turn with the seasons and stand bare in winter, with a lighter shade under them; pines stay green. The trees shade the ground under their crowns.\n<\/li><li>\nFar-off trees sit on the hillsides instead of hovering above them, the far woods look as open as the near ones, the far land wears the near ground's look out to about 2 km, and the seasons carry smoothly from near trees to far ones.\n<\/li><li>\nThe forest no longer stutters the first time you walk into the woods after an install or update, and it runs faster on Low graphics.\n<\/li><li>\nA big boat frame turns toward the water by itself while you place it, shows where the boat will slide in, and turns red with the reason when it cannot launch from there. It can stand a bit further from the water, and the sailing boat is now a painted wooden sailboat.\n<\/li><li>\nLand beyond your first claim square costs a small land tax, 40 copper a week for each extra square, paid by itself from your purse. Your first square stays free, and squares signed into a town are not charged. If the tax goes unpaid you are warned a week, three days and a day before the claim falls.\n<\/li><li>\nA building job's fee at the town board can be paid in coins as well as goods.\n<\/li><li>\nA stone-breaking bench can be built from the build menu.\n<\/li><li>\nWalking on a stone path is about a tenth quicker. A path snaps onto a footbridge's end, and paths run right along walls and fences.\n<\/li><li>\nYou can set a building's outline down about 9 steps away instead of 6, and it follows your mouse out that far.\n<\/li><li>\nWith a waterskin in your bag, scooping from a trough fills your pots instead of failing.\n<\/li><li>\nCloud edges no longer look grainy or shimmer, and storm foam on the waves looks natural instead of lying in neat rows.\n<\/li><\/ul>\n<p><strong>Midday<\/strong><\/p>\n<ul><li>\nPicking a theme in Options, under the new UI section, changes the windows at once, with no restart, and the hotbar and the character cards follow it too.\n<\/li><li>\nFalling snow is real flakes all round you, with a soft snowy haze in the distance.\n<\/li><li>\nWebbed groves sit in a cold pale mist, thicker at night.\n<\/li><li>\nBoat wakes look like broken foam rather than a solid white patch.\n<\/li><li>\nDraw distance limits how far the trees reach again. On High the single far trees stop at 2 km, as on Medium, with painted woods beyond.\n<\/li><li>\nFrom far off, a signal fire's smoke shows roughly where the fire is, not the exact spot.\n<\/li><\/ul>\n<p><strong>Late morning<\/strong><\/p>\n<ul><li>\nTab picks the nearest foe and steps outward, a painted ring marks your target, and small frames above the hotbar show your health and your target's in a fight. The ring is easy to see far off and on a foe in water, and the frame marks bosses and elites.\n<\/li><li>\nAt the sawing table, cut boards into wall and floor panels: a panel goes up in one piece and costs a little less wood than building from loose boards.\n<\/li><li>\nA chopped tree falls and grows back as the same kind of tree, and the woods mix big and small trees.\n<\/li><li>\nSmall waves roll in and break in foam along the beaches.\n<\/li><li>\nA sneak-attack hit on an animal shows a small amber \"!\" over it.\n<\/li><li>\nThe Mending skill now rises slowly, at the same pace as fighting.\n<\/li><\/ul>\n<p><strong>Morning<\/strong><\/p>\n<ul><li>\nBuilding a house part by part (H) needs a sawing table on your claim, or on one of your town's claims. Build one from the build menu first. Houses already standing are untouched.\n<\/li><li>\nInside a house built part by part, the roof and the floors above you fade away so you can see yourself, as in the huts.\n<\/li><li>\nThe crypt's boss can drop the warden's cuirass, a rare piece of heavy armour no smith can copy.\n<\/li><li>\nOptions has a Theme row: Light crème, Dark walnut, or the new Fern and moss.\n<\/li><li>\nOptions, Graphics has a Vsync switch; Off lets the frame rate run past your screen's refresh rate.\n<\/li><li>\nOn Medium and High the ground's colour, trails and wet patches reach much further out.\n<\/li><li>\nA couple of very gently shelving beaches now have a gully deep enough to launch a sailing boat.\n<\/li><li>\nYou see the town name of a player near you again.\n<\/li><li>\nThe sea's whitecaps and foam show again, and a calm sea no longer shows a criss-cross pattern out to the horizon.\n<\/li><li>\nPale characters keep their colour in sunlight, and very long messages above the hotbar are shortened so they stay on screen.\n<\/li><\/ul>\n<p><strong>Early hours<\/strong><\/p>\n<ul><li>\nThe camera turns like an MMO camera: look straight up at the sky or down at your feet, zoom right in to just behind your eyes, and it slides in along the ground or a house wall instead of going through it. Invert mouse and the old camera are on the Controls page.\n<\/li><li>\nThe bag window is now a character sheet: your own figure, live and in your gear, with Gear and Body tabs.\n<\/li><li>\nNotice boards post small jobs that pay copper coins, and your character sheet shows your purse. The first board stands in the starting clearing.\n<\/li><li>\nEvery item and building says what it is when you hover over it, the trade window's items have tooltips too, and the build menu shows a building's name first.\n<\/li><li>\nEating or drinking makes stamina refill twice as fast for about ten minutes.\n<\/li><li>\nA bronze pickaxe sits between the stone pick and
