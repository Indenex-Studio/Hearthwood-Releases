<style>

:root{
  --bg:#EDF1EA; --surface:#F7F9F5; --ink:#1E2A22; --muted:#56655A; --rule:#CBD5C8;
  --accent:#3F6B34; --accent-2:#B85A24; --mark:#F3E2B8;
  --display:"Alegreya",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131915; --surface:#1A221D; --ink:#E2E9E0; --muted:#9AAA9C; --rule:#2E3A31;
  --accent:#8DBA77; --accent-2:#E08A52; --mark:#4A3F22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1A221D; --ink:#E2E9E0; --muted:#9AAA9C; --rule:#2E3A31;
  --accent:#8DBA77; --accent-2:#E08A52; --mark:#4A3F22; color-scheme:dark}
</style>
<style></style>
<style>
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;padding-block:40px 72px}
header.top{grid-column:1/-1;display:grid;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:24px}
.kicker{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);margin:0}
h1{font:700 clamp(34px,5.5vw,52px)/1.05 var(--display);margin:0;text-wrap:balance}
.lede{font:500 19px/1.5 var(--display);max-width:44em;margin:0;color:var(--muted)}
.search{display:flex;gap:10px;align-items:center;max-width:560px}
.search input{flex:1;min-width:0;font:400 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
.search input::placeholder{color:var(--muted)}
.count{font:400 13px var(--body);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
nav details{margin-bottom:10px}
nav summary{cursor:pointer;font:600 12px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;list-style:none;display:flex;justify-content:space-between}
nav summary::-webkit-details-marker{display:none}
nav summary .c{font-variant-numeric:tabular-nums;letter-spacing:0}
nav ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
nav a{display:block;padding:5px 8px 5px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.35;border-left:2px solid transparent}
nav a:hover{background:var(--surface);color:var(--accent)}
nav a[aria-current="page"]{border-left-color:var(--accent);background:var(--surface);color:var(--accent);font-weight:600}
main{min-width:0;max-width:46em}
.eyebrow{font:600 12px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:12px;flex-wrap:wrap}
.eyebrow a{color:var(--muted)}
h2.pt{font:700 36px/1.12 var(--display);margin:0 0 18px;text-wrap:balance}
article h2{font:700 26px/1.25 var(--display);margin:34px 0 8px;text-wrap:balance}
article h3{font:700 21px/1.3 var(--display);margin:26px 0 6px;color:var(--accent)}
article h4{font:600 17px/1.4 var(--body);margin:20px 0 4px}
article p{margin:0 0 14px}
article ul,article ol{margin:0 0 16px;padding-left:1.3em}
article li{margin-bottom:5px}
article li::marker{color:var(--accent)}
article hr{border:0;border-top:1px dashed var(--rule);margin:28px 0}
article blockquote{margin:0 0 16px;padding:10px 16px;border-left:3px solid var(--accent-2);background:var(--surface);border-radius:0 8px 8px 0}
article blockquote p:last-child{margin:0}
strong{font-weight:600}

.code{overflow-x:auto;margin:0 0 16px;background:var(--surface);border:1px solid var(--rule);border-radius:8px}

.tbl{overflow-x:auto;margin:0 0 18px}
table{border-collapse:collapse;font-size:15px;min-width:60%}
th{text-align:left;font:600 12px/1.4 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding:8px 12px 8px 0}
td{border-bottom:1px solid var(--rule);padding:8px 12px 8px 0;vertical-align:top}
.img{color:var(--muted);font-style:italic}
mark{background:var(--mark);color:inherit;border-radius:2px}

.results{list-style:none;margin:0;padding:0;display:grid;gap:18px}

<script id="pages" type="application/json">[{"slug": "home", "group": "Start here", "title": "Welcome", "path": "", "html": "<p>Hearthwood is a multiplayer survival and crafting game. You start with nothing and work up from a first fire to fired pottery, permanent buildings and shared land.<\/p>\n<p>This wiki tells you where to look and what to aim for. It does not give full recipes, exact numbers or minigame solutions; working those out is part of the game.<\/p>\n<h2 data-h=\"pages\">Pages<\/h2>\n<ol><li>\n<a href=\"#spirit\">How the game plays<\/a>: the core loop and what to expect\n<\/li><li>\n<a href=\"#getting-started\">Your first hour<\/a>: fire, food, water, shelter\n<\/li><li>\n<a href=\"#first-night\">Your first night<\/a>: fuel, warmth and light after dark\n<\/li><li>\n<a href=\"#controls\">Keys and controls<\/a>: default keys, right-click menus and how to change them\n<\/li><li>\n<a href=\"#needs\">Needs<\/a>: hunger, thirst, cold, wetness and carrying\n<\/li><li>\n<a href=\"#gathering\">Gathering<\/a>: wild food, kindling and what each kind of country offers\n<\/li><li>\n<a href=\"#crafting-and-skills\">Crafting and skills<\/a>: steps, minigames, skills and the journal\n<\/li><li>\n<a href=\"#clay-and-pottery\">Clay and pottery<\/a>: the first major goal\n<\/li><li>\n<a href=\"#building-and-claims\">Building and claims<\/a>: shelters, doors, storage, land and weathering\n<\/li><li>\n<a href=\"#towns\">Towns<\/a>: rosters, offices, voting and the town store\n<\/li><li>\n<a href=\"#working-wood\">Working wood<\/a>: chopping, logs, planks and shingles\n<\/li><li>\n<a href=\"#light-and-lamps\">Light and lamps<\/a>: drills, torches, clay lamps and signal fires\n<\/li><li>\n<a href=\"#boats\">Boats<\/a>: the raft, the dugout canoe and the plank boat\n<\/li><li>\n<a href=\"#mining\">Mining<\/a>: picks, outcrops, ore and the Miner skill\n<\/li><li>\n<a href=\"#maps\">Maps<\/a>: drawing, reading and copying maps, and the map table\n<\/li><li>\n<a href=\"#cooking-and-clothes\">Cooking and clothes<\/a>: roasting, pots of broth and stew, tunics and wraps\n<\/li><li>\n<a href=\"#hides-and-leather\">Hides and leather<\/a>: scraping, drying and what leather makes\n<\/li><li>\n<a href=\"#animals\">Animals<\/a>: sheep, hens, rabbits, taming, pens, deer, horses and donkeys\n<\/li><li>\n<a href=\"#hunting-and-snares\">Hunting and snares<\/a>: spears, bows and the rabbit snare\n<\/li><li>\n<a href=\"#foes-and-dungeons\">Foes<\/a>: gloom creatures, goblins and bone rattlers, and how to fight them\n<\/li><li>\n<a href=\"#other-players\">Other players<\/a>: chat, friends, cooperation and fighting\n<\/li><li>\n<a href=\"#tips\">Tips<\/a>: short practical advice\n<\/li><li>\n<a href=\"#glossary\">Glossary<\/a>: common terms in one place\n<\/li><\/ol>\n<p>The game is in active development. If this wiki and the game disagree, the game is correct.<\/p>\n<p>See also: <a href=\"#fishing\">Fishing<\/a> and <a href=\"#big-boat\">The big boat<\/a>.<\/p>", "text": "Hearthwood is a multiplayer survival and crafting game. You start with nothing and work up from a first fire to fired pottery, permanent buildings and shared land. This wiki tells you where to look and what to aim for. It does not give full recipes, exact numbers or minigame solutions; working those out is part of the game. Pages How the game plays : the core loop and what to expect Your first hour : fire, food, water, shelter Your first night : fuel, warmth and light after dark Keys and controls : default keys, right-click menus and how to change them Needs : hunger, thirst, cold, wetness and carrying Gathering : wild food, kindling and what each kind of country offers Crafting and skills : steps, minigames, skills and the journal Clay and pottery : the first major goal Building and claims : shelters, doors, storage, land and weathering Towns : rosters, offices, voting and the town store Working wood : chopping, logs, planks and shingles Light and lamps : drills, torches, clay lamps and signal fires Boats : the raft, the dugout canoe and the plank boat Mining : picks, outcrops, ore and the Miner skill Maps : drawing, reading and copying maps, and the map table Cooking and clothes : roasting, pots of broth and stew, tunics and wraps Hides and leather : scraping, drying and what leather makes Animals : sheep, hens, rabbits, taming, pens, deer, horses and donkeys Hunting and snares : spears, bows and the rabbit snare Foes : gloom creatures, goblins and bone rattlers, and how to fight them Other players : chat, friends, cooperation and fighting Tips : short practical advice Glossary : common terms in one place The game is in active development. If this wiki and the game disagree, the game is correct. See also: Fishing and The big boat ."}, {"slug": "spirit", "group": "Start here", "title": "How the game plays", "path": "", "html": "<p>Hearthwood is a survival and crafting game in one shared, persistent world. You start with nothing. Everything you own, you make from what you find.<\/p>\n<h2 data-h=\"the-loop\">The loop<\/h2>\n<ul><li>\n<strong>Stay alive.<\/strong> You need food, water and warmth. Needs drain slowly and pause while you are offline.\n<\/li><li>\n<strong>Learn by doing.<\/strong> The game does not list every recipe up front. You find out what works by trying things. Your journal records what you have learned.\n<\/li><li>\n<strong>Make things.<\/strong> Raw materials become tools, tools let you make better things, and so on up the steps.\n<\/li><li>\n<strong>Build.<\/strong> Start with a basic shelter. Better buildings need better materials and protect you better.\n<\/li><li>\n<strong>Work with others.<\/strong> The world is shared. Other players can help you build, teach you crafts and trade what they know.\n<\/li><\/ul>\n<h2 data-h=\"what-to-expect\">What to expect<\/h2>\n<ul><li>\nThere is no time pressure. Nothing forces you to finish a task by a deadline.\n<\/li><li>\nFailure is part of progress. Failed attempts still give some skill, and some failed items can be reused.\n<\/li><li>\nRepetition gets easier. As a skill improves, the work goes faster and, at the top rank, the minigames can be skipped.\n<\/li><li>\nWatch the world. Plants, ground, weather and time of day all matter, and most of what you need is visible if you look.\n<\/li><\/ul>\n<p>Next: <a href=\"#getting-started\">Your first hour<\/a><\/p>", "text": "Hearthwood is a survival and crafting game in one shared, persistent world. You start with nothing. Everything you own, you make from what you find. The loop Stay alive. You need food, water and warmth. Needs drain slowly and pause while you are offline. Learn by doing. The game does not list every recipe up front. You find out what works by trying things. Your journal records what you have learned. Make things. Raw materials become tools, tools let you make better things, and so on up the steps. Build. Start with a basic shelter. Better buildings need better materials and protect you better. Work with others. The world is shared. Other players can help you build, teach you crafts and trade what they know. What to expect There is no time pressure. Nothing forces you to finish a task by a deadline. Failure is part of progress. Failed attempts still give some skill, and some failed items can be reused. Repetition gets easier. As a skill improves, the work goes faster and, at the top rank, the minigames can be skipped. Watch the world. Plants, ground, weather and time of day all matter, and most of what you need is visible if you look. Next: Your first hour"}, {"slug": "getting-started", "group": "Start here", "title": "Your first hour", "path": "", "html": "<p>You wake in a dry clearing in a forest with empty hands. Around it the land rolls in gentle hills, with streams running down the valleys and ponds in the hollows. You start on a sheltered stretch of coast with mountains in view. The land is large: rivers run down from eroded mountains, and footpaths switch back up to high places. A good order to work in:<\/p>\n<ol><li>\n<strong>Gather.<\/strong> Sticks, stones and plant fiber lie on the ground. Pick up some of each (E, standing over them), then open the crafting panel (C) to see what they make.\n<\/li><li>\n<strong>Make a fire.<\/strong> A fire gives warmth and light and lets you cook. It burns down over time; feed it fuel to keep it going. One fire holds about 30 minutes of fuel, a night lasts about 45, so a whole night takes around 30 sticks. Gather them while there is light. A full fire will not take more fuel. With more Firecraft skill, your fires can hold more and burn longer. When you carry fuel and face a fire, the Use prompt shows roughly how long it has left. A new fire is set on clear, level ground in front of you. A fire you lit waits for you while you are offline (for up to a day), so you find it still burning when you return. This holds inside your own claim, and out in the open as long as nobody else is standing near it. A fire that burns out leaves a cold hearth; lighting a new fire beside it rekindles it there. Outside a claim, cold hearths disappear after a while.\n<\/li><li>\n<strong>Find food.<\/strong> Berry bushes are the easiest food early on. The game tells you when you are hungry.\n<\/li><li>\n<strong>Find water.<\/strong> You can drink from streams and ponds. Streams run down the valleys, so heading downhill will find one. Later you can carry water with you.\n<\/li><li>\n<strong>Plan a shelter.<\/strong> Nights are cold and rain makes it worse. A lean-to is a reasonable first build, but it mostly keeps off rain and only a little of the cold. It does not replace a fire: keep a fire burning beside it. You can replace it with something better later.\n<\/li><li>\n<strong>Check your journal (J).<\/strong> It lists what you have found and what you can make, and a short list of steps to follow.\n<\/li><\/ol>\n<h2 data-h=\"your-character\">Your character<\/h2>\n<p>When you make a character you pick a people: Bramble, Pebble, Kit, Capling, Dragonling or Chameleon. Each has its own choices, such as skin, hair or fur, shell, cap, scales, ears, horns or tail, and a Chameleon's skin slowly drifts between its two colours. You also choose how big you stand, from Small to Big. Looks and size are only for show: your reach and the way you move do not change. Clothes fit every people.<\/p>\n<h2 data-h=\"your-road-to-a-first-clay-pot\">Your road to a first clay pot<\/h2>\n<p>A fired clay pot is the first big goal. Here is one way to get there. You do not have to follow it in order, and the journal (J) will nudge you with its \"Things to try\" lines as you learn each step.<\/p>\n<ol><li>\n<strong>Gather.<\/strong> Pick up sticks, stones and plant fiber (E). You need about five fiber and five stones to start, and a few sticks, and more later. Shaping a stone needs a second stone in your pack to strike with.\n<\/li><li>\n<strong>Make tinder and a fire.<\/strong> In the crafting panel (C), shred two fiber into tinder, then hand-drill a fire from two sticks and the tinder. A fire is warm and lets you cook. Feed it sticks to keep it going.\n<\/li><li>\n<strong>Make an axe.<\/strong> Twist three fiber into cord. Shape a stone into a hand axe. Tie the hand axe and a stick to the cord to make a stone axe.\n<\/li><li>\n<strong>Chop a log.<\/strong> Walk to a standing tree and chop it with the axe (right-click the tree to see the chop line). You will use the log for a bench. Each chop also gives a strip of bark fiber, and when the tree comes down it gives a few sticks and more fiber.\n<\/li><li>\n<strong>Walk away from the clearing and raise a claim marker.<\/strong> The ground where everyone wakes up cannot be claimed. If you try too close, the game tells you how many meters further to walk. Your claim is the land around the marker.\n<\/li><li>\n<strong>Build a potter's bench<\/strong> inside your claim, from a log and two stones. This is where pots are shaped.\n<\/li><li>\n<strong>Dig clay.<\/strong> Dig (F) where the ground is low and damp, near water, or right-click clay ground and choose dig. You need a handful.\n<\/li><li>\n<strong>Prepare the clay.<\/strong> Clean it (picks out stones and roots), crush a stone, and mix the crushed stone into the clean clay. Clay with nothing mixed in cracks in the fire.\n<\/li><li>\n<strong>Pinch a pot<\/strong> at the bench. Shaping is a small game, and a steady hand makes a better pot.\n<\/li><li>\n<strong>Let it dry, then fire it.<\/strong> Dry clay takes about five minutes, faster beside a burning fire (about two and a half) and slower in rain. A pot that is not dry will crack. Put the dry pot in a fire that has enough sticks to burn for the whole two-and-a-half-minute firing (the game tells you how many more to add).\n<\/li><li>\n<strong>Fill it with water.<\/strong> Stand at the water's edge. A fired pot holds water.\n<\/li><\/ol>\n<p>While the pot dries, there is plenty to do: shape a second pot, pick berries, plan a lean-to for the night, or just keep the fire fed.<\/p>\n<h2 data-h=\"the-use-key\">The Use key<\/h2>\n<p>Most actions in the world go through one key, Use (E by default). When there is nothing in front of you to use, E picks up what lies at your feet. A prompt below your character shows what Use will do with the thing you are facing. No prompt means Use does nothing there. Moving the mouse turns the view; press V to get the cursor back, then right-click a person or thing to see everything you can do with it. See <a href=\"#controls\">Keys and controls<\/a>.<\/p>\n<p>Next: <a href=\"#first-night\">Your first night<\/a><\/p>", "text": "You wake in a dry clearing in a forest with empty hands. Around it the land rolls in gentle hills, with streams running down the valleys and ponds in the hollows. You start on a sheltered stretch of coast with mountains in view. The land is large: rivers run down from eroded mountains, and footpaths switch back up to high places. A good order to work in: Gather. Sticks, stones and plant fiber lie on the ground. Pick up some of each (E, standing over them), then open the crafting panel (C) to see what they make. Make a fire. A fire gives warmth and light and lets you cook. It burns down over time; feed it fuel to keep it going. One fire holds about 30 minutes of fuel, a night lasts about 45, so a whole night takes around 30 sticks. Gather them while there is light. A full fire will not take more fuel. With more Firecraft skill, your fires can hold more and burn longer. When you carry fuel and face a fire, the Use prompt shows roughly how long it has left. A new fire is set on clear, level ground in front of you. A fire you lit waits for you while you are offline (for up to a day), so you find it still burning when you return. This holds inside your own claim, and out in the open as long as nobody else is standing near it. A fire that burns out leaves a cold hearth; lighting a new fire beside it rekindles it there. Outside a claim, cold hearths disappear after a while. Find food. Berry bushes are the easiest food early on. The game tells you when you are hungry. Find water. You can drink from streams and ponds. Streams run down the valleys, so heading downhill will find one. Later you can carry water with you. Plan a shelter. Nights are cold and rain makes it worse. A lean-to is a reasonable first build, but it mostly keeps off rain and only a little of the cold. It does not replace a fire: keep a fire burning beside it. You can replace it with something better later. Check your journal (J). It lists what you have found and what you can make, and a short list of steps to follow. Your character When you make a character you pick a people: Bramble, Pebble, Kit, Capling, Dragonling or Chameleon. Each has its own choices, such as skin, hair or fur, shell, cap, scales, ears, horns or tail, and a Chameleon's skin slowly drifts between its two colours. You also choose how big you stand, from Small to Big. Looks and size are only for show: your reach and the way you move do not change. Clothes fit every people. Your road to a first clay pot A fired clay pot is the first big goal. Here is one way to get there. You do not have to follow it in order, and the journal (J) will nudge you with its \"Things to try\" lines as you learn each step. Gather. Pick up sticks, stones and plant fiber (E). You need about five fiber and five stones to start, and a few sticks, and more later. Shaping a stone needs a second stone in your pack to strike with. Make tinder and a fire. In the crafting panel (C), shred two fiber into tinder, then hand-drill a fire from two sticks and the tinder. A fire is warm and lets you cook. Feed it sticks to keep it going. Make an axe. Twist three fiber into cord. Shape a stone into a hand axe. Tie the hand axe and a stick to the cord to make a stone axe. Chop a log. Walk to a standing tree and chop it with the axe (right-click the tree to see the chop line). You will use the log for a bench. Each chop also gives a strip of bark fiber, and when the tree comes down it gives a few sticks and more fiber. Walk away from the clearing and raise a claim marker. The ground where everyone wakes up cannot be claimed. If you try too close, the game tells you how many meters further to walk. Your claim is the land around the marker. Build a potter's bench inside your claim, from a log and two stones. This is where pots are shaped. Dig clay. Dig (F) where the ground is low and damp, near water, or right-click clay ground and choose dig. You need a handful. Prepare the clay. Clean it (picks out stones and roots), crush a stone, and mix the crushed stone into the clean clay. Clay with nothing mixed in cracks in the fire. Pinch a pot at the bench. Shaping is a small game, and a steady hand makes a better pot. Let it dry, then fire it. Dry clay takes about five minutes, faster beside a burning fire (about two and a half) and slower in rain. A pot that is not dry will crack. Put the dry pot in a fire that has enough sticks to burn for the whole two-and-a-half-minute firing (the game tells you how many more to add). Fill it with water. Stand at the water's edge. A fired pot holds water. While the pot dries, there is plenty to do: shape a second pot, pick berries, plan a lean-to for the night, or just keep the fire fed. The Use key Most actions in the world go through one key, Use (E by default). When there is nothing in front of you to use, E picks up what lies at your feet. A prompt below your character shows what Use will do with the thing you are facing. No prompt means Use does nothing there. Moving the mouse turns the view; press V to get the cursor back, then right-click a person or thing to see everything you can do with it. See Keys and controls . Next: Your first night"}, {"slug": "first-night", "group": "Start here", "title": "Your first night", "path": "", "html": "<p>A day lasts about 90 minutes. Half of it is dark, so the first night is about 45 minutes long. You will probably meet it within your first hour, so it helps to know what it asks of you.<\/p>\n<h2 data-h=\"the-fire\">The fire<\/h2>\n<ul><li>\nA new fire burns about 20 minutes, and you can feed it up to about 30 minutes of fuel; it will not take more than that. Each stick adds about a minute and a half.\n<\/li><li>\nA whole night is about 45 minutes, so plan on roughly 30 sticks in all, and top the fire up two or three times. Gather them while there is light.\n<\/li><li>\nStand next to the fire and press E to add a stick. If you carry fuel and face the fire, the prompt shows about how long it has left.\n<\/li><li>\nStay within a few steps of the fire to stay warm. The warmth fades the further you walk from it.\n<\/li><li>\nA fire you lit waits for you while you are offline, inside your own claim or out in the open as long as nobody else is near it. A fire with other players standing by it keeps burning down while you are away.\n<\/li><\/ul>\n<h2 data-h=\"staying-warm\">Staying warm<\/h2>\n<ul><li>\nNight is cold, and rain makes it colder. Wading in water makes it worse again.\n<\/li><li>\nWhen about three minutes of warmth are left, the warmth ring breathes and a message tells you roughly how long you have. Head back to the fire as soon as you see it.\n<\/li><li>\nA lean-to turns the rain, but it keeps off only a little of the cold. It does not replace a fire. Keep a fire burning beside it.\n<\/li><li>\nIf you do freeze and die, only what is in your bag drops where you fell. Your tools and the clothes you wear stay with you. You wake at the edge of the wilderness, or on your sleeping mat if you laid one. Before a long walk in the dark, take only what you can afford to lose.\n<\/li><\/ul>\n<h2 data-h=\"seeing-in-the-dark\">Seeing in the dark<\/h2>\n<p>Night is dim but readable. To look around away from the fire, bind a torch: a stick wound thick with plant fiber, lit at a fire. It burns long enough to see by, and you can stick it in the ground to light a spot.<\/p>\n<h2 data-h=\"a-good-first-evening\">A good first evening<\/h2>\n<ol><li>\nGather a pile of sticks before the light goes.\n<\/li><li>\nLight a fire and keep it fed.\n<\/li><li>\nWork near it: shape a pot, plan a shelter, cook what you have found.\n<\/li><li>\nWhen the light is nearly gone, make a lean-to to keep the rain off, and keep the fire beside it.\n<\/li><\/ol>\n<p>Next: <a href=\"#controls\">Keys and controls<\/a><\/p>", "text": "A day lasts about 90 minutes. Half of it is dark, so the first night is about 45 minutes long. You will probably meet it within your first hour, so it helps to know what it asks of you. The fire A new fire burns about 20 minutes, and you can feed it up to about 30 minutes of fuel; it will not take more than that. Each stick adds about a minute and a half. A whole night is about 45 minutes, so plan on roughly 30 sticks in all, and top the fire up two or three times. Gather them while there is light. Stand next to the fire and press E to add a stick. If you carry fuel and face the fire, the prompt shows about how long it has left. Stay within a few steps of the fire to stay warm. The warmth fades the further you walk from it. A fire you lit waits for you while you are offline, inside your own claim or out in the open as long as nobody else is near it. A fire with other players standing by it keeps burning down while you are away. Staying warm Night is cold, and rain makes it colder. Wading in water makes it worse again. When about three minutes of warmth are left, the warmth ring breathes and a message tells you roughly how long you have. Head back to the fire as soon as you see it. A lean-to turns the rain, but it keeps off only a little of the cold. It does not replace a fire. Keep a fire burning beside it. If you do freeze and die, only what is in your bag drops where you fell. Your tools and the clothes you wear stay with you. You wake at the edge of the wilderness, or on your sleeping mat if you laid one. Before a long walk in the dark, take only what you can afford to lose. Seeing in the dark Night is dim but readable. To look around away from the fire, bind a torch: a stick wound thick with plant fiber, lit at a fire. It burns long enough to see by, and you can stick it in the ground to light a spot. A good first evening Gather a pile of sticks before the light goes. Light a fire and keep it fed. Work near it: shape a pot, plan a shelter, cook what you have found. When the light is nearly gone, make a lean-to to keep the rain off, and keep the fire beside it. Next: Keys and controls"}, {"slug": "controls", "group": "Start here", "title": "Keys and controls", "path": "", "html": "<p>The game shows a hint for each key the first time you need it. <strong>Hold F1<\/strong> at any time to see every key.<\/p>\n<h2 data-h=\"looking-around\">Looking around<\/h2>\n<p>By default you look with the mouse: the cursor is hidden, and moving the mouse turns the view and tilts it up or down, with no button held. Press <strong>V<\/strong> to get the cursor back, for clicking on things in the world, and V again to look with the mouse once more. Esc, the map, chat, any window or panel, and setting something down give you the cursor too, and mouse-look comes back by itself when they close.<\/p>\n<p>With the cursor free, hold the right mouse button and drag to turn the view.<\/p>\n<p>If you would rather keep the cursor all the time, switch <strong>Camera<\/strong> to classic on the Controls page of the Esc menu. On the classic camera the cursor never hides, and holding the right mouse button and dragging is how you turn. Mouse sensitivity is on the same page.<\/p>\n<h2 data-h=\"default-keys\">Default keys<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>Key<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>W A S D, or the arrow keys<\/td><td>Walk<\/td><\/tr><tr><td>Move the mouse<\/td><td>Look around<\/td><\/tr><tr><td>V<\/td><td>Get the cursor back, or look with the mouse again<\/td><\/tr><tr><td>Right-click a person or thing, with the cursor free<\/td><td>Open its menu (see below)<\/td><\/tr><tr><td>Hold Shift<\/td><td>Run (uses stamina)<\/td><\/tr><tr><td>Hold Ctrl<\/td><td>Sneak (walk slowly)<\/td><\/tr><tr><td>Space<\/td><td>Jump (uses a little stamina)<\/td><\/tr><tr><td>F<\/td><td>Dig<\/td><\/tr><tr><td>E<\/td><td><strong>Use<\/strong>: act on what you are facing (the prompt shows what it will do). With nothing to use, pick up what lies at your feet<\/td><\/tr><tr><td>C<\/td><td>Crafting panel<\/td><\/tr><tr><td>X<\/td><td>Eat the best food you carry<\/td><\/tr><tr><td>B<\/td><td>Build menu<\/td><\/tr><tr><td>H<\/td><td>Build a house part by part, on your claim<\/td><\/tr><tr><td>G<\/td><td>With a digging tool in hand, shape the ground on your land<\/td><\/tr><tr><td>I<\/td><td>Your bag beside what you wear. Drag items onto the hotbar, onto a slot to wear them, or out onto the ground; a plain drag moves the whole stack; double-click uses an item<\/td><\/tr><tr><td>1 to 9, 0<\/td><td>Use what sits on that hotbar slot: eat, drink, wear, or set a made thing down<\/td><\/tr><tr><td>J<\/td><td>Journal<\/td><\/tr><tr><td>K<\/td><td>Skills<\/td><\/tr><tr><td>O<\/td><td>Friends<\/td><\/tr><tr><td>M<\/td><td>The map you carry<\/td><\/tr><tr><td>Hold Q<\/td><td>Emote wheel: wave, cheer, sit or lie down. Point at one and let go<\/td><\/tr><tr><td>Enter<\/td><td>Chat<\/td><\/tr><tr><td>Left click<\/td><td>Strike<\/td><\/tr><tr><td>Hold left click, or R<\/td><td>With a weapon in hand, once you are skilled enough with it: use the weapon's arts<\/td><\/tr><tr><td>Hold Ctrl while dragging or clicking a stack in a window<\/td><td>Take just one from the stack<\/td><\/tr><tr><td>Hold Shift while dragging or clicking a stack in a window<\/td><td>Choose how many to take, in a small \"How many?\" window<\/td><\/tr><tr><td>Hold Ctrl when starting a craft in the crafting panel<\/td><td>Play the minigame even when your skill lets you skip it<\/td><\/tr><tr><td>F8<\/td><td>Report a bug<\/td><\/tr><tr><td>Esc<\/td><td>Menu (keys, sound and music volume on the Options page, quit)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>New tools hang on your tools belt by themselves when there is room, and the hotbar can show and use belt tools as well. The Options page also has \"Clear trees round me\", off by default: with it on, a tree between the view and your character clears completely round the character.<\/p>\n<p>Panels and minigames have their own keys, shown on screen while they are open. Drag a window by its top edge to move it; it stays where you left it, and Reset layout on the Options page puts everything back; hold Alt to move the rings, sundial and other pieces of the screen.<\/p>\n<h2 data-h=\"right-click-menus\">Right-click menus<\/h2>\n<p>Right-click a player, a tree, water, a bush, clay ground, something lying on the ground, a fire, a door, a drying pot or something you built, and a small menu shows what you can do there: trade, chop, drink, fill a pot, dig, feed the fire, bar a door, take your build down. A line that is greyed out says why you cannot do it yet. While you look with the mouse, press V first so the cursor shows, then right-click. A plain right-click opens the menu; holding the button and dragging turns the view.<\/p>\n<h2 data-h=\"your-look\">Your look<\/h2>\n<p>When you first join, a panel lets you choose your skin tone, hair color, haircut and beard. You can change it later from Options in the Esc menu (Your look). Everyone sees the look you choose.<\/p>\n<h2 data-h=\"chat-commands\">Chat commands<\/h2>\n<p>Anyone can type these into chat:<\/p>\n<ul><li>\n<code>/me<\/code> followed by an action describes what your character does.\n<\/li><li>\n<code>/name YourName<\/code> changes your name.\n<\/li><li>\n<code>/w<\/code> whispers to someone within a few steps, <code>/s<\/code> shouts a long way, and <code>/g<\/code> talks to your group wherever they are.\n<\/li><\/ul>\n<h2 data-h=\"changing-keys\">Changing keys<\/h2>\n<p>Every key can be rebound on the Controls page of the Esc menu. If you rebind a key, the in-game hints and prompts follow your choice; this page shows only the defaults. Music can be switched on or off on the Options page.<\/p>\n<p>Next: <a href=\"#needs\">Needs<\/a><\/p>", "text": "The game shows a hint for each key the first time you need it. Hold F1 at any time to see every key. Looking around By default you look with the mouse: the cursor is hidden, and moving the mouse turns the view and tilts it up or down, with no button held. Press V to get the cursor back, for clicking on things in the world, and V again to look with the mouse once more. Esc, the map, chat, any window or panel, and setting something down give you the cursor too, and mouse-look comes back by itself when they close. With the cursor free, hold the right mouse button and drag to turn the view. If you would rather keep the cursor all the time, switch Camera to classic on the Controls page of the Esc menu. On the classic camera the cursor never hides, and holding the right mouse button and dragging is how you turn. Mouse sensitivity is on the same page. Default keys Key Action W A S D, or the arrow keys Walk Move the mouse Look around V Get the cursor back, or look with the mouse again Right-click a person or thing, with the cursor free Open its menu (see below) Hold Shift Run (uses stamina) Hold Ctrl Sneak (walk slowly) Space Jump (uses a little stamina) F Dig E Use : act on what you are facing (the prompt shows what it will do). With nothing to use, pick up what lies at your feet C Crafting panel X Eat the best food you carry B Build menu H Build a house part by part, on your claim G With a digging tool in hand, shape the ground on your land I Your bag beside what you wear. Drag items onto the hotbar, onto a slot to wear them, or out onto the ground; a plain drag moves the whole stack; double-click uses an item 1 to 9, 0 Use what sits on that hotbar slot: eat, drink, wear, or set a made thing down J Journal K Skills O Friends M The map you carry Hold Q Emote wheel: wave, cheer, sit or lie down. Point at one and let go Enter Chat Left click Strike Hold left click, or R With a weapon in hand, once you are skilled enough with it: use the weapon's arts Hold Ctrl while dragging or clicking a stack in a window Take just one from the stack Hold Shift while dragging or clicking a stack in a window Choose how many to take, in a small \"How many?\" window Hold Ctrl when starting a craft in the crafting panel Play the minigame even when your skill lets you skip it F8 Report a bug Esc Menu (keys, sound and music volume on the Options page, quit) New tools hang on your tools belt by themselves when there is room, and the hotbar can show and use belt tools as well. The Options page also has \"Clear trees round me\", off by default: with it on, a tree between the view and your character clears completely round the character. Panels and minigames have their own keys, shown on screen while they are open. Drag a window by its top edge to move it; it stays where you left it, and Reset layout on the Options page puts everything back; hold Alt to move the rings, sundial and other pieces of the screen. Right-click menus Right-click a player, a tree, water, a bush, clay ground, something lying on the ground, a fire, a door, a drying pot or something you built, and a small menu shows what you can do there: trade, chop, drink, fill a pot, dig, feed the fire, bar a door, take your build down. A line that is greyed out says why you cannot do it yet. While you look with the mouse, press V first so the cursor shows, then right-click. A plain right-click opens the menu; holding the button and dragging turns the view. Your look When you first join, a panel lets you choose your skin tone, hair color, haircut and beard. You can change it later from Options in the Esc menu (Your look). Everyone sees the look you choose. Chat commands Anyone can type these into chat: /me followed by an action describes what your character does. /name YourName changes your name. /w whispers to someone within a few steps, /s shouts a long way, and /g talks to your group wherever they are. Changing keys Every key can be rebound on the Controls page of the Esc menu. If you rebind a key, the in-game hints and prompts follow your choice; this page shows only the defaults. Music can be switched on or off on the Options page. Next: Needs"}, {"slug": "tips", "group": "Start here", "title": "Tips", "path": "", "html": "<ul><li>\nCarry spare fuel. A fire goes out if you stop feeding it.\n<\/li><li>\nNeed to be found, or to call friends? Two fiber and a drill make a signal fire. It burns for only a few minutes and cannot be fed, but its tall, thick smoke can be seen from far away.\n<\/li><li>\nWatch the sky. Clouds build and darken before rain arrives.\n<\/li><li>\nGet to shelter before night or rain, and before a winter night above all.\n<\/li><li>\nStreams are shallow enough to wade across. Ponds are deeper; walk around them.\n<\/li><li>\nLost? Head downhill to find a stream.\n<\/li><li>\nTry picking up everything you see at least once. Many materials are not obvious.\n<\/li><li>\nA Use prompt means there is an action available. Read it before pressing.\n<\/li><li>\nDry clay fully before firing it.\n<\/li><li>\nSneak near sheep.\n<\/li><li>\nKeep your important buildings and storage inside a claim, or visit them regularly.\n<\/li><li>\nA cracked pot is still useful material.\n<\/li><li>\nFound something broken? Press F8, say what went wrong in a few words and send it. A picture of your screen and a few details about your game (where you are, the time, what you carry) go along with the report, so you do not need to explain them.\n<\/li><\/ul>\n<p>Next: <a href=\"#glossary\">Glossary<\/a><\/p>", "text": "Carry spare fuel. A fire goes out if you stop feeding it. Need to be found, or to call friends? Two fiber and a drill make a signal fire. It burns for only a few minutes and cannot be fed, but its tall, thick smoke can be seen from far away. Watch the sky. Clouds build and darken before rain arrives. Get to shelter before night or rain, and before a winter night above all. Streams are shallow enough to wade across. Ponds are deeper; walk around them. Lost? Head downhill to find a stream. Try picking up everything you see at least once. Many materials are not obvious. A Use prompt means there is an action available. Read it before pressing. Dry clay fully before firing it. Sneak near sheep. Keep your important buildings and storage inside a claim, or visit them regularly. A cracked pot is still useful material. Found something broken? Press F8, say what went wrong in a few words and send it. A picture of your screen and a few details about your game (where you are, the time, what you carry) go along with the report, so you do not need to explain them. Next: Glossary"}, {"slug": "needs", "group": "Staying alive", "title": "Needs", "path": "", "html": "<p>You have four needs: food, water, warmth and staying dry. They drain slowly, so you have time to react. They pause while you are offline.<\/p>\n<h2 data-h=\"food-and-water\">Food and water<\/h2>\n<p>Both go down over time. Water runs out faster than food. Press X to eat the best food you carry; face water and use it to drink. Cooked food fills you more than raw. Hot broth and stew also take a little of the chill off as you eat them. A stew can be made with rabbit, chicken, venison or mutton, or with just roots and berries. Mushrooms or spring greens, with a root or two, make a stew too. Wild greens only come up in the woods in spring. Once you can make a container, you can carry water. Raw meat cut into strips and hung on a leather drying rack becomes dried meat: it weighs a quarter as much, needs no fire, and you eat it as it is. A clay trough set up in the open, with nothing over it, slowly fills when it rains, so a home can have water without trips.<\/p>\n<h2 data-h=\"cold\">Cold<\/h2>\n<p>You lose warmth at night, in rain, and when standing in water. Colder air makes it happen faster, and rain makes it worse unless you are under cover. A burning fire nearby keeps you warm, and standing by one warms you back up. Shelter also helps, and a good shelter with a fire inside is the warmest place you can be. Clothing slows the loss of warmth too, but only while you wear it: put it on in the equipment panel (I).<\/p>\n<p>When about three minutes of warmth are left, the warmth ring starts to breathe and a message tells you roughly how long you have before you freeze. Rain and water use it up faster, so head for a fire as soon as you see it.<\/p>\n<p>The world goes through spring, summer, autumn and winter. Summer is warm. Winter days are cool, and winter nights are the coldest time in the game, so be near a fire or in a good shelter after dark. In cold weather, snow falls instead of rain.<\/p>\n<h2 data-h=\"new-arrivals\">New arrivals<\/h2>\n<p>A new character loses warmth more slowly for a while after first arriving. A small sprout badge next to the warmth ring shows this and fades when it ends. New characters also get thirsty more slowly during their first hour online. The thirst help does not come back after a death, but the slower chill does, for a short spell, so waking up cold at the edge of the wilderness gives you time to reach a fire.<\/p>\n<h2 data-h=\"wetness\">Wetness<\/h2>\n<p>Rain and wading make you wet. Heavy rain soaks you faster than drizzle, and wading soaks you very quickly. The wetter you are, the faster you lose warmth. Cold, rain and wetness add up only to a point, so even the worst weather gives you time to find shelter. You dry off over time, faster under cover and faster still beside a fire.<\/p>\n<h2 data-h=\"stamina\">Stamina<\/h2>\n<p>Hold Shift to run. Running uses stamina, shown as a small bar under your character while you are short of breath. When it runs out you walk until it refills. It refills after you stop running. A good meal lets you run longer for a while. Eating three different cooked foods within twenty minutes also slows hunger by a quarter for ten minutes; eating the same food again does no harm. Running trains Endurance, and higher Endurance means longer runs and a faster refill.<\/p>\n<h2 data-h=\"water\">Water<\/h2>\n<p>You can walk into any water. Walking slows as it gets deeper, and in deep water you float with your head above the surface and move slowly. You cannot jump while floating. Swimming in deep water tires you: the stamina bar drains (about a minute from full, longer as Endurance grows), and once it is empty you slow down further but never sink or drown. It refills on land or aboard a boat. Wading in shallow water costs nothing. Water soaks you quickly.<\/p>\n<h2 data-h=\"carrying\">Carrying<\/h2>\n<p>You can only carry so much. Clothes you wear do not count. Over the limit you can still pick things up, but you walk more slowly the more you carry. Some crafted items raise the limit.<\/p>\n<h2 data-h=\"death\">Death<\/h2>\n<p>If you die, whatever was in your bag drops where you fell. Your tools (wherever you carry them) and everything you are wearing stay with you (a basket on your back stays, but what is in its pockets drops with the bag), and so do your skills and everything in your journal. A pale light stands over the spot for as long as anything of yours still lies there (it fades when you arrive, returns if you step away, and is gone once you have taken it all), and the death message tells you which way it lies and about how far. Another player can take what you drop. You respawn with partial food and water and full warmth, and for a short while you lose warmth more slowly, as a new arrival does. The first-hour help for new arrivals keeps running. If you have laid a sleeping mat, you respawn on it; otherwise you respawn at the edge of the wilderness.<\/p>\n<p>Next: <a href=\"#gathering\">Gathering<\/a><\/p>", "text": "You have four needs: food, water, warmth and staying dry. They drain slowly, so you have time to react. They pause while you are offline. Food and water Both go down over time. Water runs out faster than food. Press X to eat the best food you carry; face water and use it to drink. Cooked food fills you more than raw. Hot broth and stew also take a little of the chill off as you eat them. A stew can be made with rabbit, chicken, venison or mutton, or with just roots and berries. Mushrooms or spring greens, with a root or two, make a stew too. Wild greens only come up in the woods in spring. Once you can make a container, you can carry water. Raw meat cut into strips and hung on a leather drying rack becomes dried meat: it weighs a quarter as much, needs no fire, and you eat it as it is. A clay trough set up in the open, with nothing over it, slowly fills when it rains, so a home can have water without trips. Cold You lose warmth at night, in rain, and when standing in water. Colder air makes it happen faster, and rain makes it worse unless you are under cover. A burning fire nearby keeps you warm, and standing by one warms you back up. Shelter also helps, and a good shelter with a fire inside is the warmest place you can be. Clothing slows the loss of warmth too, but only while you wear it: put it on in the equipment panel (I). When about three minutes of warmth are left, the warmth ring starts to breathe and a message tells you roughly how long you have before you freeze. Rain and water use it up faster, so head for a fire as soon as you see it. The world goes through spring, summer, autumn and winter. Summer is warm. Winter days are cool, and winter nights are the coldest time in the game, so be near a fire or in a good shelter after dark. In cold weather, snow falls instead of rain. New arrivals A new character loses warmth more slowly for a while after first arriving. A small sprout badge next to the warmth ring shows this and fades when it ends. New characters also get thirsty more slowly during their first hour online. The thirst help does not come back after a death, but the slower chill does, for a short spell, so waking up cold at the edge of the wilderness gives you time to reach a fire. Wetness Rain and wading make you wet. Heavy rain soaks you faster than drizzle, and wading soaks you very quickly. The wetter you are, the faster you lose warmth. Cold, rain and wetness add up only to a point, so even the worst weather gives you time to find shelter. You dry off over time, faster under cover and faster still beside a fire. Stamina Hold Shift to run. Running uses stamina, shown as a small bar under your character while you are short of breath. When it runs out you walk until it refills. It refills after you stop running. A good meal lets you run longer for a while. Eating three different cooked foods within twenty minutes also slows hunger by a quarter for ten minutes; eating the same food again does no harm. Running trains Endurance, and higher Endurance means longer runs and a faster refill. Water You can walk into any water. Walking slows as it gets deeper, and in deep water you float with your head above the surface and move slowly. You cannot jump while floating. Swimming in deep water tires you: the stamina bar drains (about a minute from full, longer as Endurance grows), and once it is empty you slow down further but never sink or drown. It refills on land or aboard a boat. Wading in shallow water costs nothing. Water soaks you quickly. Carrying You can only carry so much. Clothes you wear do not count. Over the limit you can still pick things up, but you walk more slowly the more you carry. Some crafted items raise the limit. Death If you die, whatever was in your bag drops where you fell. Your tools (wherever you carry them) and everything you are wearing stay with you (a basket on your back stays, but what is in its pockets drops with the bag), and so do your skills and everything in your journal. A pale light stands over the spot for as long as anything of yours still lies there (it fades when you arrive, returns if you step away, and is gone once you have taken it all), and the death message tells you which way it lies and about how far. Another player can take what you drop. You respawn with partial food and water and full warmth, and for a short while you lose warmth more slowly, as a new arrival does. The first-hour help for new arrivals keeps running. If you have laid a sleeping mat, you respawn on it; otherwise you respawn at the edge of the wilderness. Next: Gathering"}, {"slug": "gathering", "group": "Staying alive", "title": "Gathering", "path": "", "html": "<p>Most of what you need at the start is lying about or growing wild. Walk the land and look closely: pick things up with Use (E), and right-click a plant to see what it offers.<\/p>\n<h2 data-h=\"wild-food\">Wild food<\/h2>\n<ul><li>\n<strong>Berry bushes<\/strong> give berries all year and grow them back after a while. About one bush in three is a hazel, which gives hazelnuts in autumn only. Nuts are a small snack, and they can also be pressed for oil (see <a href=\"#light-and-lamps\">Light and lamps<\/a>).\n<\/li><li>\n<strong>Mushrooms<\/strong> come up in small clusters in the shade beside trees. They show from spring to autumn and never in the cold. They are a nibble, not a meal.\n<\/li><li>\n<strong>Wild roots<\/strong> grow as leafy tufts in open ground, away from trees. You need a digging stick to dig them up, and they can be dug in any season, so winter is not foodless.\n<\/li><\/ul>\n<p>Everything picked grows back in time, so a bush you have emptied is worth coming back to.<\/p>\n<h2 data-h=\"sticks-and-kindling\">Sticks and kindling<\/h2>\n<p>Sticks lie under the trees. On the heath, <strong>gorse<\/strong> is a spiny, yellow-flecked bush whose dry stems snap off for kindling and fuel at any time of year, and it slowly grows more.<\/p>\n<h2 data-h=\"what-the-land-adds\">What the land adds<\/h2>\n<p>Different country has its own finds lying on the ground, and they come back slowly once picked:<\/p>\n<ul><li>\n<strong>Highlands:<\/strong> flint, which chips finer than ordinary stone, and slate, which is flat and splits into slabs.\n<\/li><li>\n<strong>Marsh:<\/strong> reeds, and peat, which burns as fuel.\n<\/li><li>\n<strong>Coast:<\/strong> driftwood, which burns, and shells.\n<\/li><\/ul>\n<p>Ore is another matter; see <a href=\"#mining\">Mining<\/a>.<\/p>\n<p>Next: <a href=\"#crafting-and-skills\">Crafting and skills<\/a><\/p>", "text": "Most of what you need at the start is lying about or growing wild. Walk the land and look closely: pick things up with Use (E), and right-click a plant to see what it offers. Wild food Berry bushes give berries all year and grow them back after a while. About one bush in three is a hazel, which gives hazelnuts in autumn only. Nuts are a small snack, and they can also be pressed for oil (see Light and lamps ). Mushrooms come up in small clusters in the shade beside trees. They show from spring to autumn and never in the cold. They are a nibble, not a meal. Wild roots grow as leafy tufts in open ground, away from trees. You need a digging stick to dig them up, and they can be dug in any season, so winter is not foodless. Everything picked grows back in time, so a bush you have emptied is worth coming back to. Sticks and kindling Sticks lie under the trees. On the heath, gorse is a spiny, yellow-flecked bush whose dry stems snap off for kindling and fuel at any time of year, and it slowly grows more. What the land adds Different country has its own finds lying on the ground, and they come back slowly once picked: Highlands: flint, which chips finer than ordinary stone, and slate, which is flat and splits into slabs. Marsh: reeds, and peat, which burns as fuel. Coast: driftwood, which burns, and shells. Ore is another matter; see Mining . Next: Crafting and skills"}, {"slug": "light-and-lamps", "group": "Staying alive", "title": "Light and lamps", "path": "", "html": "<p>Fire is only the start of light. As the nights get longer you will want light you can carry or leave standing.<\/p>\n<h2 data-h=\"lighting-a-fire\">Lighting a fire<\/h2>\n<p>The hand drill is the first way: a stick, tinder and a steady rhythm in a short minigame. Once you have cord, a bow drill does the spinning for you, so it takes less work and fails less often. Either one needs tinder, which you shred from plant fiber. Feeding and tending a fire is covered in <a href=\"#first-night\">Your first night<\/a>.<\/p>\n<h2 data-h=\"torches\">Torches<\/h2>\n<p>Bind a torch from a stick and plant fiber, then light it at any burning fire or lit lamp. A lit torch burns for a good while in your hand and lights a circle around you, which matters in caves. You can stick a burning torch in the ground to leave a light standing until it burns out, but you can only have a handful standing at a time.<\/p>\n<h2 data-h=\"clay-lamps\">Clay lamps<\/h2>\n<p>A lamp is pinched from mixed clay at the potter's bench and fired like any pot (see <a href=\"#clay-and-pottery\">Clay and pottery<\/a>). To use one, set it down where you want it and light it from a burning fire or another lit lamp. It burns on animal fat (see <a href=\"#cooking-and-clothes\">Cooking and clothes<\/a>), on plant fiber if you have nothing better, or on nut oil pressed from hazelnuts at the potter's bench, which burns with a yellower flame.<\/p>\n<p>A lamp burns a long time on one measure of fuel, far longer than a torch. Press Use at a lamp to give it more fuel; anyone may feed a lamp. A lamp that is about to go out takes animal fat or nut oil from baskets, jars or your claim's shared storage nearby, so a lamp in your home looks after itself as long as the store has fuel. Use on an empty lamp picks it back up.<\/p>\n<h2 data-h=\"signal-fires\">Signal fires<\/h2>\n<p>A bundle of fiber lit with a drill makes a signal fire. It burns only a few minutes and cannot be fed, but it sends up a tall column of smoke that other players can see from far away.<\/p>\n<p>Next: <a href=\"#boats\">Boats<\/a><\/p>", "text": "Fire is only the start of light. As the nights get longer you will want light you can carry or leave standing. Lighting a fire The hand drill is the first way: a stick, tinder and a steady rhythm in a short minigame. Once you have cord, a bow drill does the spinning for you, so it takes less work and fails less often. Either one needs tinder, which you shred from plant fiber. Feeding and tending a fire is covered in Your first night . Torches Bind a torch from a stick and plant fiber, then light it at any burning fire or lit lamp. A lit torch burns for a good while in your hand and lights a circle around you, which matters in caves. You can stick a burning torch in the ground to leave a light standing until it burns out, but you can only have a handful standing at a time. Clay lamps A lamp is pinched from mixed clay at the potter's bench and fired like any pot (see Clay and pottery ). To use one, set it down where you want it and light it from a burning fire or another lit lamp. It burns on animal fat (see Cooking and clothes ), on plant fiber if you have nothing better, or on nut oil pressed from hazelnuts at the potter's bench, which burns with a yellower flame. A lamp burns a long time on one measure of fuel, far longer than a torch. Press Use at a lamp to give it more fuel; anyone may feed a lamp. A lamp that is about to go out takes animal fat or nut oil from baskets, jars or your claim's shared storage nearby, so a lamp in your home looks after itself as long as the store has fuel. Use on an empty lamp picks it back up. Signal fires A bundle of fiber lit with a drill makes a signal fire. It burns only a few minutes and cannot be fed, but it sends up a tall column of smoke that other players can see from far away. Next: Boats"}, {"slug": "cooking-and-clothes", "group": "Staying alive", "title": "Cooking and clothes", "path": "", "html": "<h2 data-h=\"cooking-at-a-fire\">Cooking at a fire<\/h2>\n<p>Raw meat, an egg and a few other things can be cooked at a burning fire. Mutton, venison, rabbit and chicken are roasted; an egg is boiled in the embers. Cooked food fills you more than raw. Leave it too long and it burns, and burnt food is worth much less, so take it off in time. A plain stick left in the embers chars into charcoal, which you need for drawing maps (see <a href=\"#maps\">Maps<\/a>).<\/p>\n<h2 data-h=\"cooking-in-a-pot\">Cooking in a pot<\/h2>\n<p>Once you own a fired pot, you can simmer food in it. Fill the pot with water at a stream, add the ingredients, and set it down by a burning fire. The pot then cooks on its own while you get on with other things; Use it to take it off the fire.<\/p>\n<ul><li>\n<strong>Berry broth<\/strong> is water and berries. The small pinch pot can make a little of it; the larger coiled pot makes more.\n<\/li><li>\n<strong>Stew<\/strong> needs the larger pot. Mutton, rabbit, chicken or venison each make their own stew, and so do plain roots and berries. A hot dish takes a little chill off as you eat it.\n<\/li><li>\n<strong>Animal fat<\/strong> is mutton fat melted down in the larger pot. It is not food: it is fuel for clay lamps.\n<\/li><\/ul>\n<h2 data-h=\"clothes\">Clothes<\/h2>\n<p>Clothing keeps the cold off, but only while you wear it. Open the equipment panel (I) and put a piece on. Each piece goes in its own slot: head, body, cloak, feet, or back. Worn clothes do not count toward what you carry, and like everything else you carry they fall where you die.<\/p>\n<ul><li>\n<strong>Plant tunic.<\/strong> Make thread from fiber, weave the thread over a stick frame into plant cloth, then cut and sew a tunic. You need something sharp to cut with.\n<\/li><li>\n<strong>Wool tunic.<\/strong> Spin wool into yarn at the spindle station, weave the yarn into wool cloth, and sew a tunic at the crafting table. It keeps out more cold than the plant tunic.\n<\/li><li>\n<strong>Wool cap.<\/strong> Knit yarn into a cap. It keeps your head and ears out of the cold.\n<\/li><li>\n<strong>Wool cloak.<\/strong> Cut and sew wool cloth and yarn into a cloak at the crafting table, with something sharp to cut with. It goes over your tunic and keeps more of the cold off.\n<\/li><li>\n<strong>Leather foot wraps.<\/strong> Cut and lace a piece of leather with cordage at the leather drying rack. They keep your feet off the cold ground.\n<\/li><li>\n<strong>A basket<\/strong> can be worn on your back. It has four pockets of its own and lets you carry a little more.\n<\/li><\/ul>\n<p>A tunic only slows the cold; it does not replace a fire. See <a href=\"#needs\">Needs<\/a>.<\/p>\n<p>Next: <a href=\"#hides-and-leather\">Hides and leather<\/a><\/p>", "text": "Cooking at a fire Raw meat, an egg and a few other things can be cooked at a burning fire. Mutton, venison, rabbit and chicken are roasted; an egg is boiled in the embers. Cooked food fills you more than raw. Leave it too long and it burns, and burnt food is worth much less, so take it off in time. A plain stick left in the embers chars into charcoal, which you need for drawing maps (see Maps ). Cooking in a pot Once you own a fired pot, you can simmer food in it. Fill the pot with water at a stream, add the ingredients, and set it down by a burning fire. The pot then cooks on its own while you get on with other things; Use it to take it off the fire. Berry broth is water and berries. The small pinch pot can make a little of it; the larger coiled pot makes more. Stew needs the larger pot. Mutton, rabbit, chicken or venison each make their own stew, and so do plain roots and berries. A hot dish takes a little chill off as you eat it. Animal fat is mutton fat melted down in the larger pot. It is not food: it is fuel for clay lamps. Clothes Clothing keeps the cold off, but only while you wear it. Open the equipment panel (I) and put a piece on. Each piece goes in its own slot: head, body, cloak, feet, or back. Worn clothes do not count toward what you carry, and like everything else you carry they fall where you die. Plant tunic. Make thread from fiber, weave the thread over a stick frame into plant cloth, then cut and sew a tunic. You need something sharp to cut with. Wool tunic. Spin wool into yarn at the spindle station, weave the yarn into wool cloth, and sew a tunic at the crafting table. It keeps out more cold than the plant tunic. Wool cap. Knit yarn into a cap. It keeps your head and ears out of the cold. Wool cloak. Cut and sew wool cloth and yarn into a cloak at the crafting table, with something sharp to cut with. It goes over your tunic and keeps more of the cold off. Leather foot wraps. Cut and lace a piece of leather with cordage at the leather drying rack. They keep your feet off the cold ground. A basket can be worn on your back. It has four pockets of its own and lets you carry a little more. A tunic only slows the cold; it does not replace a fire. See Needs . Next: Hides and leather"}, {"slug": "crafting-and-skills", "group": "Making things", "title": "Crafting and skills", "path": "", "html": "<h2 data-h=\"crafting\">Crafting<\/h2>\n<p>Open the crafting panel with C. It lists what you can make, grouped in steps. The first step uses bare hands and found materials. Each tool you make unlocks more recipes; a sharp stone edge, for example, does things your hands cannot. A better-quality tool also works a little faster. With the right tool you can chop logs from trees; a tree falls after a few logs and grows back in time.<\/p>\n<p>How long a craft takes depends on what you make: bigger and more advanced items take longer. Skill and a better tool make it faster.<\/p>\n<h2 data-h=\"stations\">Stations<\/h2>\n<p>Basic crafts (fire, stone tools, digging, cord, clay preparation and the first tools with a handle) can be made anywhere from the crafting panel. Other items need a crafting station. The stations are:<\/p>\n<ul><li>\n<strong>Crafting Table:<\/strong> baskets, simple clothing and general items.\n<\/li><li>\n<strong>Potter's bench:<\/strong> shaping pots and jars.\n<\/li><li>\n<strong>Spindle station:<\/strong> spinning wool and weaving cloth.\n<\/li><li>\n<strong>Leather drying rack:<\/strong> working hides into leather.\n<\/li><li>\n<strong>Repair table:<\/strong> mending worn tools.\n<\/li><li>\n<strong>Settling tub, crushing block and clay mixing trough:<\/strong> for working clay in bigger batches.\n<\/li><li>\n<strong>Map table:<\/strong> drawing maps.\n<\/li><\/ul>\n<p>Some stations need wood from a felled tree, so you will want an axe early. Stations are built from the build menu and only inside a claim you have rights to. You work standing next to one, and it uses materials from what you carry, from storage close to it, and from the claim's shared storage.<\/p>\n<p>What you make goes into your bag. Things such as bricks, fired pots, storage jars, baskets and logs can be set down on the ground: drag one out of the bag (I) over the world, press its hotbar key, or take the \"Place\" prompt right after crafting it. A see-through outline follows the cursor and turns amber where it cannot go, such as water or steep ground. Click to set it down, turn it with T, Shift+T or the scroll wheel, and press Esc to put it back.<\/p>\n<h2 data-h=\"tools-wear-out\">Tools wear out<\/h2>\n<p>Spears, axes, knives, digging sticks and bow drills wear down as you use them. The item shows when it is worn or nearly spent. A spent tool stays in your bag but stops working until you mend it at a repair table. Mending costs far less than making a new tool, but each repair lowers its quality a little. Stone flakes, hand axes and stations do not wear out.<\/p>\n<p>Some crafts are minigames, such as chipping stone and shaping clay. Your result depends on how well you play them. Press Esc to quit a minigame.<\/p>\n<h2 data-h=\"skills\">Skills<\/h2>\n<p>Every craft trains a skill. Higher skill gives better results and faster work. Failed attempts still give some progress, at a reduced rate. Press K to see your skills.<\/p>\n<ul><li>\n<strong>Survival basics<\/strong> (fire, foraging, digging, simple tools, shelter, animal care, stalking, endurance, swimming, seamanship) are open to everyone with no limit. Cooking trains firecraft.\n<\/li><li>\n<strong>Specialties<\/strong>, such as Potter, Builder, Leatherwork, Weaver, Miner, Smithing, Map making and Gemcraft, share a fixed total. You cannot max every specialty on one character, so choose which crafts to focus on. Players who specialise differently can make things for each other.\n<\/li><li>\n<strong>Fighting skills<\/strong> come one per weapon family: Blades, Blunt weapons, Axes, Spears, Throwing and Archery. Each trains by striking with its weapons, rises more slowly than a craft, and counts toward the same fixed total.\n<\/li><li>\n<strong>Lowering a skill<\/strong> frees room under the total. Mark a skill to lower it on the Skills page and it fades away over about a week, even while you are away. Un-mark it and it stops fading where it is. The page shows how much room to learn you have left.\n<\/li><li>\n<strong>Titles<\/strong> mark ranks within a skill. At rank 50 in Potter you choose a focus, Vessels (pinch and coil pots) or Firing (pit fires and kilns). In Builder you choose Framer (frames and stick walls) or Finisher (plaster and thatch). The buttons are under the skill on the Skills page (K). Work in your focus goes as if the skill were 10 ranks higher, and everything else works as before. You keep the focus while the skill stays at 50 or more; if it fades below 50, you choose again.\n<\/li><li>\n<strong>Master rank<\/strong> skips crafting minigames and gives a steady result. Hold Ctrl when starting a craft to play the minigame anyway, for a chance at a better result.\n<\/li><\/ul>\n<h2 data-h=\"the-journal\">The journal<\/h2>\n<p>Press J to open the journal. It records the materials you have found and the processes you know. Each process you know has a one-line reminder of how to do it again. Near the top, a short list of steps (\"The road to your first pot\", then \"The road to a place of your own\") shows what you have done and what comes next. The Items page shows every item as a box: pick one to see what it is made from and what it goes into. Things you have not found yet appear as dark shapes.<\/p>\n<p>You can also learn a process from other players: by watching them do it, or by reading a note they have left on the ground (Use to read).<\/p>\n<p>Next: <a href=\"#clay-and-pottery\">Clay and pottery<\/a><\/p>", "text": "Crafting Open the crafting panel with C. It lists what you can make, grouped in steps. The first step uses bare hands and found materials. Each tool you make unlocks more recipes; a sharp stone edge, for example, does things your hands cannot. A better-quality tool also works a little faster. With the right tool you can chop logs from trees; a tree falls after a few logs and grows back in time. How long a craft takes depends on what you make: bigger and more advanced items take longer. Skill and a better tool make it faster. Stations Basic crafts (fire, stone tools, digging, cord, clay preparation and the first tools with a handle) can be made anywhere from the crafting panel. Other items need a crafting station. The stations are: Crafting Table: baskets, simple clothing and general items. Potter's bench: shaping pots and jars. Spindle station: spinning wool and weaving cloth. Leather drying rack: working hides into leather. Repair table: mending worn tools. Settling tub, crushing block and clay mixing trough: for working clay in bigger batches. Map table: drawing maps. Some stations need wood from a felled tree, so you will want an axe early. Stations are built from the build menu and only inside a claim you have rights to. You work standing next to one, and it uses materials from what you carry, from storage close to it, and from the claim's shared storage. What you make goes into your bag. Things such as bricks, fired pots, storage jars, baskets and logs can be set down on the ground: drag one out of the bag (I) over the world, press its hotbar key, or take the \"Place\" prompt right after crafting it. A see-through outline follows the cursor and turns amber where it cannot go, such as water or steep ground. Click to set it down, turn it with T, Shift+T or the scroll wheel, and press Esc to put it back. Tools wear out Spears, axes, knives, digging sticks and bow drills wear down as you use them. The item shows when it is worn or nearly spent. A spent tool stays in your bag but stops working until you mend it at a repair table. Mending costs far less than making a new tool, but each repair lowers its quality a little. Stone flakes, hand axes and stations do not wear out. Some crafts are minigames, such as chipping stone and shaping clay. Your result depends on how well you play them. Press Esc to quit a minigame. Skills Every craft trains a skill. Higher skill gives better results and faster work. Failed attempts still give some progress, at a reduced rate. Press K to see your skills. Survival basics (fire, foraging, digging, simple tools, shelter, animal care, stalking, endurance, swimming, seamanship) are open to everyone with no limit. Cooking trains firecraft. Specialties , such as Potter, Builder, Leatherwork, Weaver, Miner, Smithing, Map making and Gemcraft, share a fixed total. You cannot max every specialty on one character, so choose which crafts to focus on. Players who specialise differently can make things for each other. Fighting skills come one per weapon family: Blades, Blunt weapons, Axes, Spears, Throwing and Archery. Each trains by striking with its weapons, rises more slowly than a craft, and counts toward the same fixed total. Lowering a skill frees room under the total. Mark a skill to lower it on the Skills page and it fades away over about a week, even while you are away. Un-mark it and it stops fading where it is. The page shows how much room to learn you have left. Titles mark ranks within a skill. At rank 50 in Potter you choose a focus, Vessels (pinch and coil pots) or Firing (pit fires and kilns). In Builder you choose Framer (frames and stick walls) or Finisher (plaster and thatch). The buttons are under the skill on the Skills page (K). Work in your focus goes as if the skill were 10 ranks higher, and everything else works as before. You keep the focus while the skill stays at 50 or more; if it fades below 50, you choose again. Master rank skips crafting minigames and gives a steady result. Hold Ctrl when starting a craft to play the minigame anyway, for a chance at a better result. The journal Press J to open the journal. It records the materials you have found and the processes you know. Each process you know has a one-line reminder of how to do it again. Near the top, a short list of steps (\"The road to your first pot\", then \"The road to a place of your own\") shows what you have done and what comes next. The Items page shows every item as a box: pick one to see what it is made from and what it goes into. Things you have not found yet appear as dark shapes. You can also learn a process from other players: by watching them do it, or by reading a note they have left on the ground (Use to read). Next: Clay and pottery"}, {"slug": "clay-and-pottery", "group": "Making things", "title": "Clay and pottery", "path": "", "html": "<p>A fired clay pot is the first major goal. Pots carry water and lead into cooking, storage and better buildings.<\/p>\n<h2 data-h=\"steps\">Steps<\/h2>\n<ul><li>\n<strong>Find clay.<\/strong> Clay is underground; dig for it (F), or right-click clay ground and choose dig. Deeper clay is better. Digging with a tool lets you reach deeper than bare hands.\n<\/li><li>\n<strong>Prepare it.<\/strong> Clean out the stones and roots, then work crushed stone or crushed broken pottery into the clay. Clay with nothing worked into it cracks in the fire.\n<\/li><li>\n<strong>Shape it.<\/strong> Shaping is done at a Potter's bench inside a claim, and it is a minigame. A good wall gives a better pot. Small pots are pinched and bigger ones coiled; the same bench also shapes lamps (see <a href=\"#light-and-lamps\">Light and lamps<\/a>), roof tiles, troughs and storage jars. Bricks and clay plaster need no bench.\n<\/li><li>\n<strong>Dry it.<\/strong> Wet clay cannot be fired safely. Drying is slower in rain and faster beside a burning fire. A roof keeps the rain off a drying pot, and a drying shelf (see <a href=\"#building-and-claims\">Building and claims<\/a>) does both: clay dries faster on it and stays out of the rain.\n<\/li><li>\n<strong>Fire it.<\/strong> Fire turns dry clay into pottery. Set a few dry pieces beside a burning fire and fire them where they stand, and keep the fire fed until they are done. A pot fired before it is dry will crack. Cracked pieces are not wasted: they become broken pottery, which can be crushed and worked into later clay.\n<\/li><li>\n<strong>Fill it.<\/strong> Stand at the water's edge to fill a fired pot.\n<\/li><\/ul>\n<h2 data-h=\"later\">Later<\/h2>\n<p>Bricks and clay plaster are needed for kilns and stronger buildings. A small kiln takes two bricks and fires a few pots more safely than an open fire. A full kiln fires several pots at once and gives better results. Large pieces such as the storage jar, roof tiles and clay troughs can only be fired in a full kiln. The journal's \"road to a place of your own\" lists the steps.<\/p>\n<h2 data-h=\"your-maker-s-mark\">Your maker's mark<\/h2>\n<p>Every potter can choose a small personal mark, a simple line stamp in a colour of their choice, and the pots, jars, lamps and troughs they shape carry it. The first time you start shaping a pot with no mark chosen, the mark picker opens. You can change it later from the options menu (Your mark) or from the Use prompt at a potter's bench. Pots you already made follow the change. Anyone who looks at one of your pots, in a bag or on the ground, can see who made it, so a well-made pot is a small way of signing your work.<\/p>\n<p>Next: <a href=\"#building-and-claims\">Building and claims<\/a><\/p>", "text": "A fired clay pot is the first major goal. Pots carry water and lead into cooking, storage and better buildings. Steps Find clay. Clay is underground; dig for it (F), or right-click clay ground and choose dig. Deeper clay is better. Digging with a tool lets you reach deeper than bare hands. Prepare it. Clean out the stones and roots, then work crushed stone or crushed broken pottery into the clay. Clay with nothing worked into it cracks in the fire. Shape it. Shaping is done at a Potter's bench inside a claim, and it is a minigame. A good wall gives a better pot. Small pots are pinched and bigger ones coiled; the same bench also shapes lamps (see Light and lamps ), roof tiles, troughs and storage jars. Bricks and clay plaster need no bench. Dry it. Wet clay cannot be fired safely. Drying is slower in rain and faster beside a burning fire. A roof keeps the rain off a drying pot, and a drying shelf (see Building and claims ) does both: clay dries faster on it and stays out of the rain. Fire it. Fire turns dry clay into pottery. Set a few dry pieces beside a burning fire and fire them where they stand, and keep the fire fed until they are done. A pot fired before it is dry will crack. Cracked pieces are not wasted: they become broken pottery, which can be crushed and worked into later clay. Fill it. Stand at the water's edge to fill a fired pot. Later Bricks and clay plaster are needed for kilns and stronger buildings. A small kiln takes two bricks and fires a few pots more safely than an open fire. A full kiln fires several pots at once and gives better results. Large pieces such as the storage jar, roof tiles and clay troughs can only be fired in a full kiln. The journal's \"road to a place of your own\" lists the steps. Your maker's mark Every potter can choose a small personal mark, a simple line stamp in a colour of their choice, and the pots, jars, lamps and troughs they shape carry it. The first time you start shaping a pot with no mark chosen, the mark picker opens. You can change it later from the options menu (Your mark) or from the Use prompt at a potter's bench. Pots you already made follow the change. Anyone who looks at one of your pots, in a bag or on the ground, can see who made it, so a well-made pot is a small way of signing your work. Next: Building and claims"}, {"slug": "working-wood", "group": "Making things", "title": "Working wood", "path": "", "html": "<p>Wood is the first thing most builds ask for. Anything with a heavy edge, such as a stone axe, will cut it.<\/p>\n<h2 data-h=\"chopping\">Chopping<\/h2>\n<p>Walk to a standing tree with an axe in your hand and chop it (right-click the tree to see the chop line). Each chop gives a log. A tree comes down after a few logs, and a felled tree leaves a stump that rots away; a sapling then grows in its place and in
