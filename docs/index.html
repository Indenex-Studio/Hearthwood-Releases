steel.\n<\/li><li>\nNamed goblins taunt you by private message and shout in chat when you're near their camp. Options can mute them.\n<\/li><li>\nA dead animal lying on someone's claim can only be butchered or carried off by the claim's owner and members.\n<\/li><li>\nOnly a boat's owner and their claim members can use its hold, aboard or from the shore.\n<\/li><li>\nA building job taken at a town board teaches you a little more than building the same thing for yourself.\n<\/li><li>\nThe Field Guide has an Items page, in the game's own words.\n<\/li><\/ul>\n<p><strong>Look and sound<\/strong><\/p>\n<ul><li>\nA new tree renderer: fuller pines and broadleaves out to the horizon, with crowns carried high on bare trunks you can see between. The old trees are one setting away.\n<\/li><li>\nGrass carries on much further toward the horizon, and fields look fuller.\n<\/li><li>\nStorms at sea raise much bigger swells, and a storm sea looks rough and broken instead of glossy.\n<\/li><li>\nMedium graphics draws the clouds more cheaply, for a smoother frame rate; they look a touch lighter and softer.\n<\/li><\/ul>\n<h2 data-h=\"23-october\">23 October<\/h2>\n<p><strong>Late evening<\/strong><\/p>\n<ul><li>\nThe clay mixing trough is now the kneading trough.\n<\/li><li>\nA downed monster disappears after about a minute, and a new one takes its place.\n<\/li><li>\nTo dig up roots, take your digging stick in hand (its number key).\n<\/li><li>\nA big boat frame that cannot launch into water says so instead of taking your materials.\n<\/li><li>\nIn house build mode, the note tells you how many boards or sticks you still need, and when a house is nearly full.\n<\/li><li>\nResting your view on something with a menu shows its name and \"Right-click for more\" again.\n<\/li><li>\nThe Drink prompt shows at the water even when you are not thirsty.\n<\/li><li>\nYou see a player's town and offices only when they are in your own town.\n<\/li><li>\nA claim member's hut on a town claim stays unless the claim's owner or the builder takes it down.\n<\/li><li>\nA dry roof tile or clay trough says \"Pick up the roof tile\" instead of \"Pick up the jar\".\n<\/li><li>\nSunrise and sunset are no longer brighter than midday; the morning light builds gently as the sun climbs.\n<\/li><li>\nBoat wakes are a clear white foam trail behind the stern.\n<\/li><li>\nThe sea no longer shows dark blotches near the coast, pale lines in the shallows or a crosshatch in the sun's sparkle.\n<\/li><li>\nAt the farthest Full detail settings, ground that has loaded stays loaded when you turn round.\n<\/li><\/ul>\n<p><strong>Evening<\/strong><\/p>\n<ul><li>\nReal 3D clouds on Medium and High graphics: they drift, shade the ground and build into storms. Low keeps the lighter clouds. Options can switch either way.\n<\/li><li>\nForests past 2 km are painted onto the land instead of drawn tree by tree, so the default view runs much faster, and distant trees on ridges no longer hover.\n<\/li><li>\nThe sea runs smoothly to the horizon. Waves roll on all the open sea round the home continent, while inland lakes stay still. Storm spray is soft mist, ships throw spray when they slam into a wave, and wakes no longer echo far across the water.\n<\/li><li>\nOn a boat, K, X, R and F work only the boat (who may board, anchor, sail in and out). They show on the F1 list and can be changed on the Controls page.\n<\/li><li>\nPressing H to build a house shows a note with what each part costs, what you carry and how far along the house is.\n<\/li><li>\nMonsters far from any player keep their wounds until you come back.\n<\/li><li>\nDying wears your worn gear a little.\n<\/li><li>\nHotbar items show their pictures again, and the new-arrival badge beside the warmth ring is easy to see.\n<\/li><li>\nThe dig hint names the reddish-brown clay.\n<\/li><\/ul>\n<p><strong>Skills<\/strong><\/p>\n<ul><li>\nThe Smith, Leatherwork and Weaver skills each have focuses to choose from.\n<\/li><\/ul>\n<p><strong>Look and sound<\/strong><\/p>\n<ul><li>\nNew clouds: soft, rounded heaps that drift with the wind and follow the weather, with thin high streaks above them.\n<\/li><li>\nAt night the Milky Way turns overhead and the moon shows its real face. The sun reddens as it sets, and the day sky is a deeper blue.\n<\/li><li>\nNew grass everywhere. The old tufts can still be switched on.\n<\/li><li>\nA new colour for the open sea.\n<\/li><li>\nTree shadows and far trees no longer pop or blink as you move through the woods or fly over them.\n<\/li><li>\nOptions has a Credits button.\n<\/li><\/ul>\n<p><strong>Playing together<\/strong><\/p>\n<ul><li>\nInspect another player to read a note with their five best skills.\n<\/li><\/ul>\n<p><strong>Settings<\/strong><\/p>\n<ul><li>\nFull detail in Options, Graphics now reaches 256 m and 512 m, with longer test steps beyond. At the far steps the land you are looking toward is built first, so it loads faster and uses less memory.\n<\/li><\/ul>\n<p><strong>Fixes<\/strong><\/p>\n<ul><li>\nScraping a hide, drying meat, making a spindle and other station work no longer stop on their own while the station's window is open.\n<\/li><li>\nBuild costs are easy to read on the dark windows, with missing materials shown in rust. Trade items show their pictures clearly, and the friends list headings stand apart from the names.\n<\/li><li>\nThe keys and wear windows fit a 720p screen, and minigame hints are easier to read.\n<\/li><li>\nIf the game cannot reach the world it says so plainly, and the death card stays up long enough to read.\n<\/li><li>\nA note can no longer be read through a hut wall, and watching or teaching someone stops at walls.\n<\/li><\/ul>\n<h2 data-h=\"22-october\">22 October<\/h2>\n<p><strong>Controls<\/strong><\/p>\n<ul><li>\nThe mouse now turns the view without holding a button. Press V to get the cursor back, then right-click a person or thing for its menu. Prefer the old way? Switch Camera to classic on the Controls page. See Keys and controls.\n<\/li><li>\nThe first tips teach V before right-clicking, and hints sit on a small paper note.\n<\/li><\/ul>\n<p><strong>Fishing<\/strong><\/p>\n<ul><li>\nMake a fishing line from cord, a stick and a stone flake. Cast into ponds, streams or the sea, strike as the float dips, and reel bigger fish in. Worms and cut bait bring bites sooner.\n<\/li><li>\nEach fish bites by water, time of day and season, and comes in three colourings to collect. Out at sea, shoals of leaping fish drift along the coast, and a golden sunscale hides somewhere.\n<\/li><li>\nEvery fish has a weight. The journal's Fish page keeps your biggest of each kind and a box for each colouring. A skilled angler lands rare colourings more often.\n<\/li><li>\nYou hear the cast, the bite and the reel, and other players' fishing too.\n<\/li><\/ul>\n<p><strong>Journal<\/strong><\/p>\n<ul><li>\nAn Almanac: meet animals, fell foes, reach places and gather plants to fill its chapters and earn titles.\n<\/li><li>\nThe journal leads on past the first week, toward your first trade and a town of your own.\n<\/li><li>\nWhen you log back in, a page tells you who used your stash, what your town did and who learned from you while you were away.\n<\/li><li>\nDeep recipes show in the Items book.\n<\/li><\/ul>\n<p><strong>Skills<\/strong><\/p>\n<ul><li>\nWorking beside someone far better at the same skill teaches you faster, and teachers earn a title for their pupils.\n<\/li><li>\nRaising a house's floors, walls and roof trains Builder.\n<\/li><li>\nThe Skills page says what each skill opens next. Very fine work carries its maker's name.\n<\/li><\/ul>\n<p><strong>Towns and building<\/strong><\/p>\n<ul><li>\nAt a town board, post one of your building sites with a fee, and someone else can build it for you. Or take a job there, build it on their land, and the fee is yours when it stands.\n<\/li><li>\nHover any build in the build menu to read what it takes.\n<\/li><li>\nThe repair table's menu mends your tools.\n<\/li><li>\nA campfire holds more fuel before it needs feeding.\n<\/li><\/ul>\n<p><strong>Sailing<\/strong><\/p>\n<ul><li>\nA helm wheel on the sailing boat, a sail to trim and an anchor to drop.\n<\/li><li>\nCrew take jobs by seat, and the sailing line says who has which.\n<\/li><li>\nThe lookout seat names the nearest land and boat.\n<\/li><li>\nThe owner chooses who may board.\n<\/li><li>\nStorm seas push a boat along or hold it back, and ships lean outward in a turn.\n<\/li><li>\nA wake behind moving boats and a splash at the paddle.\n<\/li><li>\nOut on open water you hear the sea, from a calm swell to a storm, and aboard a boat the hull slaps and spray hisses in rough water.\n<\/li><\/ul>\n<p><strong>World<\/strong><\/p>\n<ul><li>\nRivers are wide, deep and have water in them; before, they were dry mossy channels. Big rivers can be sailed.\n<\/li><li>\nCave rooms hold loot, and each boss guards a hoard.\n<\/li><\/ul>\n<p><strong>Characters and foes<\/strong><\/p>\n<ul><li>\nA new character picks where to wake on a painted map of the land.\n<\/li><li>\nNew, smoother movement for dragons, turtles and mushroom folk: running, jumping, swimming, working, fighting and sneaking.\n<\/li><li>\nGoblins crouch, scurry and swing with real weight. The Watcher raises its long arm for a slow heavy swing, the Shade stalker creeps and rakes, and the gloom warden glides with its lantern swinging.\n<\/li><\/ul>\n<p><strong>Settings and speed<\/strong><\/p>\n<ul><li>\nWindows look like torn crème parchment, and Options has a walnut-and-brass dark mode.\n<\/li><li>\nWith Draw distance on Everything the game runs much lighter, and distant land keeps the near ground's colours.\n<\/li><li>\nWalking no longer stutters every few steps near lamps, and busy places with many players and animals feel smoother.\n<\/li><\/ul>\n<p><strong>Fixes<\/strong><\/p>\n<ul><li>\nYou can change your name once a minute. A name someone already has is refused without using up the wait.\n<\/li><li>\nA worked-out vein goes dark all at once.\n<\/li><\/ul>\n<h2 data-h=\"21-october\">21 October<\/h2>\n<p><strong>Characters<\/strong><\/p>\n<ul><li>\nTurtles have new bodies, with a build choice and blinking eyes. Dragons and mushroom folk blink and glance about.\n<\/li><li>\nTwo new emotes: laugh and come here. Characters now hold out a hand to feed animals, sew leather, work the dye pot, knead dough, and carry a pot in both hands. Standing still, they shift their weight now and then.\n<\/li><li>\nHorses and donkeys move like animals, and a rider sits properly in the saddle.\n<\/li><li>\nPale skin, cloth and scales keep their colour in bright midday sun.\n<\/li><\/ul>\n<p><strong>Crafting and survival<\/strong><\/p>\n<ul><li>\nA clay cup, pinched, dried and fired, to drink from.\n<\/li><li>\nA warmer wool tunic.\n<\/li><li>\nEating three different cooked foods close together slows your hunger for a while.\n<\/li><\/ul>\n<p><strong>Fighting<\/strong><\/p>\n<ul><li>\nWeapon arts step and dip on every body.\n<\/li><\/ul>\n<p><strong>Claims<\/strong><\/p>\n<ul><li>\nYou are told how to keep your land, and told if it went back to the wild while you were away.\n<\/li><li>\nThe land window says how big your claim is and what it protects, and a friend you let into your home sees what they may do there.\n<\/li><li>\nTrades hand over the exact tool you were shown, show how worn it is, and tell you what you got.\n<\/li><li>\nYou can leave up to 100 of your own things on one patch of ground. Past that, pick some up or use a basket.\n<\/li><\/ul>\n<p><strong>Sailing<\/strong><\/p>\n<ul><li>\nBoats ride the waves. Rough seas slow them and push them gently sideways.\n<\/li><\/ul>\n<p><strong>Settings and speed<\/strong><\/p>\n<ul><li>\nOptions, Graphics has a Draw distance slider (Near, 1 km, 2 km, 4 km, Everything). View distance is now called Full detail.\n<\/li><li>\nLonger, sharper shadows on High, shadows that look the same everywhere in the world, and character shadows that cost far less.\n<\/li><li>\nLamps and fires in a distant town glow where they really are.\n<\/li><\/ul>\n<h2 data-h=\"20-october\">20 October<\/h2>\n<p><strong>Fighting<\/strong><\/p>\n<ul><li>\nFoes have new storybook models. Bone rattlers come in three kinds: armoured ones at the stone rings, barrow-grown ones in barrows, and lantern ghosts in the churchyard crypts.\n<\/li><li>\nThree new foes: webbed-grove spiders, shade stalkers that trail your torchlight, and the Watcher on the peaks, who freezes in light and only fights once hurt.\n<\/li><li>\nGoblin villages, war camps and churchyards are built places: palisades and stump huts, tents round a spit fire, a ruined chapel among leaning graves. Each is laid out differently, and their walls and fences are solid, so you go in through the gate. Goblin caves hold goblins, with their king in the deepest chamber.\n<\/li><li>\nWeapon arts: once you are skilled enough with a weapon, hold the strike to use its special move, and later press R for a second one. The weapon in hand shows the art charging and how long until it is ready again.\n<\/li><li>\nArmour softens every blow and arrow that lands on you, and the equipment panel says by how much. Copper and bronze armour can be made, and hide armour shows on every body.\n<\/li><li>\nA fight tells you when you step clear of a swing, when a shield catches a blow, and when you miss. Blows flash where they land, a foe's name shows over its head, and when you are struck down the card says who did it.\n<\/li><li>\nBlows thud or cut, shields clack, and missed swings whoosh past.\n<\/li><li>\nYour health bar is now 50 rather than 100, and refills at the same overall pace.\n<\/li><li>\nIn fights between players, skill and the weapon in your hand decide how hard you hit, and bows work against players.\n<\/li><li>\nGloom foes leave mist-dark fur, gems and rune stones.\n<\/li><li>\nAfter a death, you lose warmth more slowly for a short while.\n<\/li><\/ul>\n<p><strong>Building<\/strong><\/p>\n<ul><li>\nPress H on your claim to build a house part by part: floors, walls, doors, windows, roofs and stairs. Climb the stairs to an upper floor; gable pieces close the roof ends.\n<\/li><li>\nBuildings level the ground under them, so you can build on gentle and moderate slopes.\n<\/li><li>\nGrow a lean-to into a hut, and a hut into a house, without tearing it down first. You can sleep in your lean-to on the first night.\n<\/li><li>\nPick up a finished chest, bed, bench, table or shelf and set it down somewhere else.\n<\/li><li>\nStone path pieces that join end to end, and berry bushes and root patches you can plant on your claim.\n<\/li><li>\nYour claim now lasts 14 days while you are away, and logging in keeps it standing. Your home in the wild no longer crumbles if you come back within two weeks.\n<\/li><\/ul>\n<p><strong>Towns<\/strong><\/p>\n<ul><li>\nBuild a town board on your claim to found a town. Small towns have no offices until they have six Members; until then the Mayor runs everything.\n<\/li><li>\nThe Mayor can propose a project, a building on one of the town's squares. Members vote, and finished projects lift the town from Hamlet to Village to Town.\n<\/li><li>\nOfficers and Members can be voted out by the town. A Mayor who stays away for a week loses the seat.\n<\/li><li>\nYou can ask someone to live in your town as a Resident without giving up any of your land.\n<\/li><li>\nWhen a vote closes, the town log shows the count. Who voted for whom stays secret.\n<\/li><\/ul>\n<p><strong>Animals<\/strong><\/p>\n<ul><li>\nGoats live in the world. Tame them by hand-feeding, breed them in a closed pen, and milk them.\n<\/li><li>\nA tame horse or donkey with no stable nearby slowly grows unhappy and in time leaves you. A stable keeps it content.\n<\/li><li>\nSew a saddle bag and fit it on a tame donkey that follows you to carry more.\n<\/li><li>\nCutting up a grown sheep or deer leaves a little bone and sinew, the start of needles, awls and thread.\n<\/li><\/ul>\n<p><strong>Crafting<\/strong><\/p>\n<ul><li>\nSteel axe and pickaxe, a bronze axe, and iron ore, bars and an iron axe with proper models.\n<\/li><li>\nA leather tunic for hunters. Worn hide shows its material trait, such as Supple or Quiet.\n<\/li><\/ul>\n<p><strong>Characters<\/strong><\/p>\n<ul><li>\nYou can play as a turtle, in a tabard and kilt or a riverbank smock, and as a tall dragon, male or female.\n<\/li><\/ul>\n<p><strong>World<\/strong><\/p>\n<ul><li>\nThe open sea rolls with waves, from glassy calm to storm, with whitecaps and foam on the beach. Storms throw spray, and the edge of the world fades into sea mist.\n<\/li><li>\nWoods carry on to the horizon. Where water meets land there are rushes and wet, mossy stones. No two rocky patches or groves look alike.\n<\/li><li>\nThe houses of distant towns show from the hills.\n<\/li><\/ul>\n<p><strong>Sound<\/strong><\/p>\n<ul><li>\nA soft ping when someone talks to you, invites you or asks to trade, and a gentle nudge when hunger, thirst or cold run low. Pick sounds for mining, a crucible stir while smelting, drips after rain, and wind that swells with each gust.\n<\/li><\/ul>\n<p><strong>Playing together<\/strong><\/p>\n<ul><li>\nMute a player from their right-click menu to stop their chat, trade and invitation requests.\n<\/li><\/ul>\n<p><strong>Fixes<\/strong><\/p>\n<ul><li>\nThe camera no longer dips under hills or cliffs.\n<\/li><li>\nMonsters no longer walk into your claim or through your walls.\n<\/li><li>\nYou can no longer work another player's claim without being added to it, and what's inside your chests and jars is hidden from passers-by.\n<\/li><\/ul>\n<h2 data-h=\"19-october\">19 October<\/h2>\n<blockquote><p><strong>WORLD WIPE.<\/strong> A new world: a vast land of eroded mountains, rivers and footpaths up to mountain villages, with your first waking on a sheltered coast. Claims are now squares on a grid. The launcher asks first, and \"Keep my world\" is the safe choice if you are not ready.<\/p><\/blockquote>\n<p><strong>World<\/strong><\/p>\n<ul><li>\nMountains have rocky crags and cliffs, and trails have stone cairns and lookouts. Rivers sound like rivers, and you can hear rapids before you see them.\n<\/li><li>\nGoblin villages, skeleton rings, crypts and war camps stand across the land. Barrows and stone rings with cold hearths dot the high trails.\n<\/li><li>\nDistant land fades into soft haze, bluer the further you look, and in winter the far hills are snowy too.\n<\/li><li>\nShooting stars on clear nights, and dust motes in woodland sunbeams.\n<\/li><\/ul>\n<p><strong>Fighting<\/strong><\/p>\n<ul><li>\nGoblins, gloom creatures and bone rattlers fight back. Watch for the wind-up, step back to dodge, then strike them down. Bows chip at them from afar, though a goblin guard's shield stops most arrows.\n<\/li><li>\nFighting with a spear, axe or knife trains its own skill.\n<\/li><li>\nArmour slots on the equipment panel, and three armour sets in every metal.\n<\/li><\/ul>\n<p><strong>Towns and claims<\/strong><\/p>\n<ul><li>\nYou can hold up to 6 claims, and a refused marker tells you why.\n<\/li><li>\nTowns place their own squares of land, and joining a town gives two of your squares to it.\n<\/li><li>\nThe town board has plaques for members, elections, permissions, the stash, projects and the map.\n<\/li><li>\nElections are a secret ballot, and you can drag names on your ballot to reorder them.\n<\/li><\/ul>\n<p><strong>Characters<\/strong><\/p>\n<ul><li>\nA new race, the Colour-shift chameleon. Dragonlings blink, smile and look sleepy. Tails, ears, caps and hair swing as you move.\n<\/li><li>\nA cloak slot (hood up or down) and a head slot for the knitted wool cap.\n<\/li><\/ul>\n<p><strong>Crafting and survival<\/strong><\/p>\n<ul><li>\nDried meat from the drying rack, light to carry.\n<\/li><li>\nMore stews, and hot dishes take a little chill off.\n<\/li><li>\nA drying shelf where clay dries faster, out of the rain.\n<\/li><li>\nEvery chop at a tree gives a strip of fiber, and a felled tree gives three more.\n<\/li><li>\nSwimming in deep water tires you.\n<\/li><li>\nWith a digging tool in hand, press G on your own land to flatten, raise, lower or smooth the ground.\n<\/li><li>\nA straw bed can go anywhere, but rots away unless it has a roof over it.\n<\/li><\/ul>\n<p><strong>Animals<\/strong><\/p>\n<ul><li>\nWild horses and donkeys to tame, a hitching rail to tie them, and a plank stable for your claim.\n<\/li><\/ul>\n<p><strong>Controls<\/strong><\/p>\n<ul><li>\nA plain drag moves a whole stack. Hold Ctrl to take just one, or Shift to choose how many.\n<\/li><li>\nE uses the thing you are facing, even beside your claim marker or a boat.\n<\/li><li>\nNew tools hang on your tools belt by themselves.\n<\/li><\/ul>\n<p><strong>Look and sound<\/strong><\/p>\n<ul><li>\nFoes growl, hiss, clatter and moan. Weapons swing with their own sounds. Horses clop and donkeys bray.\n<\/li><li>\nStorage pots have a lid with a little knob, and goats look like goats.\n<\/li><\/ul>\n<p><strong>Fixes<\/strong><\/p>\n<ul><li>\nNo more shader errors on AMD graphics cards.\n<\/li><li>\nThe sky no longer goes missing.\n<\/li><\/ul>\n<h2 data-h=\"18-october\">18 October<\/h2>\n<blockquote><p><strong>WORLD WIPE.<\/strong> The land is reshaped with mountains, big hills, caves and a new marsh, so this update needs a fresh world. The launcher asks first, and \"Keep my world\" is the safe choice if you are not ready.<\/p><\/blockquote>\n<p><strong>World<\/strong><\/p>\n<ul><li>\nBig hills everywhere and tall mountains in the highland. Steep slopes slow you down but never stop you.\n<\/li><li>\nCaves are cut into hillsides, with a stone floor and real darkness inside. Bring a torch.\n<\/li><li>\nA marsh near the start, with reeds, peat and gentle mud that slows you a little.\n<\/li><li>\nGrass reaches further out, following your view distance, and lies low around berry and hazel bushes so they stand out.\n<\/li><li>\nFireflies no longer hover over the open sea.\n<\/li><li>\nFar painted mountains on the horizon, clearer far land in fair weather, painted water and clouds, and soft rain that leaves a low mist in the hollows.\n<\/li><li>\nThe ground has new hand-painted textures, and clay looks like clay.\n<\/li><li>\nRain thins away when you stand under a roof.\n<\/li><li>\nA cockle shell on the beach.\n<\/li><li>\nDeep woods have their own forest floor, and fords cross the water instead of running along it.\n<\/li><\/ul>\n<p><strong>Crafting<\/strong><\/p>\n<ul><li>\nBurning-stick torch. Plant a lit one in the ground as a standing light.\n<\/li><li>\nDrying pots show how long is left and what helps while you wait. Under a roof, drying clay ignores the rain, and only its maker can pick it up in the open.\n<\/li><li>\nA small kiln for firing a few pieces at a time.\n<\/li><li>\nThread, cloth and a tunic can be made from plants, no sheep needed.\n<\/li><li>\nClay work has new hand motions, and you lift and look at a fired pot when you pick it up.\n<\/li><\/ul>\n<p><strong>Survival<\/strong><\/p>\n<ul><li>\nIf you die, you keep your belt tools and worn gear. Only your bag drops.\n<\/li><li>\nA shared pot at the hearth: anyone in the owner's group can ladle a bowl.\n<\/li><li>\nA fire beside a lean-to keeps the cold off. The warning for cold says how long is left, and the warmth ring breathes when little warmth remains.\n<\/li><li>\nA fire waits for the person who lit it if they are offline.\n<\/li><li>\nA fire in the open waits for you while you are offline. A cold warning stays until you are warming up.\n<\/li><\/ul>\n<p><strong>Animals<\/strong><\/p>\n<ul><li>\nCarry hens and rabbits whole and cut them up at a fire or table. Pick up live ones too.\n<\/li><li>\nFeed hens, rabbits and sheep by hand to tame them. Tame animals follow you, stay put when told, and take names.\n<\/li><li>\nThe pen: a ring of fence that holds animals. Animal care rank 25 unlocks its gate.\n<\/li><li>\nA tame pair in a closed pen can have young.\n<\/li><li>\nSheep can have young in a pen too.\n<\/li><\/ul>\n<p><strong>Building<\/strong><\/p>\n<ul><li>\nTimber-framed cottage, a step up from clay, with working shutters.\n<\/li><li>\nWalk-in clay hut with a tamped clay floor and windows with board shutters.\n<\/li><li>\nA bracken bed in the lean-to, a taller lean-to, and building sites that tell you how to make what they need.\n<\/li><li>\nHang a door from the right-click menu, and take down a finished build from it too.\n<\/li><li>\nA build's name note says who built it (\"Bench, built by Mara\").\n<\/li><li>\nBeds fit inside a home. A lean-to hints how warm it keeps you, and a panel lists the materials a whole build needs.\n<\/li><\/ul>\n<p><strong>Sailing<\/strong><\/p>\n<ul><li>\nLog raft, and a plank boat with a reed sail. Wind matters, and a boat that is going fast looks it.\n<\/li><li>\nRight-click a boat for its menu. Seamanship shows in the sail, and the map shows the wind.\n<\/li><li>\nBoats make their own sounds on the water.\n<\/li><li>\nThe plank boat's sail lets out square to the wind, and you sit at the helm. The reed sail fills out near top speed.\n<\/li><\/ul>\n<p><strong>Playing together<\/strong><\/p>\n<ul><li>\nShare your home with a friend from the right-click menu on that person.\n<\/li><li>\nYou can also share your home from the Friends window.\n<\/li><li>\nThe town keeps its own claims up from its store.\n<\/li><li>\nRight-click menus on doors, fires, hearths, baskets, chests, jars, kilns, lamps, troughs, drying clay, drying racks, snares, benches and rest spots. They replace the V, Shift+E and Z keys.\n<\/li><li>\nSit and lie down are on the emote wheel now, so H is free.\n<\/li><li>\nThe land window tells you how to let someone in by name, and the town and home-sharing words are plainer.\n<\/li><li>\nA gentle heads-up comes before your claim marker falls.\n<\/li><li>\nThe key list (F1) shows every right-click menu.\n<\/li><li>\nAt rank 50, Potter and Builder choose a focus to specialise in.\n<\/li><li>\nKit and Capling join Pebble and Bramble. All four have smooth bodies, painted heads and more look choices.\n<\/li><\/ul>\n<p><strong>Look and sound<\/strong><\/p>\n<ul><li>\nPines grow needle clumps, giant pines look fuller, and thatch roofs are shaded.\n<\/li><li>\nRooms with a roof are darker and warmer near a fire.\n<\/li><li>\nNew looks for roasted and burnt roots, and for the plank, paddle, mast and rolled reed sail.\n<\/li><li>\nThe wool tunic is remade as a small crumpled T with a soft cord belt.\n<\/li><li>\nTools are carried tilted, with a relaxed swing as you walk.\n<\/li><li>\nNew hand motions for digging with a stick, chipping and scraping stone, and shaping clay with your head and shoulders.\n<\/li><li>\nGorse looks right again, with no floating spikes or yellow beads.\n<\/li><li>\nYour woven back basket shows on your back, and other players see it too.\n<\/li><li>\nDifferent music in each area and at dawn.\n<\/li><\/ul>\n<p><strong>Launcher<\/strong><\/p>\n<ul><li>\nThe game is now called Hearthwood. The launcher reads new builds from its new home.\n<\/li><li>\nThe launcher has a \"Patch notes\" link that opens this page.\n<\/li><\/ul>\n<p><strong>Fixes<\/strong><\/p>\n<ul><li>\nEsc opens the menu again every time.\n<\/li><li>\nSmall text, hotbar keys and crafting counts are easier to read at 1080p. Options has \"Show tips again\", and first hints wait until you are in the world.\n<\/li><li>\nNew emote doodles for Laugh and Come here, and new sounds for kilns, turning pages, pick strikes, fireflies and taking a building down.\n<\/li><li>\nWords for build stages are plainer, and the creator says the race only changes looks.\n<\/li><li>\nA boiled egg can be eaten. Trees fade only when they hide your body.\n<\/li><li>\nThe game and server run lighter: grass detail levels, Medium graphics preset lighter than High.\n<\/li><li>\nFar trees are drawn simpler so the game runs smoother, with no change you can see.\n<\/li><li>\nThe journal has an item book: linked boxes show what goes into what.\n<\/li><li>\nThe item book shows how many of each ingredient you carry, and the journal shows the best quality you have reached.\n<\/li><li>\nThe character creator opens full screen first when you start a new world.\n<\/li><li>\nWalking is smoother for other players, with fewer jumps.\n<\/li><li>\nA one-time tip shows that windows can be dragged by their top edge.\n<\/li><li>\nNo more blue strip along the bottom edge near water. Baskets only send what is near you. A and D no longer walk you while you light a fire.\n<\/li><li>\nLow graphics drops the thick fog, and Medium shadows are lighter.\n<\/li><li>\nThe wiki has a page on your first night.\n<\/li><li>\nSkills have their own page on K. Words across the game are plainer.\n<\/li><\/ul>\n<h2 data-h=\"17-october\">17 October<\/h2>\n<p><strong>World<\/strong><\/p>\n<ul><li>\nBiomes: a rocky highland with flint, slate and copper ore, a marsh with reeds and peat, and a sea coast.\n<\/li><li>\nThe warm, Ghibli-style meadow ground is the default everywhere. Trees and rocks come from the new nature kit, in our colours.\n<\/li><li>\nFallen giant logs, lone flowers, butterflies, pollen, fireflies by the water and dragonflies.\n<\/li><li>\nFelled trees fall away from you, leave a stump and slowly regrow.\n<\/li><li>\nMorning frost, heavy winter snow, a time-of-day arc on the sundial, and 3D water with reflections.\n<\/li><\/ul>\n<p><strong>Crafting<\/strong><\/p>\n<ul><li>\nBows and arrows. Boiled eggs, fletched arrows, a waterskin and a spade that digs faster than a stick.\n<\/li><li>\nMaker's marks: pots and many made things say who made them, and you can pick a mark and decorate with slip.\n<\/li><li>\nClay troughs, roof tiles and a stone-ringed hearth for winter nights.\n<\/li><li>\nA picture menu for crafting and for building.\n<\/li><\/ul>\n<p><strong>Survival<\/strong><\/p>\n<ul><li>\nStamina is checked by the server. Wild roots, hazelnuts and mushrooms to find.\n<\/li><li>\nA signal fire from fiber sends a thick smoke column. Felled trees give sticks and fiber.\n<\/li><li>\nAfter a death you wake in the open, with a faint light pointing back to where you fell.\n<\/li><li>\nLie down on your mat. Rest spots offer to set your waking place.\n<\/li><\/ul>\n<p><strong>Animals<\/strong><\/p>\n<ul><li>\nHens that lay eggs and roost in a coop at night. A wild rabbit and a rabbit snare.\n<\/li><li>\nDeer bed down through the middle of the day. Animals shy away when you splash through water.\n<\/li><\/ul>\n<p><strong>Building<\/strong><\/p>\n<ul><li>\nHomes are 25% bigger, with real doorways. A brick house with a roof of fired clay tiles.\n<\/li><li>\nA wooden chest, a straw bed, later a rabbit fur bed, and a sundial.\n<\/li><li>\nHomes name who built them, and friends who finish one together get a house-warming.\n<\/li><\/ul>\n<p><strong>Playing together<\/strong><\/p>\n<ul><li>\nTowns with signboards, offices, voting, bans and a shared store and upkeep.\n<\/li><li>\nA friends list on O, groups, \"show the way\" to a friend, and a right-click menu on players.\n<\/li><li>\nEmotes on the Q wheel: wave, cheer, dance, bow, clap, shrug and point.\n<\/li><li>\nChoose your name, your race and your look when you start. Several characters per login.\n<\/li><li>\nHold the Use key to repeat an action. Hotbar slots on 1 to 0, and the tool in your hand is ringed.\n<\/li><\/ul>\n<p><strong>Look and sound<\/strong><\/p>\n<ul><li>\nWarm paper windows with a rounded friendly font, bouncy menus and a soft \"Waking up\" veil.\n<\/li><li>\nPainted look for props, houses, pots, animals and trees. Chibi Pebble and Bramble, with blinking and expressions.\n<\/li><li>\nReal recorded music, and many new sounds: chopping, trees falling, doors, hens, kilns, simmering pots and roasting.\n<\/li><\/ul>\n<p><strong>Launcher<\/strong><\/p>\n<ul><li>\nA Player launcher without server parts, a Refresh button, resizable windows, and a \"What's new\" panel.\n<\/li><\/ul>\n<p><strong>Fixes<\/strong><\/p>\n<ul><li>\nF8 sends a bug report that opens an issue by itself. /stuck frees you if you are trapped.\n<\/li><li>\nThe server refuses walking through fences, walls, trunks and boulders.\n<\/li><li>\nLots of smoothing: world building on worker threads, cheaper animals, fewer hitches.\n<\/li><\/ul>\n<h2 data-h=\"16-october\">16 October<\/h2>\n<blockquote><p><strong>WORLD WIPE.<\/strong> The land was reshaped with hills, a winding stream and ponds. This was the first planned wipe.<\/p><\/blockquote>\n<p><strong>World<\/strong><\/p>\n<ul><li>\nHills, a stream you can wade, ponds, groves and glades, heath on hilltops and birch wetland by the water. Landmarks and trails, each one different.\n<\/li><li>\nDay and night with seasons, cold and snow, thunderstorms, starry nights, rainbows and valley mist.\n<\/li><\/ul>\n<p><strong>Crafting<\/strong><\/p>\n<ul><li>\nCrafting stations and the crafting table. Better tools work faster and wear out, and the repair table fixes them.\n<\/li><li>\nCraft times follow your skill, and one shared skill curve is used everywhere. Masters work by heart.\n<\/li><li>\nCooking pot and Potter's bench, storage jar, kiln, clay oil lamp, roof tiles, and batch devices for clay, grit and tempering.\n<\/li><\/ul>\n<p><strong>Survival<\/strong><\/p>\n<ul><li>\nRunning and stamina, breath you can see in the cold, new-arrival warmth, snow that wets you.\n<\/li><li>\nThirst eases in a new character's first hour.\n<\/li><\/ul>\n<p><strong>Animals<\/strong><\/p>\n<ul><li>\nSheep give wool; spin it into yarn and weave cloth. Leather from a drying rack, leather foot wraps and a wool tunic.\n<\/li><li>\nRed deer at the woodland edges, with hunting and sounds. A Stalking skill and sneak-attack hits.\n<\/li><\/ul>\n<p><strong>Building<\/strong><\/p>\n<ul><li>\nStick fence and gate, raised hearth, log cabin, mud-brick house with a hearth, and see-through shelters.\n<\/li><li>\nClaim fences with gates for members only.\n<\/li><\/ul>\n<p><strong>Playing together<\/strong><\/p>\n<ul><li>\nTrading between players. Name your camp. Whisper and shout.\n<\/li><li>\nEquipment panel, bag with drag and drop, and a hotbar. Jump with Space, use things with E.\n<\/li><\/ul>\n<p><strong>Launcher<\/strong><\/p>\n<ul><li>\nA one-button launcher with automatic releases, self-update and server start.\n<\/li><\/ul>\n<h2 data-h=\"15-october\">15 October<\/h2>\n<p><strong>World<\/strong><\/p>\n<ul><li>\nThe first playable world: a forest with a painted, moody look, day and night, weather and a living soundscape.\n<\/li><\/ul>\n<p><strong>Crafting<\/strong><\/p>\n<ul><li>\nTinder, hand-drill fire, bow drill, stone knife, digging stick, baskets, cordage and lashing, chopping with a stone axe.\n<\/li><li>\nClay from the riverbank to a fired pot of water, with a kiln you build together.\n<\/li><\/ul>\n<p><strong>Survival<\/strong><\/p>\n<ul><li>\nHunger, thirst, warmth, getting wet, death and respawn. A carrying limit.\n<\/li><\/ul>\n<p><strong>Animals<\/strong><\/p>\n<ul><li>\nSheep flocks: shear them for wool, hunt them, and get leather.\n<\/li><\/ul>\n<p><strong>Building<\/strong><\/p>\n<ul><li>\nLean-to and clay hut built together in stages, hut doors and storage baskets.\n<\/li><\/ul>\n<p><strong>Playing together<\/strong><\/p>\n<ul><li>\nChat by distance, land claims, PvP rules, and a journal with skills that remembers what you have learned.\n<\/li><\/ul>", "text": "What changed, newest first, one section per day. Plain words, no build numbers. A day marked WORLD WIPE needs a fresh world; the launcher always asks before it wipes yours. 25 October Afternoon and evening Other players and animals press the grass flat as they walk through it, as you do, so busy ways show as trails. Deep inside the groves the ground is an old mossy woods floor. Players whose computers fall back to OpenGL now see the new forest instead of the old painted trees. The far woods leave out trees that were felled, built over or dug away. Early hours and morning Woods grow into larger, joined-up groves and big forests. Trees never sprout through your claim or your buildings. Boulders and old landmarks (huge oaks, fallen giants, standing stones) are back where they were before the bigger forests. Bigger trees give more logs before they fall. Pines give softwood and broadleaf trees give hardwood; both do anywhere a log is needed. Adding materials to a building is a tap of Use (E), and each tap puts in a whole stack. The weather moves with the sea wind, the same wind your sails feel, so clouds, leaves and grass lean the way boats are pushed. Standing on a boat's deck no longer counts as wading, so you don't freeze on deck, and dying aboard wakes you free of the boat. A restored ruin fades after about two weeks, and restoring one teaches your Builder skill a good deal. 24 October Evening Now and then an old ruin turns up in the low country. Restore one into a walled, roofed shelter, and the town board lists the ruins that have turned up, with which way and about how far each lies. Any build of ten or more stones needs a stone-breaking bench on the claim, or on one of your town's claims. Rivers carry ripples, leaves and foam the way the river runs, downstream. A felled tree goes at once and leaves a stump that matches its trunk, and there are no more invisible trunks standing in streams. The new trees no longer come out near-black in the game's light. Afternoon The forest is new: fuller, hand-painted pines and broadleaf trees in three shapes each, with great oaks and tall cedars in open glades. Trees stand further apart and vary more in height and width, so the woods are easier to walk through. Broadleaf trees turn with the seasons and stand bare in winter, with a lighter shade under them; pines stay green. The trees shade the ground under their crowns. Far-off trees sit on the hillsides instead of hovering above them, the far woods look as open as the near ones, the far land wears the near ground's look out to about 2 km, and the seasons carry smoothly from near trees to far ones. The forest no longer stutters the first time you walk into the woods after an install or update, and it runs faster on Low graphics. A big boat frame turns toward the water by itself while you place it, shows where the boat will slide in, and turns red with the reason when it cannot launch from there. It can stand a bit further from the water, and the sailing boat is now a painted wooden sailboat. Land beyond your first claim square costs a small land tax, 40 copper a week for each extra square, paid by itself from your purse. Your first square stays free, and squares signed into a town are not charged. If the tax goes unpaid you are warned a week, three days and a day before the claim falls. A building job's fee at the town board can be paid in coins as well as goods. A stone-breaking bench can be built from the build menu. Walking on a stone path is about a tenth quicker. A path snaps onto a footbridge's end, and paths run right along walls and fences. You can set a building's outline down about 9 steps away instead of 6, and it follows your mouse out that far. With a waterskin in your bag, scooping from a trough fills your pots instead of failing. Cloud edges no longer look grainy or shimmer, and storm foam on the waves looks natural instead of lying in neat rows. Midday Picking a theme in Options, under the new UI section, changes the windows at once, with no restart, and the hotbar and the character cards follow it too. Falling snow is real flakes all round you, with a soft snowy haze in the distance. Webbed groves sit in a cold pale mist, thicker at night. Boat wakes look like broken foam rather than a solid white patch. Draw distance limits how far the trees reach again. On High the single far trees stop at 2 km, as on Medium, with painted woods beyond. From far off, a signal fire's smoke shows roughly where the fire is, not the exact spot. Late morning Tab picks the nearest foe and steps outward, a painted ring marks your target, and small frames above the hotbar show your health and your target's in a fight. The ring is easy to see far off and on a foe in water, and the frame marks bosses and elites. At the sawing table, cut boards into wall and floor panels: a panel goes up in one piece and costs a little less wood than building from loose boards. A chopped tree falls and grows back as the same kind of tree, and the woods mix big and small trees. Small waves roll in and break in foam along the beaches. A sneak-attack hit on an animal shows a small amber \"!\" over it. The Mending skill now rises slowly, at the same pace as fighting. Morning Building a house part by part (H) needs a sawing table on your claim, or on one of your town's claims. Build one from the build menu first. Houses already standing are untouched. Inside a house built part by part, the roof and the floors above you fade away so you can see yourself, as in the huts. The crypt's boss can drop the warden's cuirass, a rare piece of heavy armour no smith can copy. Options has a Theme row: Light crème, Dark walnut, or the new Fern and moss. Options, Graphics has a Vsync switch; Off lets the frame rate run past your screen's refresh rate. On Medium and High the ground's colour, trails and wet patches reach much further out. A couple of very gently shelving beaches now have a gully deep enough to launch a sailing boat. You see the town name of a player near you again. The sea's whitecaps and foam show again, and a calm sea no longer shows a criss-cross pattern out to the horizon. Pale characters keep their colour in sunlight, and very long messages above the hotbar are shortened so they stay on screen. Early hours The camera turns like an MMO camera: look straight up at the sky or down at your feet, zoom right in to just behind your eyes, and it slides in along the ground or a house wall instead of going through it. Invert mouse and the old camera are on the Controls page. The bag window is now a character sheet: your own figure, live and in your gear, with Gear and Body tabs. Notice boards post small jobs that pay copper coins, and your character sheet shows your purse. The first board stands in the starting clearing. Every item and building says what it is when you hover over it, the trade window's items have tooltips too, and the build menu shows a building's name first. Eating or drinking makes stamina refill twice as fast for about ten minutes. A bronze pickaxe sits between the stone pick and steel. Named goblins taunt you by private message and shout in chat when you're near their camp. Options can mute them. A dead animal lying on someone's claim can only be butchered or carried off by the claim's owner and members. Only a boat's owner and their claim members can use its hold, aboard or from the shore. A building job taken at a town board teaches you a little more than building the same thing for yourself. The Field Guide has an Items page, in the game's own words. Look and sound A new tree renderer: fuller pines and broadleaves out to the horizon, with crowns carried high on bare trunks you can see between. The old trees are one setting away. Grass carries on much further toward the horizon, and fields look fuller. Storms at sea raise much bigger swells, and a storm sea looks rough and broken instead of glossy. Medium graphics draws the clouds more cheaply, for a smoother frame rate; they look a touch lighter and softer. 23 October Late evening The clay mixing trough is now the kneading trough. A downed monster disappears after about a minute, and a new one takes its place. To dig up roots, take your digging stick in hand (its number key). A big boat frame that cannot launch into water says so instead of taking your materials. In house build mode, the note tells you how many boards or sticks you still need, and when a house is nearly full. Resting your view on something with a menu shows its name and \"Right-click for more\" again. The Drink prompt shows at the water even when you are not thirsty. You see a player's town and offices only when they are in your own town. A claim member's hut on a town claim stays unless the claim's owner or the builder takes it down. A dry roof tile or clay trough says \"Pick up the roof tile\" instead of \"Pick up the jar\". Sunrise and sunset are no longer brighter than midday; the morning light builds gently as the sun climbs. Boat wakes are a clear white foam trail behind the stern. The sea no longer shows dark blotches near the coast, pale lines in the shallows or a crosshatch in the sun's sparkle. At the farthest Full detail settings, ground that has loaded stays loaded when you turn round. Evening Real 3D clouds on Medium and High graphics: they drift, shade the ground and build into storms. Low keeps the lighter clouds. Options can switch either way. Forests past 2 km are painted onto the land instead of drawn tree by tree, so the default view runs much faster, and distant trees on ridges no longer hover. The sea runs smoothly to the horizon. Waves roll on all the open sea round the home continent, while inland lakes stay still. Storm spray is soft mist, ships throw spray when they slam into a wave, and wakes no longer echo far across the water. On a boat, K, X, R and F work only the boat (who may board, anchor, sail in and out). They show on the F1 list and can be changed on the Controls page. Pressing H to build a house shows a note with what each part costs, what you carry and how far along the house is. Monsters far from any player keep their wounds until you come back. Dying wears your worn gear a little. Hotbar items show their pictures again, and the new-arrival badge beside the warmth ring is easy to see. The dig hint names the reddish-brown clay. Skills The Smith, Leatherwork and Weaver skills each have focuses to choose from. Look and sound New clouds: soft, rounded heaps that drift with the wind and follow the weather, with thin high streaks above them. At night the Milky Way turns overhead and the moon shows its real face. The sun reddens as it sets, and the day sky is a deeper blue. New grass everywhere. The old tufts can still be switched on. A new colour for the open sea. Tree shadows and far trees no longer pop or blink as you move through the woods or fly over them. Options has a Credits button. Playing together Inspect another player to read a note with their five best skills. Settings Full detail in Options, Graphics now reaches 256 m and 512 m, with longer test steps beyond. At the far steps the land you are looking toward is built first, so it loads faster and uses less memory. Fixes Scraping a hide, drying meat, making a spindle and other station work no longer stop on their own while the station's window is open. Build costs are easy to read on the dark windows, with missing materials shown in rust. Trade items show their pictures clearly, and the friends list headings stand apart from the names. The keys and wear windows fit a 720p screen, and minigame hints are easier to read. If the game cannot reach the world it says so plainly, and the death card stays up long enough to read. A note can no longer be read through a hut wall, and watching or teaching someone stops at walls. 22 October Controls The mouse now turns the view without holding a button. Press V to get the cursor back, then right-click a person or thing for its menu. Prefer the old way? Switch Camera to classic on the Controls page. See Keys and controls. The first tips teach V before right-clicking, and hints sit on a small paper note. Fishing Make a fishing line from cord, a stick and a stone flake. Cast into ponds, streams or the sea, strike as the float dips, and reel bigger fish in. Worms and cut bait bring bites sooner. Each fish bites by water, time of day and season, and comes in three colourings to collect. Out at sea, shoals of leaping fish drift along the coast, and a golden sunscale hides somewhere. Every fish has a weight. The journal's Fish page keeps your biggest of each kind and a box for each colouring. A skilled angler lands rare colourings more often. You hear the cast, the bite and the reel, and other players' fishing too. Journal An Almanac: meet animals, fell foes, reach places and gather plants to fill its chapters and earn titles. The journal leads on past the first week, toward your first trade and a town of your own. When you log back in, a page tells you who used your stash, what your town did and who learned from you while you were away. Deep recipes show in the Items book. Skills Working beside someone far better at the same skill teaches you faster, and teachers earn a title for their pupils. Raising a house's floors, walls and roof trains Builder. The Skills page says what each skill opens next. Very fine work carries its maker's name. Towns and building At a town board, post one of your building sites with a fee, and someone else can build it for you. Or take a job there, build it on their land, and the fee is yours when it stands. Hover any build in the build menu to read what it takes. The repair table's menu mends your tools. A campfire holds more fuel before it needs feeding. Sailing A helm wheel on the sailing boat, a sail to trim and an anchor to drop. Crew take jobs by seat, and the sailing line says who has which. The lookout seat names the nearest land and boat. The owner chooses who may board. Storm seas push a boat along or hold it back, and ships lean outward in a turn. A wake behind moving boats and a splash at the paddle. Out on open water you hear the sea, from a calm swell to a storm, and aboard a boat the hull slaps and spray hisses in rough water. World Rivers are wide, deep and have water in them; before, they were dry mossy channels. Big rivers can be sailed. Cave rooms hold loot, and each boss guards a hoard. Characters and foes A new character picks where to wake on a painted map of the land. New, smoother movement for dragons, turtles and mushroom folk: running, jumping, swimming, working, fighting and sneaking. Goblins crouch, scurry and swing with real weight. The Watcher raises its long arm for a slow heavy swing, the Shade stalker creeps and rakes, and the gloom warden glides with its lantern swinging. Settings and speed Windows look like torn crème parchment, and Options has a walnut-and-brass dark mode. With Draw distance on Everything the game runs much lighter, and distant land keeps the near ground's colours. Walking no longer stutters every few steps near lamps, and busy places with many players and animals feel smoother. Fixes You can change your name once a minute. A name someone already has is refused without using up the wait. A worked-out vein goes dark all at once. 21 October Characters Turtles have new bodies, with a build choice and blinking eyes. Dragons and mushroom folk blink and glance about. Two new emotes: laugh and come here. Characters now hold out a hand to feed animals, sew leather, work the dye pot, knead dough, and carry a pot in both hands. Standing still, they shift their weight now and then. Horses and donkeys move like animals, and a rider sits properly in the saddle. Pale skin, cloth and scales keep their colour in bright midday sun. Crafting and survival A clay cup, pinched, dried and fired, to drink from. A warmer wool tunic. Eating three different cooked foods close together slows your hunger for a while. Fighting Weapon arts step and dip on every body. Claims You are told how to keep your land, and told if it went back to the wild while you were away. The land window says how big your claim is and what it protects, and a friend you let into your home sees what they may do there. Trades hand over the exact tool you were shown, show how worn it is, and tell you what you got. You can leave up to 100 of your own things on one patch of ground. Past that, pick some up or use a basket. Sailing Boats ride the waves. Rough seas slow them and push them gently sideways. Settings and speed Options, Graphics has a Draw distance slider (Near, 1 km, 2 km, 4 km, Everything). View distance is now called Full detail. Longer, sharper shadows on High, shadows that look the same everywhere in the world, and character shadows that cost far less. Lamps and fires in a distant town glow where they really are. 20 October Fighting Foes have new storybook models. Bone rattlers come in three kinds: armoured ones at the stone rings, barrow-grown ones in barrows, and lantern ghosts in the churchyard crypts. Three new foes: webbed-grove spiders, shade stalkers that trail your torchlight, and the Watcher on the peaks, who freezes in light and only fights once hurt. Goblin villages, war camps and churchyards are built places: palisades and stump huts, tents round a spit fire, a ruined chapel among leaning graves. Each is laid out differently, and their walls and fences are solid, so you go in through the gate. Goblin caves hold goblins, with their king in the deepest chamber. Weapon arts: once you are skilled enough with a weapon, hold the strike to use its special move, and later press R for a second one. The weapon in hand shows the art charging and how long until it is ready again. Armour softens every blow and arrow that lands on you, and the equipment panel says by how much. Copper and bronze armour can be made, and hide armour shows on every body. A fight tells you when you step clear of a swing, when a shield catches a blow, and when you miss. Blows flash where they land, a foe's name shows over its head, and when you are struck down the card says who did it. Blows thud or cut, shields clack, and missed swings whoosh past. Your health bar is now 50 rather than 100, and refills at the same overall pace. In fights between players, skill and the weapon in your hand decide how hard you hit, and bows work against players. Gloom foes leave mist-dark fur, gems and rune stones. After a death, you lose warmth more slowly for a short while. Building Press H on your claim to build a house part by part: floors, walls, doors, windows, roofs and stairs. Climb the stairs to an upper floor; gable pieces close the roof ends. Buildings level the ground under them, so you can build on gentle and moderate slopes. Grow a lean-to into a hut, and a hut into a house, without tearing it down first. You can sleep in your lean-to on the first night. Pick up a finished chest, bed, bench, table or shelf and set it down somewhere else. Stone path pieces that join end to end, and berry bushes and root patches you can plant on your claim. Your claim now lasts 14 days while you are away, and logging in keeps it standing. Your home in the wild no longer crumbles if you come back within two weeks. Towns Build a town board on your claim to found a town. Small towns have no offices until they have six Members; until then the Mayor runs everything. The Mayor can propose a project, a building on one of the town's squares. Members vote, and finished projects lift the town from Hamlet to Village to Town. Officers and Members can be voted out by the town. A Mayor who stays away for a week loses the seat. You can ask someone to live in your town as a Resident without giving up any of your land. When a vote closes, the town log shows the count. Who voted for whom stays secret. Animals Goats live in the world. Tame them by hand-feeding, breed them in a closed pen, and milk them. A tame horse or donkey with no stable nearby slowly grows unhappy and in time leaves you. A stable keeps it content. Sew a saddle bag and fit it on a tame donkey that follows you to carry more. Cutting up a grown sheep or deer leaves a little bone and sinew, the start of needles, awls and thread. Crafting Steel axe and pickaxe, a bronze axe, and iron ore, bars and an iron axe with proper models. A leather tunic for hunters. Worn hide shows its material trait, such as Supple or Quiet. Characters You can play as a turtle, in a tabard and kilt or a riverbank smock, and as a tall dragon, male or female. World The open sea rolls with waves, from glassy calm to storm, with whitecaps and foam on the beach. Storms throw spray, and the edge of the world fades into sea mist. Woods carry on to the horizon. Where water meets land there are rushes and wet, mossy stones. No two rocky patches or groves look alike. The houses of distant towns show from the hills. Sound A soft ping when someone talks to you, invites you or asks to trade, and a gentle nudge when hunger, thirst or cold run low. Pick sounds for mining, a crucible stir while smelting, drips after rain, and wind that swells with each gust. Playing together Mute a player from their right-click menu to stop their chat, trade and invitation requests. Fixes The camera no longer dips under hills or cliffs. Monsters no longer walk into your claim or through your walls. You can no longer work another player's claim without being added to it, and what's inside your chests and jars is hidden from passers-by. 19 October WORLD WIPE. A new world: a vast land of eroded mountains, rivers and footpaths up to mountain villages, with your first waking on a sheltered coast. Claims are now squares on a grid. The launcher asks first, and \"Keep my world\" is the safe choice if you are not ready. World Mountains have rocky crags and cliffs, and trails have stone cairns and lookouts. Rivers sound like rivers, and you can hear rapids before you see them. Goblin villages, skeleton rings, crypts and war camps stand across the land. Barrows and stone rings with cold hearths dot the high trails. Distant land fades into soft haze, bluer the further you look, and in winter the far hills are snowy too. Shooting stars on clear nights, and dust motes in woodland sunbeams. Fighting Goblins, gloom creatures and bone rattlers fight back. Watch for the wind-up, step back to dodge, then strike them down. Bows chip at them from afar, though a goblin guard's shield stops most arrows. Fighting with a spear, axe or knife trains its own skill. Armour slots on the equipment panel, and three armour sets in every metal. Towns and claims You can hold up to 6 claims, and a refused marker tells you why. Towns place their own squares of land, and joining a town gives two of your squares to it. The town board has plaques for members, elections, permissions, the stash, projects and the map. Elections are a secret ballot, and you can drag names on your ballot to reorder them. Characters A new race, the Colour-shift chameleon. Dragonlings blink, smile and look sleepy. Tails, ears, caps and hair swing as you move. A cloak slot (hood up or down) and a head slot for the knitted wool cap. Crafting and survival Dried meat from the drying rack, light to carry. More stews, and hot dishes take a little chill off. A drying shelf where clay dries faster, out of the rain. Every chop at a tree gives a strip of fiber, and a felled tree gives three more. Swimming in deep water tires you. With a digging tool in hand, press G on your own land to flatten, raise, lower or smooth the ground. A straw bed can go anywhere, but rots away unless it has a roof over it. Animals Wild horses and donkeys to tame, a hitching rail to tie them, and a plank stable for your claim. Controls A plain drag moves a whole stack. Hold Ctrl to take just one, or Shift to choose how many. E uses the thing you are facing, even beside your claim marker or a boat. New tools hang on your tools belt by themselves. Look and sound Foes growl, hiss, clatter and moan. Weapons swing with their own sounds. Horses clop and donkeys bray. Storage pots have a lid with a little knob, and goats look like goats. Fixes No more shader errors on AMD graphics cards. The sky no longer goes missing. 18 October WORLD WIPE. The land is reshaped with mountains, big hills, caves and a new marsh, so this update needs a fresh world. The launcher asks first, and \"Keep my world\" is the safe choice if you are not ready. World Big hills everywhere and tall mountains in the highland. Steep slopes slow you down but never stop you. Caves are cut into hillsides, with a stone floor and real darkness inside. Bring a torch. A marsh near the start, with reeds, peat and gentle mud that slows you a little. Grass reaches further out, following your view distance, and lies low around berry and hazel bushes so they stand out. Fireflies no longer hover over the open sea. Far painted mountains on the horizon, clearer far land in fair weather, painted water and clouds, and soft rain that leaves a low mist in the hollows. The ground has new hand-painted textures, and clay looks like clay. Rain thins away when you stand under a roof. A cockle shell on the beach. Deep woods have their own forest floor, and fords cross the water instead of running along it. Crafting Burning-stick torch. Plant a lit one in the ground as a standing light. Drying pots show how long is left and what helps while you wait. Under a roof, drying clay ignores the rain, and only its maker can pick it up in the open. A small kiln for firing a few pieces at a time. Thread, cloth and a tunic can be made from plants, no sheep needed. Clay work has new hand motions, and you lift and look at a fired pot when you pick it up. Survival If you die, you keep your belt tools and worn gear. Only your bag drops. A shared pot at the hearth: anyone in the owner's group can ladle a bowl. A fire beside a lean-to keeps the cold off. The warning for cold says how long is left, and the warmth ring breathes when little warmth remains. A fire waits for the person who lit it if they are offline. A fire in the open waits for you while you are offline. A cold warning stays until you are warming up. Animals Carry hens and rabbits whole and cut them up at a fire or table. Pick up live ones too. Feed hens, rabbits and sheep by hand to tame them. Tame animals follow you, stay put when told, and take names. The pen: a ring of fence that holds animals. Animal care rank 25 unlocks its gate. A tame pair in a closed pen can have young. Sheep can have young in a pen too. Building Timber-framed cottage, a step up from clay, with working shutters. Walk-in clay hut with a tamped clay floor and windows with board shutters. A bracken bed in the lean-to, a taller lean-to, and building sites that tell you how to make what they need. Hang a door from the right-click menu, and take down a finished build from it too. A build's name note says who built it (\"Bench, built by Mara\"). Beds fit inside a home. A lean-to hints how warm it keeps you, and a panel lists the materials a whole build needs. Sailing Log raft, and a plank boat with a reed sail. Wind matters, and a boat that is going fast looks it. Right-click a boat for its menu. Seamanship shows in the sail, and the map shows the wind. Boats make their own sounds on the water. The plank boat's sail lets out square to the wind, and you sit at the helm. The reed sail fills out near top speed. Playing together Share your home with a friend from the right-click menu on that person. You can also share your home from the Friends window. The town keeps its own claims up from its store. Right-click menus on doors, fires, hearths, baskets, chests, jars, kilns, lamps, troughs, drying clay, drying racks, snares, benches and rest spots. They replace the V, Shift+E and Z keys. Sit and lie down are on the emote wheel now, so H is free. The land window tells you how to let someone in by name, and the town and home-sharing words are plainer. A gentle heads-up comes before your claim marker falls. The key list (F1) shows every right-click menu. At rank 50, Potter and Builder choose a focus to specialise in. Kit and Capling join Pebble and Bramble. All four have smooth bodies, painted heads and more look choices. Look and sound Pines grow needle clumps, giant pines look fuller, and thatch roofs are shaded. Rooms with a roof are darker and warmer near a fire. New looks for roasted and burnt roots, and for the plank, paddle, mast and rolled reed sail. The wool tunic is remade as a small crumpled T with a soft cord belt. Tools are carried tilted, with a relaxed swing as you walk. New hand motions for digging with a stick, chipping and scraping stone, and shaping clay with your head and shoulders. Gorse looks right again, with no floating spikes or yellow beads. Your woven back basket shows on your back, and other players see it too. Different music in each area and at dawn. Launcher The game is now called Hearthwood. The launcher reads new builds from its new home. The launcher has a \"Patch notes\" link that opens this page. Fixes Esc opens the menu again every time. Small text, hotbar keys and crafting counts are easier to read at 1080p. Options has \"Show tips again\", and first hints wait until you are in the world. New emote doodles for Laugh and Come here, and new sounds for kilns, turning pages, pick strikes, fireflies and taking a building down. Words for build stages are plainer, and the creator says the race only changes looks. A boiled egg can be eaten. Trees fade only when they hide your body. The game and server run lighter: grass detail levels, Medium graphics preset lighter than High. Far trees are drawn simpler so the game runs smoother, with no change you can see. The journal has an item book: linked boxes show what goes into what. The item book shows how many of each ingredient you carry, and the journal shows the best quality you have reached. The character creator opens full screen first when you start a new world. Walking is smoother for other players, with fewer jumps. A one-time tip shows that windows can be dragged by their top edge. No more blue strip along the bottom edge near water. Baskets only send what is near you. A and D no longer walk you while you light a fire. Low graphics drops the thick fog, and Medium shadows are lighter. The wiki has a page on your first night. Skills have their own page on K. Words across the game are plainer. 17 October World Biomes: a rocky highland with flint, slate and copper ore, a marsh with reeds and peat, and a sea coast. The warm, Ghibli-style meadow ground is the default everywhere. Trees and rocks come from the new nature kit, in our colours. Fallen giant logs, lone flowers, butterflies, pollen, fireflies by the water and dragonflies. Felled trees fall away from you, leave a stump and slowly regrow. Morning frost, heavy winter snow, a time-of-day arc on the sundial, and 3D water with reflections. Crafting Bows and arrows. Boiled eggs, fletched arrows, a waterskin and a spade that digs faster than a stick. Maker's marks: pots and many made things say who made them, and you can pick a mark and decorate with slip. Clay troughs, roof tiles and a stone-ringed hearth for winter nights. A picture menu for crafting and for building. Survival Stamina is checked by the server. Wild roots, hazelnuts and mushrooms to find. A signal fire from fiber sends a thick smoke column. Felled trees give sticks and fiber. After a death you wake in the open, with a faint light pointing back to where you fell. Lie down on your mat. Rest spots offer to set your waking place. Animals Hens that lay eggs and roost in a coop at night. A wild rabbit and a rabbit snare. Deer bed down through the middle of the day. Animals shy away when you splash through water. Building Homes are 25% bigger, with real doorways. A brick house with a roof of fired clay tiles. A wooden chest, a straw bed, later a rabbit fur bed, and a sundial. Homes name who built them, and friends who finish one together get a house-warming. Playing together Towns with signboards, offices, voting, bans and a shared store and upkeep. A friends list on O, groups, \"show the way\" to a friend, and a right-click menu on players. Emotes on the Q wheel: wave, cheer, dance, bow, clap, shrug and point. Choose your name, your race and your look when you start. Several characters per login. Hold the Use key to repeat an action. Hotbar slots on 1 to 0, and the tool in your hand is ringed. Look and sound Warm paper windows with a rounded friendly font, bouncy menus and a soft \"Waking up\" veil. Painted look for props, houses, pots, animals and trees. Chibi Pebble and Bramble, with blinking and expressions. Real recorded music, and many new sounds: chopping, trees falling, doors, hens, kilns, simmering pots and roasting. Launcher A Player launcher without server parts, a Refresh button, resizable windows, and a \"What's new\" panel. Fixes F8 sends a bug report that opens an issue by itself. /stuck frees you if you are trapped. The server refuses walking through fences, walls, trunks and boulders. Lots of smoothing: world building on worker threads, cheaper animals, fewer hitches. 16 October WORLD WIPE. The land was reshaped with hills, a winding stream and ponds. This was the first planned wipe. World Hills, a stream you can wade, ponds, groves and glades, heath on hilltops and birch wetland by the water. Landmarks and trails, each one different. Day and night with seasons, cold and snow, thunderstorms, starry nights, rainbows and valley mist. Crafting Crafting stations and the crafting table. Better tools work faster and wear out, and the repair table fixes them. Craft times follow your skill, and one shared skill curve is used everywhere. Masters work by heart. Cooking pot and Potter's bench, storage jar, kiln, clay oil lamp, roof tiles, and batch devices for clay, grit and tempering. Survival Running and stamina, breath you can see in the cold, new-arrival warmth, snow that wets you. Thirst eases in a new character's first hour. Animals Sheep give wool; spin it into yarn and weave cloth. Leather from a drying rack, leather foot wraps and a wool tunic. Red deer at the woodland edges, with hunting and sounds. A Stalking skill and sneak-attack hits. Building Stick fence and gate, raised hearth, log cabin, mud-brick house with a hearth, and see-through shelters. Claim fences with gates for members only. Playing together Trading between players. Name your camp. Whisper and shout. Equipment panel, bag with drag and drop, and a hotbar. Jump with Space, use things with E. Launcher A one-button launcher with automatic releases, self-update and server start. 15 October World The first playable world: a forest with a painted, moody look, day and night, weather and a living soundscape. Crafting Tinder, hand-drill fire, bow drill, stone knife, digging stick, baskets, cordage and lashing, chopping with a stone axe. Clay from the riverbank to a fired pot of water, with a kiln you build together. Survival Hunger, thirst, warmth, getting wet, death and respawn. A carrying limit. Animals Sheep flocks: shear them for wool, hunt them, and get leather. Building Lean-to and clay hut built together in stages, hut doors and storage baskets. Playing together Chat by distance, land claims, PvP rules, and a journal with skills that remembers what you have learned."}]</script>
<script>
(function(){
  var pages = JSON.parse(document.getElementById('pages').textContent);
  var bySlug = {}; pages.forEach(function(p,i){ p.i = i; bySlug[p.slug] = p; });
  var nav = document.getElementById('nav'), main = document.getElementById('main'), q = document.getElementById('q'), count = document.getElementById('count');
  var kind = document.querySelector('.wrap').dataset.kind;
  var REPO = 'https://github.com/Indenex-Studio/Hearthwood/blob/main/';
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // Contents rail, one collapsible group per section.
  var groups = [];
  pages.forEach(function(p){ var g = groups.find(function(x){ return x.name === p.group; }); if(!g){ g = {name:p.group, items:[]}; groups.push(g); } g.items.push(p); });
  nav.innerHTML = groups.map(function(g, gi){
    return '<details' + (gi < 3 || g.items.length < 12 ? ' open' : '') + '><summary><span>' + esc(g.name) + '</span><span class="c">' + g.items.length + '</span></summary><ol>' +
      g.items.map(function(p){ return '<li><a href="#' + p.slug + '" data-s="' + p.slug + '">' + esc(p.title) + '</a></li>'; }).join('') + '</ol></details>';
  }).join('');

  function show(slug){
    var p = bySlug[slug] || pages[0];
    var prev = pages[p.i - 1], next = pages[p.i + 1];
    var src = p.path ? '<a href="' + REPO + esc(p.path) + '" target="_blank" rel="noopener">' + esc(p.path) + '</a>' : '';
    main.innerHTML = '<article><p class="eyebrow"><span>' + esc(p.group) + '</span>' + src + '</p><h2 class="pt">' + esc(p.title) + '</h2>' + p.html +
      '<div class="pager">' + (prev ? '<a href="#' + prev.slug + '"><small>Previous</small><span>' + esc(prev.title) + '</span></a>' : '') +
      (next ? '<a class="next" href="#' + next.slug + '"><small>Next</small><span>' + esc(next.title) + '</span></a>' : '') + '</div></article>' +
      (kind === 'player' ? '<p class="foot">The game is in active development. If this guide and the game disagree, the game is correct.</p>' : '<p class="foot">Built from the repo. To change a page, edit its file in a PR; the wiki is rebuilt after merges.</p>');
    nav.querySelectorAll('a').forEach(function(a){ if(a.dataset.s === p.slug){ a.setAttribute('aria-current','page'); var d = a.closest('details'); if(d) d.open = true; } else a.removeAttribute('aria-current'); });
    document.title = p.i === 0 ? 'Hearthwood Field Guide' : p.title + ' · Hearthwood Field Guide';
  }

  function search(term){
    term = term.trim().toLowerCase();
    if(!term){ count.textContent = ''; show(location.hash.slice(1)); return; }
    var words = term.split(/\s+/);
    var hits = pages.map(function(p){
      var t = p.title.toLowerCase(), x = p.text.toLowerCase(), score = 0;
      for(var k = 0; k < words.length; k++){ var w = words[k]; if(t.indexOf(w) >= 0) score += 10; else if(x.indexOf(w) >= 0) score += 1; else return null; }
      return {p:p, score:score};
    }).filter(Boolean).sort(function(a,b){ return b.score - a.score || a.p.i - b.p.i; }).slice(0, 60);
    count.textContent = hits.length + (hits.length === 1 ? ' page' : ' pages');
    var re = new RegExp('(' + words.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|') + ')', 'ig');
    main.innerHTML = hits.length ? '<ul class="results">' + hits.map(function(h){
      var x = h.p.text, at = x.toLowerCase().indexOf(words[0]), from = Math.max(0, at - 80);
      var snip = at < 0 ? x.slice(0, 180) : (from ? '… ' : '') + x.slice(from, from + 220) + ' …';
      return '<li><a href="#' + h.p.slug + '">' + esc(h.p.title) + '</a><span class="g">' + esc(h.p.group) + '</span><p>' + esc(snip).replace(re, '<mark>$1</mark>') + '</p></li>';
    }).join('') + '</ul>' : '<p class="empty">Nothing matches “' + esc(term) + '”. Try a shorter word.</p>';
  }

  q.addEventListener('input', function(){ search(q.value); });
  main.addEventListener('click', function(e){ var a = e.target.closest('a[href^="#"]'); if(a && q.value){ q.value = ''; count.textContent = ''; } });
  window.addEventListener('hashchange', function(){ if(!q.value) { show(location.hash.slice(1)); window.scrollTo(0, 0); } else { q.value=''; search(''); } nav.classList.remove('open'); });
  var t = document.getElementById('toggle');
  t.addEventListener('click', function(){ var o = nav.classList.toggle('open'); t.setAttribute('aria-expanded', o); });
  show(location.hash.slice(1));
})();
</script>

</html>
