are pinched and bigger ones coiled; the same bench also shapes lamps (see <a href=\"#light-and-lamps\">Light and lamps<\/a>), roof tiles, troughs and storage jars. Bricks and clay plaster need no bench.\n<\/li><li>\n<strong>Dry it.<\/strong> Wet clay cannot be fired safely. Drying is slower in rain and faster beside a burning fire. A roof keeps the rain off a drying pot, and a drying shelf (see <a href=\"#building-and-claims\">Building and claims<\/a>) does both: clay dries faster on it and stays out of the rain.\n<\/li><li>\n<strong>Fire it.<\/strong> Fire turns dry clay into pottery. Set a few dry pieces beside a burning fire and fire them where they stand, and keep the fire fed until they are done. A pot fired before it is dry will crack. Cracked pieces are not wasted: they become broken pottery, which can be crushed and worked into later clay.\n<\/li><li>\n<strong>Fill it.<\/strong> Stand at the water's edge to fill a fired pot.\n<\/li><\/ul>\n<h2 data-h=\"later\">Later<\/h2>\n<p>Bricks and clay plaster are needed for kilns and stronger buildings. A small kiln takes two bricks and fires a few pots more safely than an open fire. A full kiln fires several pots at once and gives better results. Large pieces such as the storage jar, roof tiles and clay troughs can only be fired in a full kiln. The journal's \"road to a place of your own\" lists the steps.<\/p>\n<h2 data-h=\"your-maker-s-mark\">Your maker's mark<\/h2>\n<p>Every potter can choose a small personal mark, a simple line stamp in a colour of their choice, and the pots, jars, lamps and troughs they shape carry it. The first time you start shaping a pot with no mark chosen, the mark picker opens. You can change it later from the options menu (Your mark) or from the Use prompt at a potter's bench. Pots you already made follow the change. Anyone who looks at one of your pots, in a bag or on the ground, can see who made it, so a well-made pot is a small way of signing your work.<\/p>\n<p>Next: <a href=\"#building-and-claims\">Building and claims<\/a><\/p>", "text": "A fired clay pot is the first major goal. Pots carry water and lead into cooking, storage and better buildings. Steps Find clay. Clay is underground; dig for it (F), or right-click clay ground and choose dig. Deeper clay is better. Digging with a tool lets you reach deeper than bare hands. Prepare it. Clean out the stones and roots, then work crushed stone or crushed broken pottery into the clay. Clay with nothing worked into it cracks in the fire. Shape it. Shaping is done at a Potter's bench inside a claim, and it is a minigame. A good wall gives a better pot. Small pots are pinched and bigger ones coiled; the same bench also shapes lamps (see Light and lamps ), roof tiles, troughs and storage jars. Bricks and clay plaster need no bench. Dry it. Wet clay cannot be fired safely. Drying is slower in rain and faster beside a burning fire. A roof keeps the rain off a drying pot, and a drying shelf (see Building and claims ) does both: clay dries faster on it and stays out of the rain. Fire it. Fire turns dry clay into pottery. Set a few dry pieces beside a burning fire and fire them where they stand, and keep the fire fed until they are done. A pot fired before it is dry will crack. Cracked pieces are not wasted: they become broken pottery, which can be crushed and worked into later clay. Fill it. Stand at the water's edge to fill a fired pot. Later Bricks and clay plaster are needed for kilns and stronger buildings. A small kiln takes two bricks and fires a few pots more safely than an open fire. A full kiln fires several pots at once and gives better results. Large pieces such as the storage jar, roof tiles and clay troughs can only be fired in a full kiln. The journal's \"road to a place of your own\" lists the steps. Your maker's mark Every potter can choose a small personal mark, a simple line stamp in a colour of their choice, and the pots, jars, lamps and troughs they shape carry it. The first time you start shaping a pot with no mark chosen, the mark picker opens. You can change it later from the options menu (Your mark) or from the Use prompt at a potter's bench. Pots you already made follow the change. Anyone who looks at one of your pots, in a bag or on the ground, can see who made it, so a well-made pot is a small way of signing your work. Next: Building and claims"}, {"slug": "working-wood", "group": "Making things", "title": "Working wood", "path": "", "html": "<p>Wood is the first thing most builds ask for. Anything with a heavy edge, such as a stone axe, will cut it.<\/p>\n<p>The woods grow in joined-up groves and big forests of pines and broadleaf trees, with great oaks and tall cedars in open glades and an old mossy floor deep inside. Broadleaf trees turn with the seasons and stand bare in winter; pines stay green. Trees never grow through a claim or a building.<\/p>\n<h2 data-h=\"chopping\">Chopping<\/h2>\n<p>Walk to a standing tree with an axe in your hand and chop it (right-click the tree to see the chop line). Each chop gives a log: softwood from a pine, hardwood from a broadleaf tree. A tree comes down after a few logs, two from a small one and up to four from a big one, and a felled tree leaves a stump that rots away; a sapling of the same kind then grows in its place and in time becomes a tree again. A better-made axe works a little faster.<\/p>\n<p>Felling a tree also gives a few sticks and some fiber, so a tree is worth more than its logs.<\/p>\n<h2 data-h=\"what-a-log-becomes\">What a log becomes<\/h2>\n<p>Softwood and hardwood both do anywhere a log is asked for. A log is useful as it is: it burns slowly, and you can set one down on the ground like any other placeable thing. With an axe you can work it further from the crafting panel (C):<\/p>\n<ul><li>\n<strong>Planks<\/strong>: split a log and you get a pair of planks. Planks are for the plank boat (see <a href=\"#boats\">Boats<\/a>); they burn faster than a log.\n<\/li><li>\n<strong>Shingles<\/strong>: split a log into thin shingles for a tiled roof. A timber cottage's roof takes a great many, so plan for several logs.\n<\/li><li>\n<strong>A mast<\/strong> is trimmed from a whole log, and a <strong>paddle<\/strong> is carved from one. Both are for boats.\n<\/li><li>\n<strong>A raft<\/strong> needs no splitting at all: logs lashed side by side with cord.\n<\/li><\/ul>\n<h2 data-h=\"tips\">Tips<\/h2>\n<ul><li>\nTake an axe on any trip to the woods; almost every build starts with a log.\n<\/li><li>\nTrees you fell near your claim grow back, so you can keep cutting the same grove if you leave it a while.\n<\/li><li>\nWood burns. A log in a fire lasts much longer than a stick; planks and shingles are better kept for building.\n<\/li><\/ul>\n<p>Next: <a href=\"#light-and-lamps\">Light and lamps<\/a><\/p>", "text": "Wood is the first thing most builds ask for. Anything with a heavy edge, such as a stone axe, will cut it. The woods grow in joined-up groves and big forests of pines and broadleaf trees, with great oaks and tall cedars in open glades and an old mossy floor deep inside. Broadleaf trees turn with the seasons and stand bare in winter; pines stay green. Trees never grow through a claim or a building. Chopping Walk to a standing tree with an axe in your hand and chop it (right-click the tree to see the chop line). Each chop gives a log: softwood from a pine, hardwood from a broadleaf tree. A tree comes down after a few logs, two from a small one and up to four from a big one, and a felled tree leaves a stump that rots away; a sapling of the same kind then grows in its place and in time becomes a tree again. A better-made axe works a little faster. Felling a tree also gives a few sticks and some fiber, so a tree is worth more than its logs. What a log becomes Softwood and hardwood both do anywhere a log is asked for. A log is useful as it is: it burns slowly, and you can set one down on the ground like any other placeable thing. With an axe you can work it further from the crafting panel (C): Planks : split a log and you get a pair of planks. Planks are for the plank boat (see Boats ); they burn faster than a log. Shingles : split a log into thin shingles for a tiled roof. A timber cottage's roof takes a great many, so plan for several logs. A mast is trimmed from a whole log, and a paddle is carved from one. Both are for boats. A raft needs no splitting at all: logs lashed side by side with cord. Tips Take an axe on any trip to the woods; almost every build starts with a log. Trees you fell near your claim grow back, so you can keep cutting the same grove if you leave it a while. Wood burns. A log in a fire lasts much longer than a stick; planks and shingles are better kept for building. Next: Light and lamps"}, {"slug": "mining", "group": "Making things", "title": "Mining", "path": "", "html": "<p>Some of the rock in the hills holds ore. You can break it out with a pick.<\/p>\n<h2 data-h=\"the-stone-pick\">The stone pick<\/h2>\n<p>Lash a stone pick from stone, a stick and cord. A pick wears down as you use it, like other tools, and can be mended at a repair table.<\/p>\n<h2 data-h=\"finding-ore\">Finding ore<\/h2>\n<p>Look for rocky outcrops on the highland foothills and slopes, marked with flecks of colour: green for copper, silver for tin. Copper lies lower down; tin sits higher up in the big mountains. Iron keeps to its own band of the mountains, and its outcrops look like iron. Not every outcrop holds ore, and no two look quite alike.<\/p>\n<p>Right-click an outcrop and choose Prospect to study the rock. It tells you how rich that vein is and, if a richer one lies close by, which way to go.<\/p>\n<h2 data-h=\"breaking-ore-out\">Breaking ore out<\/h2>\n<p>Stand next to the vein with a pick in hand and use it. Mining is a short strike minigame: how well you play decides the quality of the ore. Each good blow gives a piece of ore and a plain stone as well. If your timing is bad enough, the blow gives nothing.<\/p>\n<p>A vein holds only a few pieces. As you work it, it goes dark. Leave it alone for a while and it fills again, so come back later or try another outcrop.<\/p>\n<h2 data-h=\"the-miner-skill\">The Miner skill<\/h2>\n<p>Mining trains the Miner skill, which starts low and grows with use like any other skill. Press K to see it.<\/p>\n<h2 data-h=\"from-ore-to-metal\">From ore to metal<\/h2>\n<p>Smithing is its own skill, a specialty. A first chain is open: line a clay pot to make a melting pot, set it in a burning fire to melt copper ore into a bar, strike the bar into an axe head with a stone, and lash it to a handle for a copper axe, which chops a little faster than a stone one. Ore carries traits from its vein, such as Keen or Tough, and they follow it into the bar and the tool; hover an item to see its traits.<\/p>\n<p>The chain goes on as your Smith skill grows, using the same melting pot and fire:<\/p>\n<ul><li>\n<strong>Bronze.<\/strong> Copper and tin melted together make a bronze bar, tougher than copper, for a bronze axe and a bronze pickaxe, the step between the stone pick and steel.\n<\/li><li>\n<strong>Iron.<\/strong> Iron ore smelts into an iron bar once you have the skill for it, and a hammer beats it into an axe head.\n<\/li><li>\n<strong>Steel.<\/strong> Iron bars melted down with charcoal harden into steel, the best metal for now: a steel axe and a steel pickaxe.\n<\/li><li>\n<strong>Armour.<\/strong> Copper and bronze can also be worked into armour, beside the hide sets. Armour softens each blow that lands on you; the equipment panel says by how much.\n<\/li><\/ul>\n<p>A recipe you are not yet skilled enough for tells you so in the crafting panel.<\/p>\n<p>Next: <a href=\"#maps\">Maps<\/a><\/p>", "text": "Some of the rock in the hills holds ore. You can break it out with a pick. The stone pick Lash a stone pick from stone, a stick and cord. A pick wears down as you use it, like other tools, and can be mended at a repair table. Finding ore Look for rocky outcrops on the highland foothills and slopes, marked with flecks of colour: green for copper, silver for tin. Copper lies lower down; tin sits higher up in the big mountains. Iron keeps to its own band of the mountains, and its outcrops look like iron. Not every outcrop holds ore, and no two look quite alike. Right-click an outcrop and choose Prospect to study the rock. It tells you how rich that vein is and, if a richer one lies close by, which way to go. Breaking ore out Stand next to the vein with a pick in hand and use it. Mining is a short strike minigame: how well you play decides the quality of the ore. Each good blow gives a piece of ore and a plain stone as well. If your timing is bad enough, the blow gives nothing. A vein holds only a few pieces. As you work it, it goes dark. Leave it alone for a while and it fills again, so come back later or try another outcrop. The Miner skill Mining trains the Miner skill, which starts low and grows with use like any other skill. Press K to see it. From ore to metal Smithing is its own skill, a specialty. A first chain is open: line a clay pot to make a melting pot, set it in a burning fire to melt copper ore into a bar, strike the bar into an axe head with a stone, and lash it to a handle for a copper axe, which chops a little faster than a stone one. Ore carries traits from its vein, such as Keen or Tough, and they follow it into the bar and the tool; hover an item to see its traits. The chain goes on as your Smith skill grows, using the same melting pot and fire: Bronze. Copper and tin melted together make a bronze bar, tougher than copper, for a bronze axe and a bronze pickaxe, the step between the stone pick and steel. Iron. Iron ore smelts into an iron bar once you have the skill for it, and a hammer beats it into an axe head. Steel. Iron bars melted down with charcoal harden into steel, the best metal for now: a steel axe and a steel pickaxe. Armour. Copper and bronze can also be worked into armour, beside the hide sets. Armour softens each blow that lands on you; the equipment panel says by how much. A recipe you are not yet skilled enough for tells you so in the crafting panel. Next: Maps"}, {"slug": "maps", "group": "Making things", "title": "Maps", "path": "", "html": "<p>There is no map in the game to begin with. You draw your own from the ground you have walked, and what it shows grows with your Map making skill.<\/p>\n<h2 data-h=\"drawing-a-map\">Drawing a map<\/h2>\n<p>Walking the land is what fills in a map: the game remembers the ground you have covered. To draw it, you need charcoal and either a rabbit fur or a scraped hide. Drawing is a craft from the crafting panel (C) and trains Map making, a skill that starts low like the rest.<\/p>\n<p>A drawn map is a snapshot. It shows the ground you had walked near the place where you drew it, as of that moment, so draw a fresh one after a long trip. Ground you have not walked stays blank.<\/p>\n<h2 data-h=\"reading-it\">Reading it<\/h2>\n<p>Press M to open the map you carry. If you carry several, the one drawn nearest to where you stand opens first, and Next map steps through the others. Press M or Esc to close it.<\/p>\n<h2 data-h=\"what-it-shows\">What it shows<\/h2>\n<p>The better your Map making, the more a map shows and the farther it reaches from where it was drawn:<\/p>\n<ul><li>\nAt first, only the lie of the land you walked.\n<\/li><li>\nWith some practice, streams and ponds.\n<\/li><li>\nThen landmarks.\n<\/li><li>\nLater, your claims and town.\n<\/li><li>\nAt the top, your friends, and clicking one shows you the way to them.\n<\/li><\/ul>\n<p>The same skill makes your maps cover a wider area, several times wider at the top than at the start.<\/p>\n<h2 data-h=\"copying-a-map\">Copying a map<\/h2>\n<p>You can copy a map you hold onto a fresh rabbit fur or scraped hide, with another stick of charcoal, so a friend can carry a map of a place you know.<\/p>\n<h2 data-h=\"the-map-table\">The map table<\/h2>\n<p>A map table is built at home, from the build menu, inside a claim. Stand at a finished table and press M to see the land that everyone with rights in your claim has walked: the owner, members and the town. It centres on the claim marker and reaches as far as your own Map making allows. Several people exploring different directions fill in one shared picture.<\/p>\n<p>Next: <a href=\"#cooking-and-clothes\">Cooking and clothes<\/a><\/p>", "text": "There is no map in the game to begin with. You draw your own from the ground you have walked, and what it shows grows with your Map making skill. Drawing a map Walking the land is what fills in a map: the game remembers the ground you have covered. To draw it, you need charcoal and either a rabbit fur or a scraped hide. Drawing is a craft from the crafting panel (C) and trains Map making, a skill that starts low like the rest. A drawn map is a snapshot. It shows the ground you had walked near the place where you drew it, as of that moment, so draw a fresh one after a long trip. Ground you have not walked stays blank. Reading it Press M to open the map you carry. If you carry several, the one drawn nearest to where you stand opens first, and Next map steps through the others. Press M or Esc to close it. What it shows The better your Map making, the more a map shows and the farther it reaches from where it was drawn: At first, only the lie of the land you walked. With some practice, streams and ponds. Then landmarks. Later, your claims and town. At the top, your friends, and clicking one shows you the way to them. The same skill makes your maps cover a wider area, several times wider at the top than at the start. Copying a map You can copy a map you hold onto a fresh rabbit fur or scraped hide, with another stick of charcoal, so a friend can carry a map of a place you know. The map table A map table is built at home, from the build menu, inside a claim. Stand at a finished table and press M to see the land that everyone with rights in your claim has walked: the owner, members and the town. It centres on the claim marker and reaches as far as your own Map making allows. Several people exploring different directions fill in one shared picture. Next: Cooking and clothes"}, {"slug": "hides-and-leather", "group": "Making things", "title": "Hides and leather", "path": "", "html": "<p>A butchered sheep or deer leaves a hide. Left alone it is just a heavy skin; worked, it becomes leather, which a few of the warmer and tougher things you can wear are made from. Working hides trains the Leatherwork skill (see <a href=\"#crafting-and-skills\">Crafting and skills<\/a>).<\/p>\n<h2 data-h=\"from-hide-to-leather\">From hide to leather<\/h2>\n<ol><li>\n<strong>Scrape it.<\/strong> With a cutting tool in hand, scrape the hide clean. A sheep hide is scraped at a leather drying rack; a deer hide can be scraped anywhere.\n<\/li><li>\n<strong>Stretch it.<\/strong> Lace the scraped hide onto the bar of a leather drying rack with sticks and cord. A rack holds a few hides at once.\n<\/li><li>\n<strong>Let it dry.<\/strong> A hide dries the way clay does: slowly in rain, faster beside a burning fire.\n<\/li><li>\n<strong>Take it down.<\/strong> When it is dry, use the rack to take the leather down. A cleaner scrape gives better leather. Take a hide down too early and you only get the scraped hide back.\n<\/li><\/ol>\n<p>The rack is a station, so it can only be built inside a claim you have rights to (see <a href=\"#building-and-claims\">Building and claims<\/a>).<\/p>\n<h2 data-h=\"what-leather-is-for\">What leather is for<\/h2>\n<ul><li>\n<strong>Leather foot wraps<\/strong>, cut and laced with cordage at the rack (see <a href=\"#cooking-and-clothes\">Cooking and clothes<\/a>).\n<\/li><li>\nA <strong>waterskin<\/strong> needs only a sheep hide and cordage, no drying. It carries a little water before you have pottery, less than a pot does, and is filled at the water's edge like a pot.\n<\/li><\/ul>\n<p>Next: <a href=\"#animals\">Animals<\/a><\/p>", "text": "A butchered sheep or deer leaves a hide. Left alone it is just a heavy skin; worked, it becomes leather, which a few of the warmer and tougher things you can wear are made from. Working hides trains the Leatherwork skill (see Crafting and skills ). From hide to leather Scrape it. With a cutting tool in hand, scrape the hide clean. A sheep hide is scraped at a leather drying rack; a deer hide can be scraped anywhere. Stretch it. Lace the scraped hide onto the bar of a leather drying rack with sticks and cord. A rack holds a few hides at once. Let it dry. A hide dries the way clay does: slowly in rain, faster beside a burning fire. Take it down. When it is dry, use the rack to take the leather down. A cleaner scrape gives better leather. Take a hide down too early and you only get the scraped hide back. The rack is a station, so it can only be built inside a claim you have rights to (see Building and claims ). What leather is for Leather foot wraps , cut and laced with cordage at the rack (see Cooking and clothes ). A waterskin needs only a sheep hide and cordage, no drying. It carries a little water before you have pottery, less than a pot does, and is filled at the water's edge like a pot. Next: Animals"}, {"slug": "building-and-claims", "group": "Home and town", "title": "Building and claims", "path": "", "html": "<h2 data-h=\"building\">Building<\/h2>\n<p>Open the build menu (B). It is sorted into tabs (shelter, storage, crafting, fire, fences and gates, animals, claims), and each entry shows what it costs; entries you cannot afford yet are greyed out. Pick one and place its blueprint, a see-through outline of the building: rotate it with T, and place it with Enter or a click. Then add materials to it with Use (E): each tap puts in a whole stack, and holding the key goes on to the next material. Anyone can add materials to any blueprint, so groups can build together. You can have only a few unfinished sites at once.<\/p>\n<p>A lean-to is the simplest shelter. It keeps off most of the rain but only a little of the cold, so it does not replace a fire. Clay huts, mud-brick houses, log cabins, timber cottages and tiled houses need more and better materials and give more protection from cold and rain. In a house or cabin, a fire inside warms the whole room. For fire there are two built hearths in the Fire tab. A raised hearth, a ring of stones with a clay surround, goes inside a hut or house, and a fire on it burns longer per stick. A stone-ringed hearth stands outdoors, burns longer too, and warms a wider circle than a plain campfire, which makes it a good place to work through a winter night.<\/p>\n<p>When you are inside a finished shelter, its roof and the walls between you and the camera fade so you can see yourself. They also fade when you walk behind a building.<\/p>\n<p>Inside a finished shelter you have a right to (you placed it, helped build it, or belong to its claim), you can lay a sleeping mat. After you die, you respawn on it. You can have one mat at a time; laying a new one rolls up the old one. A straw bed or a fur bed does the same job as a mat. A fur bed stands only inside a claim, but a straw bed can be set up anywhere, even out in the open; with no roof over it, though, the straw rots away fairly quickly. If the building is taken down or weathers away, the mat or bed no longer works as a respawn point.<\/p>\n<p>Some structures, such as the kilns, are also built from the build menu rather than crafted. A small kiln takes two bricks and fires a few pots; the full kiln takes more and also fires large pieces.<\/p>\n<h2 data-h=\"building-a-house-part-by-part\">Building a house part by part<\/h2>\n<p>First build a sawing table on your claim, or on one of your town's claims: laying house parts needs one nearby on the same land. Then, on your claim, press H to build a house piece by piece: floors, walls, walls with a door or a window, roofs, ridge caps, roof ends and stairs. Tab picks the part, T turns it, Ctrl moves it in half steps, Backspace takes a part down and Esc stops. A part needs something to rest on, and you cannot take one down while another rests on it. A roof overhead counts as shelter. You can climb stairs to stand on an upper floor. At the sawing table you can also cut boards into wall and floor panels ahead of time: a panel goes up in one piece and costs a little less wood than building the same part from loose boards. Inside, the roof and the floors above you fade away so you can see yourself.<\/p>\n<p>While you build, the note on screen names the part in your hand, what it takes against what you carry, how many of each you still need if you are short, and how full the house is. A house holds a limited number of parts, and the note says when it is nearly full.<\/p>\n<h2 data-h=\"slopes-and-shaping-the-ground\">Slopes and shaping the ground<\/h2>\n<p>Buildings level the ground under them, so gentle and moderate slopes are fine to build on; only really steep ground is refused. On your own land you can also shape the ground. With a digging tool in hand, press G, point where you want to work and hold the left button to flatten, raise, lower or smooth it. Tab or the mouse wheel changes the mode. You can only move the ground so far from how it began, and the owner can put the natural ground back.<\/p>\n<h2 data-h=\"taking-a-build-down\">Taking a build down<\/h2>\n<p>Right-click a finished build you laid out, or one on land you own, and choose the take down line. Choose it a second time within a few seconds to confirm. What went into it is left on the ground. Someone else's build shows who built it under its name.<\/p>\n<h2 data-h=\"doors\">Doors<\/h2>\n<p>Doors can be hung, opened and shut with Use. Anyone can open an unbarred door. The player who hung a door, or any member of the claim it stands in, can bar it from the door's right-click menu; a barred door opens only for them.<\/p>\n<p>A finished hut or house can be given a name by whoever built it: walk up to it and use its right-click menu. Everyone sees the name, and it stays when you rebuild into a better home.<\/p>\n<h2 data-h=\"storage\">Storage<\/h2>\n<p>Storage baskets hold items, and a wooden chest, built from logs and cord, is a sturdier store that takes more than a basket. A storage jar is a larger store made from clay; it is too big for an open fire and must be fired in a full kiln. A better-made jar holds more. Outside a claim, anyone can take from a basket. Inside a claim, only members can.<\/p>\n<h2 data-h=\"furniture-and-water-at-home\">Furniture and water at home<\/h2>\n<p>A bench, made from a few sticks and a log, is somewhere to sit by a fire or a door: use it and your character sits. A bench can stand anywhere. Inside a claim you can also build a storage shelf and a table. Both hold a few stacks of things that stand in plain view on top, so a home looks lived in, and only the claim's owner and members can take from them. Benches tuck in beside a table.<\/p>\n<p>A well is a big build of fieldstones, a log winch and a rope and bucket, meant for many hands, and it stands inside a claim that has a stone-breaking bench (on that claim, or on one of your town's). Build the bench from the build menu first: eight stones and four sticks. Any build that takes ten or more stones in all, like the well, needs the bench the same way. Beside a finished well you can drink and fill your empty pots and waterskins, as at a lake. A well never runs dry and needs no tending.<\/p>\n<h2 data-h=\"paths-and-footbridges\">Paths and footbridges<\/h2>\n<p>The Paths tab of the build menu has a stone path and a footbridge. A stone path is flat stones bedded in trodden earth, six stones a piece. It can go anywhere, right up to a door or along a wall or fence, and the next piece snaps onto the end of the last. Walking on a finished path is about a tenth quicker. A footbridge is planks laid across a stream on posts in both banks, so you walk over instead of wading, and a path snaps onto its end.<\/p>\n<h2 data-h=\"old-ruins-that-turn-up\">Old ruins that turn up<\/h2>\n<p>Now and then the low country shows an old ruin: the stone footings of a small house with a doorway gap and spilled stones. A few stand at a time, each different from the last, and each fades in time and turns up somewhere else later. Stand beside one and press E to restore it for twelve stones: its walls stand again under a stone roof, it keeps the rain off and takes the chill off, and the work gives a good amount of Builder experience. A restored ruin lasts a couple of weeks before it fades too. The town board lists the old ruins that have turned up, with which way and about how far each lies.<\/p>\n<h2 data-h=\"claims\">Claims<\/h2>\n<p>A claim marker, placed from the build menu, claims an area of land. You can own several claims, up to six. Lay a new marker near one of your own claims and it snaps into place edge to edge with it, so your land lines up; if you already hold the most you can, the game says so and you must take a marker down first. You cannot claim land close to the spawn area; if you try, the game tells you how far to walk. The same goes for land close to a monster site; the game says how far to move away.<\/p>\n<p>Inside a claim:<\/p>\n<ul><li>\nBuildings and items do not weather away.\n<\/li><li>\nPlayers cannot fight unless the owner allows it, and monsters keep out of your claim and stay on the far side of your walls and fences.\n<\/li><li>\nOnly members can take from storage.\n<\/li><li>\nYou can build crafting stations, such as a drying shelf: a low rack under a little thatch roof where wet pots and bricks dry faster than on open ground, and the rain cannot reach them.\n<\/li><li>\nYou can build a sundial, a flat stone with a stick. While one stands in your claim, a thin arc at the top of the screen shows the time of day, a sun by day and a moon by night; hover it for the time in words. Everyone in the claim sees it.\n<\/li><li>\nThe owner can invite members and take down any building; its materials drop on the spot.\n<\/li><\/ul>\n<p>Use (E) at your marker to open the claim window, where the owner can name the claim. You can also click the land line at the top right of the screen. The name shows when someone walks in and on the land indicator while you are inside.<\/p>\n<p>The claim border appears as a line on the ground when you get close to it. The marker must be tended (Use) now and then. A claim left untended for too long decays.<\/p>\n<p>Your first claim square is free to keep. Each square beyond it costs a small land tax, 40 copper coins a week, which pays itself from your purse; squares signed into a town are the town's to keep up, not yours. If you carry too few coins, the tax waits and the claim stops renewing, and the game warns you a week, three days and a day before it falls. Carry some coins and the tax catches up by itself.<\/p>\n<h2 data-h=\"fences-and-gates\">Fences and gates<\/h2>\n<p>Fences and gates are in the build menu. On a claim, members can run a fence along the border, and a gate on claimed land opens only for the owner and members. Animals will not step through a finished fence or a shut gate, so a closed ring of fence makes a pen. If a claim lapses, its fences stay as ordinary fences and its gates open to anyone.<\/p>\n<h2 data-h=\"weathering\">Weathering<\/h2>\n<p>Anything players made that sits outside a claim, including buildings, baskets and items on the ground, weathers away if nobody touches it for a long time. Using or interacting with it resets the timer. To keep things safe, visit them or put them inside a claim.<\/p>\n<p>Next: <a href=\"#towns\">Towns<\/a><\/p>", "text": "Building Open the build menu (B). It is sorted into tabs (shelter, storage, crafting, fire, fences and gates, animals, claims), and each entry shows what it costs; entries you cannot afford yet are greyed out. Pick one and place its blueprint, a see-through outline of an old ruin: the stone footings of a small house with a doorway gap and spilled stones. A few stand at a time, each different from the last, and each fades in time and turns up somewhere else later. Stand beside one and press E to restore it for twelve stones: its walls stand again under a stone roof, it keeps the rain off and takes the chill off, and the work gives a good amount of Builder experience. A restored ruin lasts a couple of weeks before it fades too. The town board lists the old ruins that have turned up, with which way and about how far each lies. Claims A claim marker, placed from the build menu, claims an area of land. You can own several claims, up to six. Lay a new marker near one of your own claims and it snaps into place edge to edge with it, so your land lines up; if you already hold the most you can, the game says so and you must take a marker down first. You cannot claim land close to the spawn area; if you try, the game tells you how far to walk. The same goes for land close to a monster site; the game says how far to move away. Inside a claim: Buildings and items do not weather away. Players cannot fight unless the owner allows it, and monsters keep out of your claim and stay on the far side of your walls and fences. Only members can take from storage. You can build crafting stations, such as a drying shelf: a low rack under a little thatch roof where wet pots and bricks dry faster than on open ground, and the rain cannot reach them. You can build a sundial, a flat stone with a stick. While one stands in your claim, a thin arc at the top of the screen shows the time of day, a sun by day and a moon by night; hover it for the time in words. Everyone in the claim sees it. The owner can invite members and take down any building; its materials drop on the spot. Use (E) at your marker to open the claim window, where the owner can name the claim. You can also click the land line at the top right of the screen. The name shows when someone walks in and on the land indicator while you are inside. The claim border appears as a line on the ground when you get close to it. The marker must be tended (Use) now and then. A claim left untended for too long decays. Your first claim square is free to keep. Each square beyond it costs a small land tax, 40 copper coins a week, which pays itself from your purse; squares signed into a town are the town's to keep up, not yours. If you carry too few coins, the tax waits and the claim stops renewing, and the game warns you a week, three days and a day before it falls. Carry some coins and the tax catches up by itself. Fences and gates Fences and gates are in the build menu. On a claim, members can run a fence along the border, and a gate on claimed land opens only for the owner and members. Animals will not step through a finished fence or a shut gate, so a closed ring of fence makes a pen. If a claim lapses, its fences stay as ordinary fences and its gates open to anyone. Weathering Anything players made that sits outside a claim, including buildings, baskets and items on the ground, weathers away if nobody touches it for a long time. Using or interacting with it resets the timer. To keep things safe, visit them or put them inside a claim. Next: Towns"}, {"slug": "towns", "group": "Home and town", "title": "Towns", "path": "", "html": "<p>A town is a roster of neighbours who have signed up together. Signing lets you build on each other's claims, and it gives the town a set of offices that its members vote for.<\/p>\n<h2 data-h=\"starting-a-town\">Starting a town<\/h2>\n<p>A town starts from a claim marker (see <a href=\"#building-and-claims\">Building and claims<\/a>). Open your claim window (Use at your marker) and press Town. If you are on no roster, you can name a new one, and you sign first as its Mayor. Then invite the neighbours whose markers stand near yours, either from the Town panel or from a player's right-click menu. They get an invitation and choose to sign the roster with their claim, or to join as a Resident (see below). Anyone already on the roster can invite more. Building a town board on your claim also founds a town; the board is where its notes, votes and jobs are pinned.<\/p>\n<p>You need a claim of your own to sign with, and a claim is on one roster at a time.<\/p>\n<h2 data-h=\"residents\">Residents<\/h2>\n<p>A Resident lives in the town without giving up any land and needs no claim of their own. A Resident can vote for offices but cannot stand for one or invite others, and builds only on claims whose owners have shared them in. They can leave at any time with nothing owed, and the Mayor can remove one. The roster lists them apart from the signers.<\/p>\n<h2 data-h=\"the-town-panel\">The Town panel<\/h2>\n<p>The Town panel is a map first: a top-down picture of the town's claims, with the roster beside it.<\/p>\n<ul><li>\nA filled claim has signed the roster. A dashed claim is a neighbour on no roster, and a blue one belongs to another town.\n<\/li><li>\nClick a claim to see its owner, what offices they hold, and what you can do about them: vote for them, invite them, or, with the right office, remove them.\n<\/li><li>\nWalking into a town's land shows an \"Entering\" note with its name.\n<\/li><li>\nThe Map page of the town board shows the town's land, and the Mayor can place it from there.\n<\/li><li>\nGiving a town square back asks a second time if it holds someone else's build, and the builder is told.\n<\/li><\/ul>\n<p>Everyone on the roster may build on each other's claims. Leaving the roster takes that away both ways: you lose your rights on the others' claims, and they lose theirs on yours.<\/p>\n<h2 data-h=\"offices\">Offices<\/h2>\n<p>A small town has no offices until it has six Members; until then the Mayor runs everything. After that, the town has ten offices. Everyone on the roster votes for them, and the holders change when terms end.<\/p>\n<ul><li>\n<strong>Mayor:<\/strong> renames the town, proposes projects, speaks to the whole town, clears ruins and takes from the town's store.\n<\/li><li>\n<strong>Deputy:<\/strong> stands in for the Mayor while the seat is empty.\n<\/li><li>\n<strong>Judge<\/strong> and <strong>Elder:<\/strong> settle a tied election.\n<\/li><li>\n<strong>Herald:<\/strong> sends a word to the whole town.\n<\/li><li>\n<strong>Warden:<\/strong> clears away buildings left behind by people who have gone.\n<\/li><li>\n<strong>Marshal:<\/strong> keeps the peace by banning a player from the town's claims for a time. A banned player sees how long they are kept off.\n<\/li><li>\n<strong>Treasurer:<\/strong> keeps the town's store, takes things out of it, and uses it to keep up the town's claims.\n<\/li><li>\n<strong>Gatekeeper:<\/strong> bars and unbars the gates on the town's claims.\n<\/li><li>\n<strong>Scribe:<\/strong> keeps the town's log, which only the town's signers can read.\n<\/li><\/ul>\n<p>The ballot is secret: you see your own vote, not how others voted or running counts. If enough of the roster agree on one person the seat is filled at once; otherwise the most votes win when the term ends. When a vote closes, the town's log shows the count, but never who voted for whom.<\/p>\n<p>New Residents vote only once they have lived in the town for a week. The town can vote any officer or Member out; the Mayor cannot remove a Member alone. A Mayor who stays away for a week loses the seat, and the Elder keeps the town running until the next vote.<\/p>\n<h2 data-h=\"projects\">Projects<\/h2>\n<p>The Mayor proposes a project: a building on one of the town's squares. Members who have been in the town a week or more vote on it for two days; Residents do not vote. Finished projects lift the town from Hamlet to Village to Town, and each step opens new things to build.<\/p>\n<h2 data-h=\"building-jobs\">Building jobs<\/h2>\n<p>At a town board you can post one of your building sites with a fee, in coins, goods or both, and someone else builds it for you. Or take a job there, build it on their land, and the fee is yours when it stands. A job left unfinished for too long lapses, and its fee goes back. Building a job you took teaches your Builder skill a little more than building the same thing for yourself.<\/p>\n<h2 data-h=\"notice-boards-and-coins\">Notice boards and coins<\/h2>\n<p>A notice board stands in the clearing where new arrivals start. Use it (E) to read the slips pinned to it: small jobs such as bringing in sticks, berries or rope, making a fired pot, or bringing a hide from the hunt. Take a slip, gather what it asks, and hand it in at the board to be paid. Give a slip back if you change your mind.<\/p>\n<p>Pay comes in copper coins; a hundred copper make a silver, and a hundred silver a gold. What you hold shows in your purse, on your character sheet (I). The boards only pay out so much to each player in a week, so the jobs are a help along the way rather than a living.<\/p>\n<h2 data-h=\"when-a-town-ends\">When a town ends<\/h2>\n<p>A town ends when its last Member leaves, or when nobody on it logs in for two weeks. Its land is held for a month after, so a former Member can bring it back.<\/p>\n<h2 data-h=\"the-town-store\">The town store<\/h2>\n<p>The town keeps a shared store, reached from a claim marker's right-click menu (\"The town's store\"). Anyone on the roster can put things in. Only the holders of certain offices can take things out, and what they take is written to the town's log.<\/p>\n<p>Next: <a href=\"#working-wood\">Working wood<\/a><\/p>", "text": "A town is a roster of neighbours who have signed up together. Signing lets you build on each other's claims, and it gives the town a set of offices that its members vote for. Starting a town A town starts from a claim marker (see Building and claims ). Open your claim window (Use at your marker) and press Town. If you are on no roster, you can name a new one, and you sign first as its Mayor. Then invite the neighbours whose markers stand near yours, either from the Town panel or from a player's right-click menu. They get an invitation and choose to sign the roster with their claim, or to join as a Resident (see below). Anyone already on the roster can invite more. Building a town board on your claim also founds a town; the board is where its notes, votes and jobs are pinned. You need a claim of your own to sign with, and a claim is on one roster at a time. Residents A Resident lives in the town without giving up any land and needs no claim of their own. A Resident can vote for offices but cannot stand for one or invite others, and builds only on claims whose owners have shared them in. They can leave at any time with nothing owed, and the Mayor can remove one. The roster lists them apart from the signers. The Town panel The Town panel is a map first: a top-down picture of the town's claims, with the roster beside it. A filled claim has signed the roster. A dashed claim is a neighbour on no roster, and a blue one belongs to another town. Click a claim to see its owner, what offices they hold, and what you can do about them: vote for them, invite them, or, with the right office, remove them. Walking into a town's land shows an \"Entering\" note with its name. The Map page of the town board shows the town's land, and the Mayor can place it from there. Giving a town square back asks a second time if it holds someone else's build, and the builder is told. Everyone on the roster may build on each other's claims. Leaving the roster takes that away both ways: you lose your rights on the others' claims, and they lose theirs on yours. Offices A small town has no offices until it has six Members; until then the Mayor runs everything. After that, the town has ten offices. Everyone on the roster votes for them, and the holders change when terms end. Mayor: renames the town, proposes projects, speaks to the whole town, clears ruins and takes from the town's store. Deputy: stands in for the Mayor while the seat is empty. Judge and Elder: settle a tied election. Herald: sends a word to the whole town. Warden: clears away buildings left behind by people who have gone. Marshal: keeps the peace by banning a player from the town's claims for a time. A banned player sees how long they are kept off. Treasurer: keeps the town's store, takes things out of it, and uses it to keep up the town's claims. Gatekeeper: bars and unbars the gates on the town's claims. Scribe: keeps the town's log, which only the town's signers can read. The ballot is secret: you see your own vote, not how others voted or running counts. If enough of the roster agree on one person the seat is filled at once; otherwise the most votes win when the term ends. When a vote closes, the town's log shows the count, but never who voted for whom. New Residents vote only once they have lived in the town for a week. The town can vote any officer or Member out; the Mayor cannot remove a Member alone. A Mayor who stays away for a week loses the seat, and the Elder keeps the town running until the next vote. Projects The Mayor proposes a project: a building on one of the town's squares. Members who have been in the town a week or more vote on it for two days; Residents do not vote. Finished projects lift the town from Hamlet to Village to Town, and each step opens new things to build. Building jobs At a town board you can post one of your building sites with a fee, in coins, goods or both, and someone else builds it for you. Or take a job there, build it on their land, and the fee is yours when it stands. A job left unfinished for too long lapses, and its fee goes back. Building a job you took teaches your Builder skill a little more than building the same thing for yourself. Notice boards and coins A notice board stands in the clearing where new arrivals start. Use it (E) to read the slips pinned to it: small jobs such as bringing in sticks, berries or rope, making a fired pot, or bringing a hide from the hunt. Take a slip, gather what it asks, and hand it in at the board to be paid. Give a slip back if you change your mind. Pay comes in copper coins; a hundred copper make a silver, and a hundred silver a gold. What you hold shows in your purse, on your character sheet (I). The boards only pay out so much to each player in a week, so the jobs are a help along the way rather than a living. When a town ends A town ends when its last Member leaves, or when nobody on it logs in for two weeks. Its land is held for a month after, so a former Member can bring it back. The town store The town keeps a shared store, reached from a claim marker's right-click menu (\"The town's store\"). Anyone on the roster can put things in. Only the holders of certain offices can take things out, and what they take is written to the town's log. Next: Working wood"}, {"slug": "other-players", "group": "Home and town", "title": "Other players", "path": "", "html": "<p>The world is shared by up to a few dozen players at once.<\/p>\n<h2 data-h=\"chat\">Chat<\/h2>\n<p>Press Enter to chat. Only players near you see your messages, and each line also appears in a bubble above the speaker. Type <code>/me<\/code> followed by an action to describe what your character does (for example <code>/me waves<\/code>). Type <code>/name YourName<\/code> to change your name. <code>/w<\/code> whispers to someone within a few steps, <code>/s<\/code> shouts a long way, and <code>/g<\/code> talks to your group wherever they are. Hold Q for the emote wheel.<\/p>\n<h2 data-h=\"friends-and-groups\">Friends and groups<\/h2>\n<p>Right-click another player to whisper to them, invite them to your group or town, add them as a friend, or inspect them: a note shows their name, their town and their best skills.<\/p>\n<p>Press O to open your friends list. You can also add someone there by typing their name. Adding a friend shows only their name at first. Once you have both added each other, you each see whether the other is online and roughly which way they are and how far, such as \"40 m north\", at any distance. The spot is rounded, never exact, and nobody else can see who your friends are. The map screen lists your friends too, and clicking one shows you the way.<\/p>\n<p>A group is a small party with no leader. Invite someone standing close to you from the right-click menu; the invitation waits a short while for an answer, and anyone can leave at any time. Group members can see each other in a list and talk with <code>/g<\/code> wherever they are. A member who stays away for a day drops out, and the group ends when only one person is left.<\/p>\n<h2 data-h=\"working-together\">Working together<\/h2>\n<ul><li>\nAnyone can add materials to a blueprint.\n<\/li><li>\nA claim owner can invite others as members.\n<\/li><li>\nOther players can learn a process by watching you work or by reading a note you leave.\n<\/li><li>\nPlayers who choose different specialties can make things for each other.\n<\/li><li>\nA pot of broth or stew simmering on your fire holds three bowls. Once it is done, anyone in your group within reach can ladle a bowl with Use, and each bowl feeds them a third of the dish. After the third bowl the pot goes and you get the empty pot back. People outside your group cannot ladle it.\n<\/li><li>\nA woven basket on your back can be seen by everyone, whether it is in your bag or worn.\n<\/li><li>\nOther players can see when you are sneaking.\n<\/li><\/ul>\n<h2 data-h=\"trading\">Trading<\/h2>\n<p>Right-click another player and choose Trade to ask them. A \"wants to trade\" sign appears over the player who asked; they say yes with Use or no with Esc. In the trade window, click things you carry to offer them (Shift+click offers the whole stack) and click your offer to take something back. The swap happens only when both players accept. Any change to either offer clears both accepts. Walking apart or pressing Esc calls the trade off. You can receive more than you can comfortably carry.<\/p>\n<h2 data-h=\"fighting\">Fighting<\/h2>\n<p>Left click strikes a player in reach. Your skill with the weapon in your hand decides how hard you hit, and a bow works against players too.<\/p>\n<ul><li>\nFighting is allowed in the wild.\n<\/li><li>\nFighting is blocked near the spawn area, and inside claims unless the owner allows it.\n<\/li><li>\nNew players are protected for a short time after they first join.\n<\/li><li>\nDying to a player works like any other death: what was in your bag drops, you keep your belt tools, what you wear and your skills.\n<\/li><li>\nEach hit is announced in chat. A player who kills another has their name shown in red to everyone for a while.\n<\/li><\/ul>\n<p>Next: <a href=\"#tips\">Tips<\/a><\/p>", "text": "The world is shared by up to a few dozen players at once. Chat Press Enter to chat. Only players near you see your messages, and each line also appears in a bubble above the speaker. Type /me followed by an action to describe what your character does (for example /me waves ). Type /name YourName to change your name. /w whispers to someone within a few steps, /s shouts a long way, and /g talks to your group wherever they are. Hold Q for the emote wheel. Friends and groups Right-click another player to whisper to them, invite them to your group or town, add them as a friend, or inspect them: a note shows their name, their town and their best skills. Press O to open your friends list. You can also add someone there by typing their name. Adding a friend shows only their name at first. Once you have both added each other, you each see whether the other is online and roughly which way they are and how far, such as \"40 m north\", at any distance. The spot is rounded, never exact, and nobody else can see who your friends are. The map screen lists your friends too, and clicking one shows you the way. A group is a small party with no leader. Invite someone standing close to you from the right-click menu; the invitation waits a short while for an answer, and anyone can leave at any time. Group members can see each other in a list and talk with /g wherever they are. A member who stays away for a day drops out, and the group ends when only one person is left. Working together Anyone can add materials to a blueprint. A claim owner can invite others as members. Other players can learn a process by watching you work or by reading a note you leave. Players who choose different specialties can make things for each other. A pot of broth or stew simmering on your fire holds three bowls. Once it is done, anyone in your group within reach can ladle a bowl with Use, and each bowl feeds them a third of the dish. After the third bowl the pot goes and you get the empty pot back. People outside your group cannot ladle it. A woven basket on your back can be seen by everyone, whether it is in your bag or worn. Other players can see when you are sneaking. Trading Right-click another player and choose Trade to ask them. A \"wants to trade\" sign appears over the player who asked; they say yes with Use or no with Esc. In the trade window, click things you carry to offer them (Shift+click offers the whole stack) and click your offer to take something back. The swap happens only when both players accept. Any change to either offer clears both accepts. Walking apart or pressing Esc calls the trade off. You can receive more than you can comfortably carry. Fighting Left click strikes a player in reach. Your skill with the weapon in your hand decides how hard you hit, and a bow works against players too. Fighting is allowed in the wild. Fighting is blocked near the spawn area, and inside claims unless the owner allows it. New players are protected for a short time after they first join. Dying to a player works like any other death: what was in your bag drops, you keep your belt tools, what you wear and your skills. Each hit is announced in chat. A player who kills another has their name shown in red to everyone for a while. Next: Tips"}, {"slug": "animals", "group": "The wild", "title": "Animals", "path": "", "html": "<p>Sheep live in flocks in open ground. Hens and rabbits live in the wild too.<\/p>\n<ul><li>\n<strong>Approaching.<\/strong> Sheep run from players who move quickly near them. Hold Ctrl to sneak and they stay calm.\n<\/li><li>\n<strong>Wool.<\/strong> With a cutting tool in hand, shear a calm sheep with Use, or from its right-click menu. A sheep that is running or flustered will not stand for it, so sneak up on it. Shearing leaves it bare; the wool grows back over time, and until then there is nothing more to take. Raw wool is spun into yarn at the spindle station (see <a href=\"#cooking-and-clothes\">Cooking and clothes<\/a>).\n<\/li><li>\n<strong>Meat and hide.<\/strong> Sheep can be killed with a weapon or cutting tool (strike with left click). The rest of the flock flees. Butchering gives meat and hide. A dead animal lying on someone's claim can only be butchered or carried off by that claim's owner and members. Cook meat at a fire before eating it.\n<\/li><li>\n<strong>Lambs.<\/strong> Flocks have lambs, which follow their mothers until they are grown.\n<\/li><li>\n<strong>Snow.<\/strong> In snow, a flock keeps close together and wanders less.\n<\/li><li>\n<strong>Regrowth.<\/strong> Flocks recover slowly over in-game days and never disappear completely.\n<\/li><\/ul>\n<p>Shearing and butchering train Animal care, a survival basic.<\/p>\n<h2 data-h=\"hens-and-rabbits\">Hens and rabbits<\/h2>\n<p>A hen that is left in peace lays eggs. Build a hen coop (in the Animals tab) and the hens make it their home: at dusk they walk in and settle for the night, and by day they scratch about around it. A rabbit is a small meal, and a snare of cord set where rabbits run may be waiting with one when you come back.<\/p>\n<h2 data-h=\"taming\">Taming<\/h2>\n<p>Offer berries to a calm hen, rabbit or sheep and it learns to trust you. Keep feeding it and it becomes tame to you: it stops shying away and lets you pick it up. One animal trusts one person, so a tame hen is yours. A tame animal can be given a name and can follow you. It needs no feeding or tending afterwards.<\/p>\n<h2 data-h=\"pens\">Pens<\/h2>\n<p>Animals will not step through a finished fence or a shut gate, so a closed ring of fence keeps them in. Taming an animal inside a closed pen takes more animal care skill than taming one out in the open. A pair of tame animals of one kind, shut in a roomy closed pen, have young now and then. Inside someone else's claim you cannot strike, shoot or shear an animal unless you are the owner or a member.<\/p>\n<h2 data-h=\"red-deer\">Red deer<\/h2>\n<p>Red deer live in herds at the edge of the woods. They notice you from much farther away than sheep and run far into the trees, but a player who keeps still does not alarm them. Butchering a deer gives venison and hide, and a grown deer also gives antler.<\/p>\n<h2 data-h=\"horses-and-donkeys\">Horses and donkeys<\/h2>\n<p>Wild horses and donkeys live in small herds on open ground, far from where you start, and a horse herd is a rare find. Horses are shy and notice you from a distance. Donkeys are smaller and steadier. Neither can be hunted or butchered. Win one over the way you would a sheep, by offering wild roots or berries to a calm animal until it trusts you. Riding is not in the game yet, and they do not breed.<\/p>\n<p>A tame horse or donkey wants a stable. Build a plank stable with two stalls and a shingle roof from the build menu's animals tab, near where you keep them. Without one nearby, a tame animal slowly grows unhappy and in time leaves you, with a message to say so; you are warned before it goes. A stable puts it right at once. A keeper skilled in animal care can tell how content a mount is by looking at it. A hitching rail, also in the animals tab, is somewhere to tie one up.<\/p>\n<p>Sew a saddle bag and fit it on a tame donkey: while the donkey follows you and stays close, you can carry more.<\/p>\n<h2 data-h=\"goats\">Goats<\/h2>\n<p>Goats live in the wild. Like sheep, they are tamed by hand-feeding a calm one, and they breed in a closed pen. A tame goat can be milked, with Use or from its right-click menu; it gives a little milk every couple of days.<\/p>\n<h2 data-h=\"hunting\">Hunting<\/h2>\n<p>Strike with a spear or a blade (left click). A spear reaches a little farther and hits harder. A struck animal runs, so expect a chase. Striking from a sneak, while the animal is calm, can land a critical hit with a visible burst. Stalking is the skill behind this: the more you train it, the more often critical hits land and the harder they hit. Each strike wears your weapon.<\/p>\n<p>Next: <a href=\"#hunting-and-snares\">Hunting and snares<\/a><\/p>", "text": "Sheep live in flocks in open ground. Hens and rabbits live in the wild too. Approaching. Sheep run from players who move quickly near them. Hold Ctrl to sneak and they stay calm. Wool. With a cutting tool in hand, shear a calm sheep with Use, or from its right-click menu. A sheep that is running or flustered will not stand for it, so sneak up on it. Shearing leaves it bare; the wool grows back over time, and until then there is nothing more to take. Raw wool is spun into yarn at the spindle station (see Cooking and clothes ). Meat and hide. Sheep can be killed with a weapon or cutting tool (strike with left click). The rest of the flock flees. Butchering gives meat and hide. A dead animal lying on someone's claim can only be butchered or carried off by that claim's owner and members. Cook meat at a fire before eating it. Lambs. Flocks have lambs, which follow their mothers until they are grown. Snow. In snow, a flock keeps close together and wanders less. Regrowth. Flocks recover slowly over in-game days and never disappear completely. Shearing and butchering train Animal care, a survival basic. Hens and rabbits A hen that is left in peace lays eggs. Build a hen coop (in the Animals tab) and the hens make it their home: at dusk they walk in and settle for the night, and by day they scratch about around it. A rabbit is a small meal, and a snare of cord set where rabbits run may be waiting with one when you come back. Taming Offer berries to a calm hen, rabbit or sheep and it learns to trust you. Keep feeding it and it becomes tame to you: it stops shying away and lets you pick it up. One animal trusts one person, so a tame hen is yours. A tame animal can be given a name and can follow you. It needs no feeding or tending afterwards. Pens Animals will not step through a finished fence or a shut gate, so a closed ring of fence keeps them in. Taming an animal inside a closed pen takes more animal care skill than taming one out in the open. A pair of tame animals of one kind, shut in a roomy closed pen, have young now and then. Inside someone else's claim you cannot strike, shoot or shear an animal unless you are the owner or a member. Red deer Red deer live in herds at the edge of the woods. They notice you from much farther away than sheep and run far into the trees, but a player who keeps still does not alarm them. Butchering a deer gives venison and hide, and a grown deer also gives antler. Horses and donkeys Wild horses and donkeys live in small herds on open ground, far from where you start, and a horse herd is a rare find. Horses are shy and notice you from a distance. Donkeys are smaller and steadier. Neither can be hunted or butchered. Win one over the way you would a sheep, by offering wild roots or berries to a calm animal until it trusts you. Riding is not in the game yet, and they do not breed. A tame horse or donkey wants a stable. Build a plank stable with two stalls and a shingle roof from the build menu's animals tab, near where you keep them. Without one nearby, a tame animal slowly grows unhappy and in time leaves you, with a message to say so; you are warned before it goes. A stable puts it right at once. A keeper skilled in animal care can tell how content a mount is by looking at it. A hitching rail, also in the animals tab, is somewhere to tie one up. Sew a saddle bag and fit it on a tame donkey: while the donkey follows you and stays close, you can carry more. Goats Goats live in the wild. Like sheep, they are tamed by hand-feeding a calm one, and they breed in a closed pen. A tame goat can be milked, with Use or from its right-click menu; it gives a little milk every couple of days. Hunting Strike with a spear or a blade (left click). A spear reaches a little farther and hits harder. A struck animal runs, so expect a chase. Striking from a sneak, while the animal is calm, can land a critical hit with a visible burst. Stalking is the skill behind this: the more you train it, the more often critical hits land and the harder they hit. Each strike wears your weapon. Next: Hunting and snares"}, {"slug": "hunting-and-snares", "group": "The wild", "title": "Hunting and snares", "path": "", "html": "<p><a href=\"#animals\">Animals<\/a> tells you what lives in the world. This page is about getting meat, hide and fur from it. Every kill is dressed the same way: meat, plus a hide or fur where the animal has one, and sometimes something extra (a grown deer also gives antler).<\/p>\n<h2 data-h=\"striking\">Striking<\/h2>\n<p>With a spear or a blade in hand, left click strikes an animal in reach. A struck animal bolts, so expect a chase; the more it is hurt, the slower it runs. Sneaking up on a calm animal and striking from a sneak can land a critical hit, and training Stalking makes those hits more frequent and harder. Each strike wears your weapon. Butcher what you killed with a blade where it fell, before it fades away.<\/p>\n<h2 data-h=\"weapon-skills\">Weapon skills<\/h2>\n<p>Each kind of weapon trains its own skill, and every strike teaches it a little:<\/p>\n<ul><li>\n<strong>Spears<\/strong> for a spear.\n<\/li><li>\n<strong>Axes<\/strong> for the stone axe and the hand axe.\n<\/li><li>\n<strong>Blades<\/strong> for a knife or any other edged tool.\n<\/li><li>\n<strong>Archery<\/strong> for the bow.\n<\/li><\/ul>\n<p>A higher skill makes each blow hit harder: a novice strikes noticeably softer than a master with the same weapon, and a better-made weapon adds to that. The skill matters more than the weapon, but both count. Blunt weapons and Throwing exist as skills too, but there is no weapon that trains them yet.<\/p>\n<p>These are specialties, so like Potter or Builder they share your fixed total (see <a href=\"#crafting-and-skills\">Crafting and skills<\/a>); you cannot master every one on a single character. Fighting skills rise more slowly than crafting skills. Stalking, which makes sneak attacks land, is a separate skill trained by hunting.<\/p>\n<h2 data-h=\"the-bow\">The bow<\/h2>\n<p>A bow shoots from further away than any thrust of a spear. String one from sticks and cordage (you need something sharp to cut with), and make arrows from sticks and fiber; arrows fletched with feathers fly truer. Arrows are used up when you shoot.<\/p>\n<p>Take the bow in hand with its hotbar key and carry at least one arrow in your bag. Face the animal you want and press the strike key (left click): the game picks the nearest animal in front of you within range, and the arrow flies. Hits do full damage up to a fair distance and less beyond it, and something in the way (a tree, a wall) stops the arrow. Each shot wears the bow a little; a spent bow stays in your bag but will not shoot until you mend it.<\/p>\n<h2 data-h=\"the-rabbit-snare\">The rabbit snare<\/h2>\n<p>A snare lets the woods work for you. Tie one from cordage and two sticks; no station is needed. Set it down near a warren, where rabbits run, the same way you set down any made thing (drag it out of the bag, or use its hotbar key). Then walk away.<\/p>\n<ul><li>\nA rabbit that comes close may be caught as it passes. Not every pass catches one, and lingering rabbits do not improve the odds.\n<\/li><li>\nA snare holds one catch at a time. When it holds one, use it to take the rabbit; you get the meat and fur as if you had butchered it yourself.\n<\/li><li>\nOnly the person who set a snare, and the owner and members of the claim it stands in, can see what it holds. Everyone else sees only that it has caught something.\n<\/li><li>\nOnly you, or a member of the claim it stands in, can take the catch.\n<\/li><li>\nIt sets itself again afterwards, so you do not have to tend it. After a number of catches it falls apart, and picking it up and setting it down again does not renew it.\n<\/li><\/ul>\n<p>Next: <a href=\"#foes-and-dungeons\">Foes<\/a><\/p>", "text": "Animals tells you what lives in the world. This page is about getting meat, hide and fur from it. Every kill is dressed the same way: meat, plus a hide or fur where the animal has one, and sometimes something extra (a grown deer also gives antler). Striking With a spear or a blade in hand, left click strikes an animal in reach. A struck animal bolts, so expect a chase; the more it is hurt, the slower it runs. Sneaking up on a calm animal and striking from a sneak can land a critical hit, and training Stalking makes those hits more frequent and harder. Each strike wears your weapon. Butcher what you killed with a blade where it fell, before it fades away. Weapon skills Each kind of weapon trains its own skill, and every strike teaches it a little: Spears for a spear. Axes for the stone axe and the hand axe. Blades for a knife or any other edged tool. Archery for the bow. A higher skill makes each blow hit harder: a novice strikes noticeably softer than a master with the same weapon, and a better-made weapon adds to that. The skill matters more than the weapon, but both count. Blunt weapons and Throwing exist as skills too, but there is no weapon that trains them yet. These are specialties, so like Potter or Builder they share your fixed total (see Crafting and skills ); you cannot master every one on a single character. Fighting skills rise more slowly than crafting skills. Stalking, which makes sneak attacks land, is a separate skill trained by hunting. The bow A bow shoots from further away than any thrust of a spear. String one from sticks and cordage (you need something sharp to cut with), and make arrows from sticks and fiber; arrows fletched with feathers fly truer. Arrows are used up when you shoot. Take the bow in hand with its hotbar key and carry at least one arrow in your bag. Face the animal you want and press the strike key (left click): the game picks the nearest animal in front of you within range, and the arrow flies. Hits do full damage up to a fair distance and less beyond it, and something in the way (a tree, a wall) stops the arrow. Each shot wears the bow a little; a spent bow stays in your bag but will not shoot until you mend it. The rabbit snare A snare lets the woods work for you. Tie one from cordage and two sticks; no station is needed. Set it down near a warren, where rabbits run, the same way you set down any made thing (drag it out of the bag, or use its hotbar key). Then walk away. A rabbit that comes close may be caught as it passes. Not every pass catches one, and lingering rabbits do not improve the odds. A snare holds one catch at a time. When it holds one, use it to take the rabbit; you get the meat and fur as if you had butchered it yourself. Only the person who set a snare, and the owner and members of the claim it stands in, can see what it holds. Everyone else sees only that it has caught something. Only you, or a member of the claim it stands in, can take the catch. It sets itself again afterwards, so you do not have to tend it. After a number of catches it falls apart, and picking it up and setting it down again does not renew it. Next: Foes"}, {"slug": "foes-and-dungeons", "group": "The wild", "title": "Foes", "path": "", "html": "<p>Out in the wild, a few creatures will fight you. This page covers who they are and how to come back from a meeting with something to show for it. Foes are new and still growing in number, so expect more kinds and more places over time.<\/p>\n<h2 data-h=\"who-you-meet\">Who you meet<\/h2>\n<ul><li>\n<strong>Gloom creatures<\/strong> are born of the dark: small drifting sprites, low hounds that hunt in pairs, and the tall gloom warden with its lantern. They only come out between dusk and dawn, they fade away at sunrise, and fire warmth and a carried torch make them flinch.\n<\/li><li>\n<strong>Goblins<\/strong> are small, hunched and mean: foragers, and spear-carrying guards in tougher country. A goblin that notices you calls every goblin of its camp. Some goblins have names of their own: a named goblin may taunt you in a private message, or shout in chat when you come near its camp. <strong>Monsters in chat<\/strong> in Options mutes them.\n<\/li><li>\n<strong>Bone rattlers<\/strong> are old bones that walk the barrows.\n<\/li><li>\n<strong>Spiders<\/strong> keep to webbed groves, which sit in a cold pale mist, thicker at night; <strong>shade stalkers<\/strong> trail the light you carry, and the <strong>Watcher<\/strong> on the peaks freezes in light and fights only once hurt.\n<\/li><\/ul>\n<p>Foes hold goblin villages, skeleton rings, crypts, war camps and the high peaks. Where those lie is yours to find, and the stronger foes keep to the harder country. They do not walk into claims or through walls, fences, trunks and boulders.<\/p>\n<h2 data-h=\"fighting\">Fighting<\/h2>\n<ul><li>\nLeft click on a foe to strike. Which weapon skill you train matters a great deal (see <a href=\"#hunting-and-snares\">Hunting and snares<\/a>); bare hands only scratch.\n<\/li><li>\nA foe holds still while it winds up a swing. Step out of reach in that moment and the swing misses.\n<\/li><li>\nA foe chases the last player who hit it for a short while. If you get far enough away it gives up, walks home and mends.\n<\/li><li>\nA bow works on foes from a distance, though a goblin guard's shield stops most arrows.\n<\/li><li>\n<strong>Weapon arts.<\/strong> Once you are skilled enough with a weapon, hold the strike button to ready its special move and let it fly. Further on, R uses a second art. The weapon in your hand shows the art charging and how long until it is ready again, and the key for the second art shows above it once you have it.\n<\/li><li>\n<strong>Armour<\/strong> softens every blow and arrow that lands on you. The equipment panel (I) says how much your armour takes off each hit. Hide armour comes first; copper and bronze come with smithing (see <a href=\"#mining\">Mining<\/a>).\n<\/li><li>\n<strong>Picking a target.<\/strong> Tab picks the nearest foe, and each press after that picks the next one further out; Shift+Tab steps back, and Esc lets go. You can also click a foe. A painted ring on the ground marks it, and your spells go to it whenever it is in front of you and in range. A player who has hurt you in the last few seconds can be picked the same way. The target is let go when it falls, wanders far off or drops out of sight behind a hill.\n<\/li><li>\n<strong>Frames.<\/strong> In a fight, your own frame shows over the hotbar with your health, and your target's beside it with its name, tier and health. Stronger foes wear a brass ring (elite) or a crown (boss) on their picture, and a gold bar under the target's frame fills while it winds up a blow, with a word on what is coming. Every foe fighting you carries a small health bar over its head.\n<\/li><li>\n<strong>Reading the fight.<\/strong> The foe you face shows its name over its head. Words beside you say when you stepped clear of a swing, when a shield caught a blow, and when your own blow missed. Blows flash where they land, and a foe's swing shows which side it came from.\n<\/li><li>\nYour health bar holds 50 and refills slowly on its own.\n<\/li><li>\nWhen a foe hits you, you flinch, and your knees give way if you fall.\n<\/li><li>\nFighting is blocked near the spawn area, and a new player is spared for a while. Striking or shooting a foe yourself ends that grace early.\n<\/li><\/ul>\n<h2 data-h=\"falling\">Falling<\/h2>\n<p>Being struck down by a foe is an ordinary death, and the card says what felled you: what was in your bag drops where you fell, and you go back for it (see <a href=\"#needs\">Needs<\/a>). Go out with only what you can afford to lose.<\/p>\n<h2 data-h=\"what-they-leave-behind\">What they leave behind<\/h2>\n<p>A felled foe lies still for a moment, then leaves loot; about a minute later it is gone, and before long another takes its place. The stronger the foe, the better the things it can drop, and each family has its own table. Gloom foes leave mist-dark fur, gem chips and rune stones; with the Gemcraft skill, chips can be fused and a rough gem cut. Cave rooms hold loot of their own, and each boss guards a hoard. A cleared spot fills up again after some days, so a good place to hunt is a good place to come back to. You cannot claim land close to a foe site (see <a href=\"#building-and-claims\">Building and claims<\/a>).<\/p>\n<p>Next: <a href=\"#other-players\">Other players<\/a><\/p>", "text": "Out in the wild, a few creatures will fight you. This page covers who they are and how to come back from a meeting with something to show for it. Foes are new and still growing in number, so expect more kinds and more places over time. Who you meet Gloom creatures are born of the dark: small drifting sprites, low hounds that hunt in pairs, and the tall gloom warden with its lantern. They only come out between dusk and dawn, they fade away at sunrise, and fire warmth and a carried torch make them flinch. Goblins are small, hunched and mean: foragers, and spear-carrying guards in tougher country. A goblin that notices you calls every goblin of its camp. Some goblins have names of their own: a named goblin may taunt you in a private message, or shout in chat when you come near its camp. Monsters in chat in Options mutes them. Bone rattlers are old bones that walk the barrows. Spiders keep to webbed groves, which sit in a cold pale mist, thicker at night; shade stalkers trail the light you carry, and the Watcher on the peaks freezes in light and fights only once hurt. Foes hold goblin villages, skeleton rings, crypts, war camps and the high peaks. Where those lie is yours to find, and the stronger foes keep to the harder country. They do not walk into claims or through walls, fences, trunks and boulders. Fighting Left click on a foe to strike. Which weapon skill you train matters a great deal (see Hunting and snares ); bare hands only scratch. A foe holds still while it winds up a swing. Step out of reach in that moment and the swing misses. A foe chases the last player who hit it for a short while. If you get far enough away it gives up, walks home and mends. A bow works on foes from a distance, though a goblin guard's shield stops most arrows. Weapon arts. Once you are skilled enough with a weapon, hold the strike button to ready its special move and let it fly. Further on, R uses a second art. The weapon in your hand shows the art charging and how long until it is ready again, and the key for the second art shows above it once you have it. Armour softens every blow and arrow that lands on you. The equipment panel (I) says how much your armour takes off each hit. Hide armour comes first; copper and bronze come with smithing (see Mining ). Picking a target. Tab picks the nearest foe, and each press after that picks the next one further out; Shift+Tab steps back, and Esc lets go. You can also click a foe. A painted ring on the ground marks it, and your spells go to it whenever it is in front of you and in range. A player who has hurt you in the last few seconds can be picked the same way. The target is let go when it falls, wanders far off or drops out of sight behind a hill. Frames. In a fight, your own frame shows over the hotbar with your health, and your target's beside it with its name, tier and health. Stronger foes wear a brass ring (elite) or a crown (boss) on their picture, and a gold bar under the target's frame fills while it winds up a blow, with a word on what is coming. Every foe fighting you carries a small health bar over its head. Reading the fight. The foe you face shows its name over its head. Words beside you say when you stepped clear of a swing, when a shield caught a blow, and when your own blow missed. Blows flash where they land, and a foe's swing shows which side it came from. Your health bar holds 50 and refills slowly on its own. When a foe hits you, you flinch, and your knees give way if you fall. Fighting is blocked near the spawn area, and a new player is spared for a while. Striking or shooting a foe yourself ends that grace early. Falling Being struck down by a foe is an ordinary death, and the card says what felled you: what was in your bag drops where you fell, and you go back for it (see Needs ). Go out with only what you can afford to lose. What they leave behind A felled foe lies still for a moment, then leaves loot; about a minute later it is gone, and before long another takes its place. The stronger the foe, the better the things it can drop, and each family has its own table. Gloom foes leave mist-dark fur, gem chips and rune stones; with the Gemcraft skill, chips can be fused and a rough gem cut. Cave rooms hold loot of their own, and each boss guards a hoard. A cleared spot fills up again after some days, so a good place to hunt is a good place to come back to. You cannot claim land close to a foe site (see Building and claims ). Next: Other players"}, {"slug": "fishing", "group": "The wild", "title": "Fishing", "path": "", "html": "<p>Fish are a light, steady meal for anyone who lives near water.<\/p>\n<h2 data-h=\"what-you-need\">What you need<\/h2>\n<p>A fishing line: a cord on a stick, with a sharp stone tied on as a hook. It wears down a little with each fish and can be mended at a repair table.<\/p>\n<h2 data-h=\"casting\">C
